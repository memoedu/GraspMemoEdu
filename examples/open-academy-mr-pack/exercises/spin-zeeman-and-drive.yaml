  - id: zeeman-final-explain
    dimension: conceptual
    type: explain
    role: core
    difficulty: 2
    est_minutes: 4
    prompt: "请用自己的话系统阐述以下三个核心问题：（1）为什么静磁场中电子和质子的上下能级顺序及劈裂频率大小不同？（2）如何由 $-\\vec{\\boldsymbol{\\mu}}\\cdot\\boldsymbol{B}(t)$ 写出标准驱动哈密顿量 $H = \\omega_0 S_z + 2\\Omega\\cos(\\omega t+\\varphi)S_x$（并说明何时会出现 $B_z$ 项）？（3）自旋磁共振模型与《量子光学》电偶极二能级原子模型如何建立一一对应的字典？"
    rubric:
      - id: r1
        criterion: "说明由 $H_0 = -\\gamma B_0 S_z$，电子因 $\\gamma_e < 0$ 使 $|m_S=-1/2\\rangle$ 为下态且处于 $\\text{MHz/G}$ 量级，质子因 $\\gamma_n > 0$ 与质量大约千倍而使 $|m_S=+1/2\\rangle$ 为下态且处于 $\\text{kHz/G}$ 量级。"
        weight: 1
        required: true
      - id: r2
        criterion: "说明将 $\\vec{\\boldsymbol{\\mu}} = \\gamma\\vec{\\boldsymbol{S}}$ 与垂直驱动磁场（$\\theta_B=90^\\circ, B_z=0$；斜置会有 $B_z$ 投影）代入并除以 $\\hbar$，定义 $\\omega_0=-\\gamma_e B_0$ 与 $2\\Omega=-\\gamma_e B_x$ 得到标准驱动哈密顿量。"
        weight: 1
        required: true
      - id: r3
        criterion: "完整写出双源映射字典：$|m_S=-1/2\\rangle\\leftrightarrow|g\\rangle$、$|m_S=+1/2\\rangle\\leftrightarrow|e\\rangle$、$2S_z\\leftrightarrow\\hat{\\sigma}_3$、$2S_x\\leftrightarrow\\hat{\\sigma}_+ + \\hat{\\sigma}_-$，以及 $\\Omega\\leftrightarrow V/\\hbar$。"
        weight: 1
        required: true
      - id: r4
        criterion: "补充指出把驱动系数定义为 $2\\Omega$ 是为了便于后续旋波近似拆分，或指出量子光学电偶极无对角元的宇称原因。"
        weight: 1
        required: false
    exemplar: "在静磁场 $B_0 > 0$ 中，由 $H_0 = -\\gamma B_0 S_z$，电子的负旋磁比（$\\text{MHz/G}$ 量级）使 $|m_S=-1/2\\rangle$ 为下态，而质子的正旋磁比（因质量大约千倍而仅为 $\\text{kHz/G}$ 量级）使 $|m_S=+1/2\\rangle$ 为下态。再加入垂直于 $B_0$ 轴（$\\theta_B = 90^\\circ, B_z = 0$）的横向驱动场 $B_x\\cos(\\omega t+\\varphi)\\vec{\\boldsymbol{e}}_x$ 并除以 $\\hbar$ 无量纲化，定义 $\\omega_0=-\\gamma_e B_0$ 与 $2\\Omega=-\\gamma_e B_x$ 即得 $H = \\omega_0 S_z + 2\\Omega\\cos(\\omega t+\\varphi)S_x$。对照《量子光学》电偶极近似下的二能级原子，$\\hat{\\sigma}_3 \\leftrightarrow 2S_z$、$\\hat{\\sigma}_+ + \\hat{\\sigma}_- \\leftrightarrow 2S_x$、$|g\\rangle\\leftrightarrow|m_S=-1/2\\rangle$、$|e\\rangle\\leftrightarrow|m_S=+1/2\\rangle$，且驱动强度满足 $\\Omega = V/\\hbar$。"
