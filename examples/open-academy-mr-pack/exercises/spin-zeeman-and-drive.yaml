  # ==========================================================================
  # Step 3: optical-electric-dipole-isomorphism (5 题课堂 + 3 题 recall)
  # ==========================================================================
  - id: zm-optical-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: "在把量子光学二能级原子模型 $\\hat{H}/\\hbar = \\frac{1}{2}\\omega_0\\hat{\\sigma}_3 + (V/\\hbar)\\cos(\\omega t)(\\hat{\\sigma}_+ + \\hat{\\sigma}_-)$ 映射到电子自旋 $H = \\omega_0 S_z + 2\\Omega\\cos(\\omega t)S_x$ 时，下列哪组态与算符对应完全正确？"
    options:
      - id: a
        text: "$|g\\rangle \\leftrightarrow |m_S = -1/2\\rangle$，$|e\\rangle \\leftrightarrow |m_S = +1/2\\rangle$，$\\hat{\\sigma}_3 \\leftrightarrow 2S_z$，$\\hat{\\sigma}_+ + \\hat{\\sigma}_- \\leftrightarrow 2S_x$。"
        correct: true
        feedback: "完全准确！下态配对 $|g\\rangle$、上态配对 $|e\\rangle$，于是 $\\frac{1}{2}\\hat{\\sigma}_3$ 正好等于 $S_z$，且 $(\\hat{\\sigma}_+ + \\hat{\\sigma}_-)$ 正好等于 $2S_x$。"
      - id: b
        text: "$|g\\rangle \\leftrightarrow |m_S = +1/2\\rangle$，$|e\\rangle \\leftrightarrow |m_S = -1/2\\rangle$，$\\hat{\\sigma}_3 \\leftrightarrow S_z$，$\\hat{\\sigma}_+ + \\hat{\\sigma}_- \\leftrightarrow S_x$。"
        correct: false
        feedback: "对电子自旋，下能级是 $|m_S=-1/2\\rangle$ 而不是 $|m_S=+1/2\\rangle$；同时 $\\hat{\\sigma}_3$ 本征值是 $\\pm 1$ 而非 $\\pm 1/2$，差了 $2$ 倍因子。"
      - id: c
        text: "$|g\\rangle \\leftrightarrow |m_S = -1/2\\rangle$，$|e\\rangle \\leftrightarrow |m_S = +1/2\\rangle$，$\\hat{\\sigma}_3 \\leftrightarrow S_z$，$\\hat{\\sigma}_+ + \\hat{\\sigma}_- \\leftrightarrow 2S_x$。"
        correct: false
        feedback: "$\\hat{\\sigma}_3 = |e\\rangle\\langle e| - |g\\rangle\\langle g|$ 的本征值是 $\\pm 1$，而 $S_z$ 的本征值是 $\\pm 1/2$，因此必须有 $\\hat{\\sigma}_3 \\leftrightarrow 2S_z$。"
      - id: d
        text: "只有在共振条件 $\\omega = \\omega_0$ 成立时两种系统才能映射，非共振下矩阵结构完全不同。"
        correct: false
        feedback: "哈密顿量的算符同构在任意驱动频率 $\\omega$ 下都严格成立。"
    solution: "在基矢映射 $|g\\rangle \\leftrightarrow |m_S=-1/2\\rangle$、$|e\\rangle \\leftrightarrow |m_S=+1/2\\rangle$ 下，算符对照关系为 $\\hat{\\sigma}_3 \\leftrightarrow 2S_z$ 与 $\\hat{\\sigma}_+ + \\hat{\\sigma}_- \\leftrightarrow 2S_x$。"

  - id: zm-optical-self-explain
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "在对照两条哈密顿量时，为什么原子耦合强度 $(V/\\hbar)$ 直接等于磁共振里的 $\\Omega$，而不是等于 $2\\Omega$（即不是 $\\Omega = V/(2\\hbar)$）？"
    options:
      - id: a
        text: "因为磁共振驱动项写的是 $2\\Omega S_x = \\Omega(2S_x)$，而恰好是 $2S_x$（而非 $S_x$）整体对应着光偶极里的 $(\\hat{\\sigma}_+ + \\hat{\\sigma}_-)$，因此系数对等给出 $\\Omega = V/\\hbar$。"
        correct: true
        feedback: "一点就透！如果误以为 $S_x$ 对应 $\\hat{\\sigma}_+ + \\hat{\\sigma}_-$ 就会少算或错算因子 $2$；检查两个分量的矩阵元立刻证明 $(2S_x) = \\hat{\\sigma}_+ + \\hat{\\sigma}_-$。"
      - id: b
        text: "因为量子光学中的 $V$ 自带了 $2\\pi$ 换算因子，除以 $\\hbar$ 后自动消去系数 $2$。"
        correct: false
        category: incorrect_reasoning
        feedback: "$V = -\\langle e|\\hat{\\boldsymbol{d}}\\cdot\\boldsymbol{E}_0|g\\rangle$ 是能量矩阵元，不自带 $2\\pi$ 因子；系数匹配完全来自 $2S_x = \\hat{\\sigma}_+ + \\hat{\\sigma}_-$ 的 $2$ 倍关系。"
      - id: c
        text: "因为光子是自旋为 $1$ 的玻色子，比自旋 $1/2$ 电子多出 $2$ 倍角动量。"
        correct: false
        category: missing_prerequisite
        feedback: "这里只是把二能级哈密顿量的代数系数对齐，起作用的是自旋 $1/2$ 与二能级原子伪自旋矩阵元之间 $\\pm 1/2$ 对 $\\pm 1$ 的算符归一化差异。"
      - id: d
        text: "因为只有在零时刻 $t=0$ 时才取 $\\Omega = V/\\hbar$，其余时刻差 $1/2$。"
        correct: false
        category: incorrect_reasoning
        feedback: "两个常数参数的对照关系与时间 $t$ 无关。"
    solution: "因为 $2S_x$ 与 $(\\hat{\\sigma}_+ + \\hat{\\sigma}_-)$ 互相等价（两者的非对角矩阵元均为 $1$），所以 $2\\Omega\\cos(\\omega t)S_x = \\Omega\\cos(\\omega t)(2S_x)$ 对照 $(V/\\hbar)\\cos(\\omega t)(\\hat{\\sigma}_+ + \\hat{\\sigma}_-)$ 必然得出 $\\Omega = V/\\hbar$。"

  - id: zm-optical-dipole-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 3
    params:
      V_mhz:
        min: 4
        max: 20
        step: 4
    prompt: "在激光与二能级原子耦合实验中，偶极矩阵元强度满足 $V/h = V/(2\\pi\\hbar) = {{=V_mhz}}\\text{ MHz}$。若将其改写为磁共振标准哈密顿量 $H = \\omega_0 S_z + 2\\Omega\\cos(\\omega t)S_x$ 的形式，对应驱动系数 $2\\Omega/(2\\pi)$ 应写为多少 $\\text{MHz}$？"
    answer_expr: "2 * V_mhz"
    tolerance:
      abs: 0.01
    common_wrong:
      - answer_expr: "V_mhz"
        category: misapplied_technique
        feedback: "$V/h = {{=V_mhz}}\\text{ MHz}$ 对应的是单分量参数 $\\Omega/(2\\pi)$，题干问的是线偏振驱动项总系数 $2\\Omega/(2\\pi)$，需要乘以 $2$。"
      - answer_expr: "V_mhz / 2"
        category: math_error
        feedback: "不要重复除以 $2$：$2S_x \\leftrightarrow \\hat{\\sigma}_+ + \\hat{\\sigma}_-$ 意味着 $\\Omega = V/\\hbar$，从而 $2\\Omega = 2V/\\hbar$。"
    hints:
      - "先利用映射结论 $\\Omega/(2\\pi) = V/(2\\pi\\hbar) = V/h$。"
      - "题目问的是 $2\\Omega/(2\\pi)$，把 $\\Omega/(2\\pi)$ 乘以 $2$。"
    solution: "由 $\\Omega/(2\\pi) = V/h = {{=V_mhz}}\\text{ MHz}$，可得线偏振驱动项总系数 $2\\Omega/(2\\pi) = 2\\times {{=V_mhz}} = {{=2*V_mhz}}\\text{ MHz}$。"

  - id: zm-optical-spot-mistake
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "某同学在对比自旋磁共振与《量子光学》二能级原子模型时，写出：『$\\hat{H}_A/\\hbar = \\omega_0\\hat{\\sigma}_3$，因此原子基态能量 $-\\omega_0$ 与激发态能量 $+\\omega_0$ 的差值为 $2\\omega_0$』。这处错在哪里？"
    options:
      - id: a
        text: "忘了对称零能点约定下的 $\\frac{1}{2}$ 因子：应为 $\\hat{H}_A/\\hbar = \\frac{1}{2}\\omega_0\\hat{\\sigma}_3$，这样 $|e\\rangle$ 与 $|g\\rangle$ 能量分别为 $+\\omega_0/2$ 和 $-\\omega_0/2$，能隙才正好等于 $\\omega_0$。"
        correct: true
        feedback: "抓得非常准！$\\hat{\\sigma}_3$ 的本征值是 $\\pm 1$，所以前面必须带有 $\\frac{1}{2}$，才与本征值 $\\pm 1/2$ 的 $\\omega_0 S_z$ 一样给出能隙 $\\omega_0$。"
      - id: b
        text: "因为 $\\hat{\\sigma}_3 = |e\\rangle\\langle e| - |g\\rangle\\langle g|$ 的两个本征值是 $+1/2$ 和 $-1/2$，能隙依然是 $\\omega_0$。"
        correct: false
        category: misunderstood_definition
        feedback: "$\\hat{\\sigma}_3|e\\rangle = +|e\\rangle$、$\\hat{\\sigma}_3|g\\rangle = -|g\\rangle$，本征值差为 $(+1)-(-1)=2$，不是 $1$。"
      - id: c
        text: "电子自旋没有能隙 $\\omega_0$，只有电偶极原子才把零能量点放在中间。"
        correct: false
        category: incorrect_reasoning
        feedback: "电子自旋 $\\omega_0 S_z$ 同样自然把零能点取在 $\\pm\\omega_0/2$ 正中，总能隙也是 $\\omega_0$。"
      - id: d
        text: "错把 $\\hat{\\sigma}_3$ 当成了横向耦合算符，应该改写为 $\\hat{\\sigma}_+ + \\hat{\\sigma}_-$。"
        correct: false
        category: misunderstood_definition
        feedback: "$\\hat{\\sigma}_3$ 确实表示自由原子静态能级，只是表达式前面漏掉了 $\\frac{1}{2}$ 因子。"
    solution: "由于 $\\hat{\\sigma}_3|e\\rangle = +|e\\rangle$ 且 $\\hat{\\sigma}_3|g\\rangle = -|g\\rangle$，要让两能级能量差为 $\\omega_0$，自由原子项必须是 $\\hat{H}_A/\\hbar = \\frac{1}{2}\\omega_0\\hat{\\sigma}_3$（对应自旋 $\\omega_0 S_z$）。"

  - id: zm-optical-transfer
    dimension: transfer
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 3
    prompt: "设二能级原子的基态 $|g\\rangle$ 与激发态 $|e\\rangle$ 分别为具有确定宇称的能量本征态，置于单色激光场 $\\boldsymbol{E}(t) = \\boldsymbol{E}_0\\cos(\\omega t)$ 中。为什么电偶极相互作用 $\\hat{H}_{\\text{int}} = -\\hat{\\boldsymbol{d}}\\cdot\\boldsymbol{E}(t)$ 在 $\\{|e\\rangle, |g\\rangle\\}$ 基下自然写成纯粹的非对角形式 $V\\cos(\\omega t)(\\hat{\\sigma}_+ + \\hat{\\sigma}_-)$，在结构上严格等价于垂直驱动（$\\theta_B = 90^\\circ, B_z = 0$）下的自旋横向项 $2\\Omega\\cos(\\omega t)S_x$？"
    options:
      - id: a
        text: "因为定态的确定宇称与奇宇称电偶极算符 $\\hat{\\boldsymbol{d}} = -e\\hat{\\boldsymbol{r}}$ 使对角期望 $\\langle g|\\hat{\\boldsymbol{d}}|g\\rangle = \\langle e|\\hat{\\boldsymbol{d}}|e\\rangle = 0$，只留 $|e\\rangle\\langle g|$ 与 $|g\\rangle\\langle e|$ 耦合（对应 $2S_x$）；而垂直磁场几何也恰好消除了纵向项 $B_z S_z$。"
        correct: true
        feedback: "迁移深刻！宇称选择定则天然消除了电偶极的纵向 $\\hat{\\sigma}_3$ 对角项，使其在结构上与垂直驱动（$B_z = 0$）下的纯横向自旋项 $2\\Omega S_x$ 严格同构。"
      - id: b
        text: "因为电偶极矩阵元 $V$ 必须是纯虚数，使得 $\\hat{\\sigma}_3$ 前的系数自动变成零。"
        correct: false
        category: incorrect_reasoning
        feedback: "零对角元的根本物理原因是波函数的宇称对称性使奇算符 $\\hat{\\boldsymbol{d}}=-e\\hat{\\boldsymbol{r}}$ 期望值为零，而不是矩阵元的实虚性。"
      - id: c
        text: "因为可见光的波长与原子半径相等（$k\\cdot r = 1$），电偶极作用必须只保留非对角项。"
        correct: false
        category: misunderstood_definition
        feedback: "电偶极近似的前提是波长远大于原子尺度（$k\\cdot r \\ll 1$），使空间场强可看作均匀场。"
      - id: d
        text: "因为自旋 $1/2$ 系统中不存在纵向 $S_z$ 算符，任何磁场驱动都只能给出 $S_x$。"
        correct: false
        category: missing_prerequisite
        feedback: "如果驱动线圈倾斜（$\\theta_B \\ne 90^\\circ$），磁共振中完全可能出现纵向项 $B_z S_z\\cos(\\omega t+\\varphi)$。"
    solution: "电偶极近似（$k\\cdot r \\ll 1$）结合原子本征态的宇称选择规则保证了电偶极算符对角元为零，因此只有 $\\hat{\\sigma}_+ + \\hat{\\sigma}_-$ 形式的非对角耦合，与垂直驱动几何（$\\theta_B=90^\\circ, B_z=0$）下的横向 $S_x$ 耦合严格同构。"

  - id: zm-recall-optical-say
    dimension: conceptual
    type: explain
    role: recall
    knowledge_point: optical-electric-dipole-isomorphism
    difficulty: 1
    est_minutes: 1
    prompt: "用一两句话给出自旋磁共振标准哈密顿量与《量子光学》半经典电偶极哈密顿量之间的算符与参数对照字典。"
    rubric:
      - id: r1
        criterion: "写出能级对应：$|m_S=-1/2\\rangle \\leftrightarrow |g\\rangle$、$|m_S=+1/2\\rangle \\leftrightarrow |e\\rangle$，以及算符对应 $2S_z \\leftrightarrow \\hat{\\sigma}_3$、$2S_x \\leftrightarrow \\hat{\\sigma}_+ + \\hat{\\sigma}_-$。"
        weight: 1
        required: true
      - id: r2
        criterion: "明确指出耦合频率对照关系为 $\\Omega \\leftrightarrow V/\\hbar$（或 $2\\Omega\\leftrightarrow 2V/\\hbar$）。"
        weight: 1
        required: true
    exemplar: "将电子自旋下能级 $|m_S=-1/2\\rangle$ 对应原子基态 $|g\\rangle$、上能级 $|m_S=+1/2\\rangle$ 对应激发态 $|e\\rangle$ 后，有 $\\hat{\\sigma}_3 \\leftrightarrow 2S_z$ 与 $\\hat{\\sigma}_+ + \\hat{\\sigma}_- \\leftrightarrow 2S_x$，电偶极耦合 $\\hat{H}/\\hbar = \\frac{1}{2}\\omega_0\\hat{\\sigma}_3 + (V/\\hbar)\\cos(\\omega t)(\\hat{\\sigma}_+ + \\hat{\\sigma}_-)$ 恰与 $H = \\omega_0 S_z + 2\\Omega\\cos(\\omega t)S_x$ 在 $\\Omega = V/\\hbar$ 下完全同构。"

  - id: zm-recall-optical-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: optical-electric-dipole-isomorphism
    difficulty: 1
    est_minutes: 0.5
    prompt: "在对比磁共振驱动项 $2\\Omega\\cos(\\omega t)S_x$ 与《量子光学》电偶极驱动项 $(V/\\hbar)\\cos(\\omega t)(\\hat{\\sigma}_+ + \\hat{\\sigma}_-)$ 时，如果令电子自旋取相同动力学参数，应当满足哪一关系？"
    options:
      - id: a
        text: "$\\Omega = V/\\hbar$"
        correct: true
        feedback: "正确。因 $2S_x = \\hat{\\sigma}_+ + \\hat{\\sigma}_-$，比较系数即得 $\\Omega = V/\\hbar$。"
      - id: b
        text: "$\\Omega = V/(2\\hbar)$"
        correct: false
        feedback: "漏掉了 $2S_x$ 自带的 $2$ 倍关系；如果是只跟 $S_x$ 对比才是两倍，这里跟 $(\\hat{\\sigma}_+ + \\hat{\\sigma}_-) = 2S_x$ 对比。"
      - id: c
        text: "$\\Omega = 2V/\\hbar$"
        correct: false
        feedback: "弄反了比例方向：$2\\Omega$ 才等于 $2V/\\hbar$，因此 $\\Omega = V/\\hbar$。"
      - id: d
        text: "$\\Omega = -\\gamma_e V$"
        correct: false
        feedback: "$V$ 本身已经是耦合能量矩阵元，不含旋磁比 $\\gamma_e$，只需除以 $\\hbar$ 成为角频率。"
    solution: "因算符上 $2S_x \\leftrightarrow \\hat{\\sigma}_+ + \\hat{\\sigma}_-$，代入 $2\\Omega S_x = \\Omega(2S_x)$ 对照 $(V/\\hbar)(\\hat{\\sigma}_+ + \\hat{\\sigma}_-)$，可得 $\\Omega = V/\\hbar$。"

  - id: zm-recall-optical-formula
    dimension: math
