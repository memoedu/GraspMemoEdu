    prompt: "用一两句话说明：磁共振哈密顿量是如何从 $H = -\\vec{\\boldsymbol{\\mu}}\\cdot\\boldsymbol{B}$ 化成无量纲标准式 $H = \\omega_0 S_z + 2\\Omega\\cos(\\omega t+\\varphi)S_x$ 的？"
    rubric:
      - id: r1
        criterion: "说明先代入 $\\vec{\\boldsymbol{\\mu}} = \\gamma\\vec{\\boldsymbol{S}}$ 与总磁场 $\\boldsymbol{B}(t) = B_0\\vec{\\boldsymbol{e}}_z + B_x\\cos(\\omega t+\\varphi)\\vec{\\boldsymbol{e}}_x$（垂直驱动 $\\theta_B = 90^\\circ$ 时忽略 $B_z$），并除以 $\\hbar$ 使 $\\vec{\\boldsymbol{S}}$ 无量纲化。"
        weight: 1
        required: true
      - id: r2
        criterion: "写出电子自旋的参数定义 $\\omega_0 = -\\gamma_e B_0$ 与 $2\\Omega = -\\gamma_e B_x$（明确系数是磁场振幅 $B_x$）。"
        weight: 1
        required: true
    exemplar: "将 $\\vec{\\boldsymbol{\\mu}}=\\gamma\\vec{\\boldsymbol{S}}$ 和垂直布置（$B_z=0$）的总磁场代入 $H = -\\vec{\\boldsymbol{\\mu}}\\cdot\\boldsymbol{B}(t)$ 后，两边同除以 $\\hbar$ 让自旋算符无量纲化；再对电子自旋定义 $\\omega_0 = -\\gamma_e B_0$ 与 $2\\Omega = -\\gamma_e B_x$，即化为 $H = \\omega_0 S_z + 2\\Omega\\cos(\\omega t+\\varphi)S_x$。"

  - id: zm-recall-drive-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: transverse-drive-hamiltonian
    difficulty: 1
    est_minutes: 0.5
    prompt: "在电子自旋标准磁共振哈密顿量 $H = \\omega_0 S_z + 2\\Omega\\cos(\\omega t+\\varphi)S_x$ 的定义中，下列哪组参数替换完全正确？"
    options:
      - id: a
        text: "$\\omega_0 = -\\gamma_e B_0$ 且 $2\\Omega = -\\gamma_e B_x$"
        correct: true
        feedback: "正确。两个定义里都用负号抵消 $\\gamma_e < 0$，且驱振参数只含外磁场振幅 $B_x$，绝不是算符 $S_x$。"
      - id: b
        text: "$\\omega_0 = -\\gamma_e B_0$ 且 $2\\Omega = -\\gamma_e S_x$"
        correct: false
        feedback: "把横向驱动场振幅 $B_x$ 错写成了算符 $S_x$，类型与量纲都不匹配。"
      - id: c
        text: "$\\omega_0 = +\\gamma_e B_0$ 且 $\\Omega = -\\gamma_e B_x$"
        correct: false
        feedback: "符号与因子 $2$ 同时错位：$\\gamma_e < 0$ 需要加负号令 $\\omega_0 > 0$，且 $-\\gamma_e B_x$ 等于 $2\\Omega$ 而非 $\\Omega$。"
      - id: d
        text: "$\\omega_0 = -\\gamma_e B_x$ 且 $2\\Omega = -\\gamma_e B_0$"
        correct: false
        feedback: "静磁场 $B_0$ 决定 $\\omega_0$，交变磁场 $B_x$ 决定 $2\\Omega$，两者颠倒了。"
    solution: "对电子自旋（$\\gamma_e < 0$），将 $-\\gamma_e B_0 S_z - \\gamma_e B_x\\cos(\\omega t+\\varphi)S_x$ 记作 $\\omega_0 S_z + 2\\Omega\\cos(\\omega t+\\varphi)S_x$ 时，定义 $\\omega_0 = -\\gamma_e B_0$ 与 $2\\Omega = -\\gamma_e B_x$。"

