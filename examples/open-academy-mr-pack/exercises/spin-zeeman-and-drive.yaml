    prompt: "若已知量子光学电偶极二能级模型的耦合能量矩阵元 $V$ 与普朗克常数 $\\hbar$，写出与之等价的磁共振线性项总系数 $2\\Omega$（用 `V` 和 `hbar` 表示）。"
    answer: "2 * V / hbar"
    variables:
      V: [1, 20]
      hbar: [1, 5]
    solution: "因为 $\\Omega = V/\\hbar$，所以写入 $H = \\omega_0 S_z + 2\\Omega\\cos(\\omega t+\\varphi)S_x$ 中的总系数 $2\\Omega = 2V/\\hbar$。"

