  # Step 3: sideband-subharmonic-and-mas-transfer (5 题课堂/测验题 + 3 题 FSRS recall)
  # ==========================================================================
  - id: lsb-subharmonic-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: "当实验中只使用一根倾斜放置的驱动线圈（与静磁场夹角 $\\theta_B \\neq 90^\\circ$）时，为何能够实现频率远低于自旋能隙 $\\omega_0$ 的倍频（亚谐波）激发？"
    options:
      - id: a
        text: "因为同一根倾斜线圈同时在 $x$ 轴产生横向耦合 $\\Omega$、在 $z$ 轴产生同频纵向调制 $\\Omega_z$（$\\omega_z = \\omega$），令 $\\Delta_n = \\omega_0 + (n-1)\\omega = 0$ 后，当 $n = -1, -2, \\dots$ 时可在 $\\omega = \\omega_0 / (1-n)$ 处多光子协同共振。"
        correct: true
        feedback: "解释完全到位！横向分量提供 $\\Delta m_S = +1$ 的自旋翻转并贡献能量 $\\omega$，纵向调制提供不改变 $m_S$ 的额外 $|n|$ 份 $\\omega$ 能量，合起来以低频源跨越整倍能隙 $\\omega_0$。"
      - id: b
        text: "因为倾斜线圈会把静磁场 $B_0$ 削弱为原来的一半，使自旋能隙自动降到 $\\omega_0/2$。"
        correct: false
        feedback: "倾斜的是交变驱动线圈而不是静磁场；自旋静态能隙依然是 $\\omega_0$，改变的是交流场同时具备横向与纵向投影。"
      - id: c
        text: "因为当线圈倾斜时，旋波近似失效后正向分量与反向分量相加使驱动频率翻倍。"
        correct: false
        feedback: "正向与反向旋转分量角频率都是 $\\omega$，线性叠加不会凭空产生 $2\\omega$；倍频来自纵向分量引起的非线性相位调制 $e^{i\\chi\\sin(\\omega t+\\varphi)}$。"
      - id: d
        text: "因为电子自旋从 $|m_S = -1/2\\rangle$ 跃迁到 $|m_S = +1/2\\rangle$ 在倾斜场下只需要角动量变化 $\\Delta m_S = +1/2$。"
        correct: false
        feedback: "无论线圈怎样倾斜，量子态本征值差始终是 $\\Delta m_S = (+1/2) - (-1/2) = +1$；纵向调制改变的是能量匹配阶数，不改变跃迁角动量差。"
    solution: "倾斜单线圈使横向场和纵向场来自同一信号源（$\\omega_z = \\omega$）。将 $\\omega_z = \\omega$ 代入 $\\Delta_n = \\omega_0 - \\omega + n\\omega_z = 0$，得 $\\omega = \\frac{1}{1-n}\\omega_0$；取 $n = -1, -2, \\dots$ 即可用 $\\omega_0/2, \\omega_0/3, \\dots$ 等亚谐波频率激发跃迁。"

  - id: lsb-subharmonic-self-explain
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "在刚才 $\\omega_0/(2\\pi) = 10\\text{ GHz}$、倾斜线圈以 $\\omega/(2\\pi) = 5\\text{ GHz}$ 作 $n=-1$ 二倍频驱动的例题第 3 步中，为什么把驱动幅度 $\\Omega/(2\\pi) = \\Omega_z/(2\\pi)$ 从 $10\\text{ MHz}$ 提高 $5$ 倍到 $50\\text{ MHz}$ 后，有效边带耦合反而放大了 $25$ 倍（从 $10\\text{ kHz}$ 变为 $250\\text{ kHz}$）？"
    options:
      - id: a
        text: "因为在小调制极限 $\\chi \\ll 1$ 下，$|J_{-1}(\\chi)| \\approx \\chi/2 = \\Omega_z/(2\\omega)$ 也正比于驱动幅度，故有效耦合 $|J_{-1}(\\chi)|\\Omega \\approx \\frac{\\Omega_z\\Omega}{2\\omega}$ 随单线圈驱动幅度呈平方（$5^2=25$ 倍）增长。"
        correct: true
        feedback: "抓住了非线性倍频的核心规律！当 $\\Omega$ 与 $\\Omega_z$ 来自同一倾斜线圈时，两者同比例增大，$\\chi\\Omega$ 乘积自然呈现二次方放大。"
      - id: b
        text: "因为当驱动幅度变成 $50\\text{ MHz}$ 时，调制指数 $\\chi$ 跃升至 $J_0(\\chi)=0$ 零点附近，把所有载波能量瞬间转给了 $n=-1$ 边带。"
        correct: false
        category: incorrect_reasoning
        feedback: "此时 $\\chi = 50/5000 = 0.01$ 仍然远小于 $2.4048$，仍处于线性近似 $|J_{-1}(\\chi)| \\approx \\chi/2$ 成立的小调制区。"
      - id: c
        text: "因为驱动频率从 $10\\text{ GHz}$ 降为 $5\\text{ GHz}$ 时，需要把有效边带耦合强度额外乘以阶数平方 $(1-n)^2 = 4$。"
        correct: false
        category: math_error
        feedback: "前后对比保持同一频率 $5\\text{ GHz}$ 和同一阶次 $n=-1$；$25$ 倍变化完全源于 $\\chi$ 与 $\\Omega$ 同时放大 $5$ 倍。"
      - id: d
        text: "因为在 $\\Omega = 10\\text{ MHz}$ 情形下误用了 $J_{-2}$ 而非 $J_{-1}$，才显得相差 $25$ 倍。"
        correct: false
        category: incorrect_reasoning
        feedback: "两种驱动强度的算例均对应 $n=-1$ 阶二倍频共振，差异来自二次方标度律 $|J_{-1}(\\chi)|\\Omega \\propto \\Omega_z\\Omega$。"
    solution: "倾斜线圈下 $\\Omega_z$ 与 $\\Omega$ 同源于一个交流源。当 $\\chi = \\Omega_z/\\omega \\ll 1$ 时 $|J_{-1}(\\chi)| \\approx \\frac{\\Omega_z}{2\\omega}$，于是有效耦合 $|J_{-1}(\\chi)|\\Omega \\approx \\frac{\\Omega_z\\Omega}{2\\omega}$ 与驱动强度的平方成正比，所以幅度放大 $5$ 倍导致耦合增强 $25$ 倍。"

  - id: lsb-subharmonic-coupling-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 3
    params:
      w0_ghz:
        min: 8
        max: 12
        step: 2
      Om_mhz:
        min: 20
        max: 60
        step: 20
    prompt: "已知自旋静态共振频率 $\\omega_0/(2\\pi) = {{=w0_ghz}}\\text{ GHz}$。利用倾斜单线圈在 $n=-1$ 阶二倍频共振点 $\\omega/(2\\pi) = \\omega_0/(4\\pi) = {{=500*w0_ghz}}\\text{ MHz}$ 处激发跃迁，且测得横向与纵向驱动耦合幅度均为 $\\Omega/(2\\pi) = \\Omega_z/(2\\pi) = {{=Om_mhz}}\\text{ MHz}$。求有效二倍频边带耦合强度 $|J_{-1}(\\chi)|\\Omega/(2\\pi)$ 是多少 $\\text{kHz}$？（提示：小调制下 $|J_{-1}(\\chi)| \\approx \\chi/2$）"
    answer_expr: "1000 * abs(besselj(-1, Om_mhz / (500 * w0_ghz))) * Om_mhz"
    tolerance:
      rel: 0.01
    common_wrong:
      - answer_expr: "1000 * (Om_mhz / (500 * w0_ghz)) * Om_mhz"
        category: math_error
        feedback: "忘记了小调制展开中的系数 $1/2$：$|J_{-1}(\\chi)| \\approx \\chi/2$，而不是 $\\chi$。"
      - answer_expr: "1000 * (Om_mhz / (1000 * w0_ghz)) / 2 * Om_mhz"
        category: misapplied_technique
        feedback: "调制指数分母是驱动角频率 $\\omega = \\omega_0/2$（即 ${{=500*w0_ghz}}\\text{ MHz}$），而不是自旋能隙 $\\omega_0$（${{=1000*w0_ghz}}\\text{ MHz}$）。"
      - answer_expr: "(Om_mhz / (500 * w0_ghz)) / 2 * Om_mhz"
        category: math_error
        feedback: "题目要求以 $\\text{kHz}$ 作答；先算出的是 $\\text{MHz}$，需要再乘以 $1000$ 换算为 $\\text{kHz}$。"
    hints:
      - "先由驱动频率 $\\omega/(2\\pi) = {{=500*w0_ghz}}\\text{ MHz}$ 计算调制指数 $\\chi = \\Omega_z / \\omega$。"
      - "再利用 $|J_{-1}(\\chi)| = |-J_1(\\chi)| \\approx \\chi/2$ 乘以 $\\Omega/(2\\pi)$，最后将 $\\text{MHz}$ 乘 $1000$ 转为 $\\text{kHz}$。"
    solution: "调制指数为 $\\chi = {{=Om_mhz}} / {{=500*w0_ghz}} = {{=Om_mhz/(500*w0_ghz)}}$，因此 $|J_{-1}(\\chi)| \\approx \\chi/2 = {{=Om_mhz/(1000*w0_ghz)}}$。有效耦合强度为 $|J_{-1}(\\chi)|\\Omega/(2\\pi) \\approx {{=Om_mhz/(1000*w0_ghz)}} \\times {{=Om_mhz}}\\text{ MHz} = {{=1000*Om_mhz*(Om_mhz/(1000*w0_ghz))}}\\text{ kHz}$。"

  - id: lsb-subharmonic-spot-mistake
    dimension: math
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "为了用较低频率微波驱动 $\\omega_0/(2\\pi) = 12\\text{ GHz}$ 的自旋能隙，某学生套用倍频条件写成 $\\omega = \\frac{1}{1+n}\\omega_0$ 并取 $n=+1$ 得到 $6\\text{ GHz}$、取 $n=+2$ 得到 $4\\text{ GHz}$。这段计算出了什么差错？"
    options:
      - id: a
        text: "由 $\\Delta_n = \\omega_0 - \\omega + n\\omega = 0$ 导出的正确条件是 $\\omega = \\frac{1}{1-n}\\omega_0$；$6\\text{ GHz}$ 对应的是 $n=-1$ 阶边带，$4\\text{ GHz}$ 对应的是 $n=-2$ 阶边带，而非正整数 $n$。"
        correct: true
        feedback: "辨析清晰！分母是 $1-n$ 而非 $1+n$；若把正整数 $n \\ge +1$ 代入正确的 $\\frac{1}{1-n}\\omega_0$，反而不会得到正频率解。"
      - id: b
        text: "该学生公式写对了，错在不能把 $12\\text{ GHz}$ 的跃迁降频到 $6\\text{ GHz}$ 以下驱动。"
        correct: false
        category: incorrect_reasoning
        feedback: "无论是 $6\\text{ GHz}$（$\\omega_0/2$）还是 $4\\text{ GHz}$（$\\omega_0/3$）都在物理上可行，错在边带阶次记号的正负符号弄反了。"
      - id: c
        text: "二倍频共振点应当在 $\\omega = 2\\omega_0 = 24\\text{ GHz}$ 而不是 $\\omega_0/2 = 6\\text{ GHz}$。"
        correct: false
        category: misunderstood_definition
        feedback: "我们要突破的是功放高频带宽上限，利用低频亚谐波 $\\omega_0/2, \\omega_0/3$ 跨越大能隙 $\\omega_0$，而非升到 $2\\omega_0$。"
      - id: d
        text: "同源激发下的倍频条件与阶次无关，只能激发 $n=0$ 处的 $\\omega = \\omega_0$。"
        correct: false
        category: missing_prerequisite
        feedback: "当存在同频纵向分量（$\\omega_z = \\omega$）时，全部 $n \\le 0$ 阶边带分别对应不同倍频共振点 $\\omega_0/(1-n)$。"
    solution: "在同源条件下，令 $\\Delta_n = \\omega_0 - \\omega + n\\omega = 0$ 解得 $\\omega = \\frac{1}{1-n}\\omega_0$。只有 $n \\le 0$ 给出正频率：$n=0$ 为 $12\\text{ GHz}$，$n=-1$ 为 $6\\text{ GHz}$，$n=-2$ 为 $4\\text{ GHz}$；把分母写成 $1+n$ 颠倒了边带阶次 $n$ 的符号。"

  - id: lsb-mas-sideband-transfer
    dimension: transfer
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 3
    prompt: "在固体核磁共振的魔角旋转（MAS）实验中，样品以机械旋转角频率 $\\omega_r$ 高速转动，使沿 $S_z$ 方向的各向异性化学位移相互作用随时间呈幅值为 $\\Omega_r$ 的周期调制，从而在谱图中心峰 $\\omega_0$ 两侧形成间隔为 $\\omega_r$ 的旋转边带 $\\omega_0 + n\\omega_r$。若保持各向异性幅度 $\\Omega_r$ 不变而将转子转速 $\\omega_r$ 提高一倍（已知初始满足 $\\chi_r = \\Omega_r / \\omega_r \\ll 1$），谱图边带会发生什么变化？"
    options:
      - id: a
        text: "旋转边带与中心峰的距离拉宽一倍（变为 $n\\cdot 2\\omega_r$），同时调制指数 $\\chi_r = \\Omega_r / \\omega_r$ 减半，使一阶边带 $|J_{\\pm 1}(\\chi_r)|$ 近似降至原来的一半，谱图能量更集中到 $n=0$ 中心峰。"
        correct: true
        feedback: "类比迁移非常精准！MAS 边带遵循完全相同的 $J_n(\\Omega_r / \\omega_r)$ 规律：加快转速 $\\omega_r$ 既推远了边带位置，又直接压低了无量纲调制指数 $\\chi_r$。"
      - id: b
        text: "旋转边带的频率间隔缩短为原来的一半，且因为转得更快，一阶边带强度显著增强而中心峰减弱。"
        correct: false
        category: incorrect_reasoning
        feedback: "边带处于 $\\omega_0 + n\\omega_r$，转速翻倍会使间隔翻倍且 $\\chi_r$ 减半，导致边带强度明显衰减、中心峰 $|J_0|$ 更加突出。"
      - id: c
        text: "机械转动只能改变边带的横向相位，对边带频率间隔和各阶强度没有任何影响。"
        correct: false
        category: missing_prerequisite
        feedback: "机械转子频率 $\\omega_r$ 直接充当纵向调制频率，既决定边带间隔，又通过 $\\chi_r = \\Omega_r/\\omega_r$ 决定贝塞尔强度分布。"
      - id: d
        text: "转速提高一倍后将严格破坏可分辨条件，使谱图所有边带彻底消失并发生载波抑制。"
        correct: false
        category: misunderstood_definition
        feedback: "提高 $\\omega_r$ 让 $|J_n|\\Omega \\ll \\omega_r$ 更加容易满足，且 $\\chi_r$ 变小使 $J_0(\\chi_r)$ 更接近 $1$，不会发生载波抑制。"
    solution: "MAS 下转子以 $\\omega_r$ 周期调制 $S_z$ 各向异性项，等效于纵向调制频率 $\\omega_r$、调制指数 $\\chi_r = \\Omega_r / \\omega_r$。当 $\\omega_r$ 加倍时，边带间距 $2\\omega_r$ 翻倍且 $\\chi_r$ 减半；在小调制区 $|J_{\\pm 1}(\\chi_r)| \\approx \\chi_r/2$ 也随之减半，权重向 $n=0$ 中心峰集中。"

  - id: lsb-recall-subharmonic-say
    dimension: conceptual
    type: explain
    role: recall
    knowledge_point: sideband-subharmonic-and-mas-transfer
    difficulty: 1
    est_minutes: 1
    prompt: "说明倾斜单线圈如何突破功放高频带宽限制实现亚谐波倍频激发，以及这一原理如何对应固体核磁魔角旋转（MAS）边带。"
    rubric:
      - id: r1
        criterion: "说明倾斜线圈同时产生横向驱动 $\\Omega$ 与同频纵向调制 $\\Omega_z$（$\\omega_z = \\omega$），由 $\\Delta_n = \\omega_0 + (n-1)\\omega = 0$ 得共振条件 $\\omega = \\frac{1}{1-n}\\omega_0$（$n \\le 0$）。"
        weight: 1
        required: true
      - id: r2
        criterion: "说明选取 $n=-1$（$\\omega = \\omega_0/2$）可用带宽内的低频微波（如 $5\\text{ GHz}$）激发更高能隙跃迁（如 $10\\text{ GHz}$），小 $\\chi$ 下有效耦合约 $\\frac{\\Omega_z\\Omega}{2\\omega}$。"
        weight: 1
        required: true
      - id: r3
        criterion: "说明 MAS 实验中转子以角频率 $\\omega_r$ 周期调制沿 $S_z$ 的各向异性耦合，通过相同相位调制展开分裂出 $\\omega_0 + n\\omega_r$ 旋转边带。"
        weight: 1
        required: false
    exemplar: "倾斜单个线圈使横向耦合 $\\Omega$ 与纵向调制 $\\Omega_z$ 共用同一频率 $\\omega_z = \\omega$，代入边带共振条件得到 $\\omega = \\frac{1}{1-n}\\omega_0$（$n = 0, -1, -2, \\dots$）。因此即使自旋能隙超出功放带宽（例如 $10\\text{ GHz}$），仍可用带内低频微波（例如 $5\\text{ GHz}$ 对应 $n=-1$）激发，小 $\\chi$ 下耦合强度为 $|J_{-1}(\\chi)|\\Omega \\approx \\frac{\\Omega_z\\Omega}{2\\omega}$。同一相位调制规律也支配着固体核磁魔角旋转（MAS）：样品旋转周期调制各向异性 $S_z$ 耦合，将谱线分裂为间隔 $\\omega_r$ 的旋转边带 $\\omega_0 + n\\omega_r$。"

  - id: lsb-recall-subharmonic-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: sideband-subharmonic-and-mas-transfer
    difficulty: 1
    est_minutes: 0.5
    prompt: "当单根倾斜线圈同时提供横向驱动与同频纵向调制（$\\omega_z = \\omega$）以二倍频方式激发自旋跃迁（$\\omega = \\omega_0/2$）时，对应边带求和中的哪一阶 $n$，且小调制极限下的有效耦合近似呈何种关系？"
    options:
      - id: a
        text: "对应 $n = -1$ 阶边带，有效耦合强度 $|J_{-1}(\\chi)|\\Omega \\approx \\frac{\\Omega_z\\Omega}{2\\omega}$。"
        correct: true
        feedback: "正确。将 $n=-1$ 代入 $\\omega = \\frac{1}{1-n}\\omega_0$ 得 $\\omega_0/2$，且小 $\\chi$ 时 $|J_{-1}(\\chi)| \\approx \\chi/2 = \\Omega_z/(2\\omega)$。"
      - id: b
        text: "对应 $n = +1$ 阶边带，有效耦合强度为 $J_1(\\chi)\\Omega \\approx \\Omega$。"
        correct: false
        feedback: "$n=+1$ 时 $\\Delta_{+1} = \\omega_0 - \\omega + \\omega = \\omega_0 \\neq 0$，并不共振，也不存在与 $\\chi$ 无关的 $\\Omega$ 耦合。"
      - id: c
        text: "对应 $n = -2$ 阶边带，有效耦合强度 $|J_{-2}(\\chi)|\\Omega \\approx \\frac{\\Omega_z\\Omega}{2\\omega}$。"
        correct: false
        feedback: "$n=-2$ 对应的是三倍频共振条件 $\\omega = \\omega_0/3$，而非题干所述的 $\\omega_0/2$；且 $\\frac{\\Omega_z\\Omega}{2\\omega}$ 是由一阶小调制近似 $|J_{-1}(\\chi)| \\approx \\chi/2$ 导出的。"
      - id: d
        text: "对应 $n = 0$ 阶载波，仅需把微波功率减半即可在 $\\omega_0/2$ 处共振。"
        correct: false
        feedback: "$n=0$ 对应基频共振 $\\omega = \\omega_0$；降低功放功率不能改变共振频率位置。"
    solution: "在同源共振条件 $\\omega = \\frac{1}{1-n}\\omega_0$ 中，$n = -1$ 给出 $\\omega = \\omega_0/2$，其小调制耦合强度满足 $|J_{-1}(\\chi)|\\Omega \\approx \\frac{\\chi}{2}\\Omega = \\frac{\\Omega_z\\Omega}{2\\omega}$。"

  - id: lsb-recall-subharmonic-expr
    dimension: math
    type: expression
    role: recall
    knowledge_point: sideband-subharmonic-and-mas-transfer
    difficulty: 1
    est_minutes: 0.5
    prompt: "倾斜单线圈满足 $\\omega_z = \\omega$ 时，写出第 $n$ 阶（$n \\le 0$）同源倍频激发的共振驱动频率 $\\omega$ 表达式（用 `w0` 表示 $\\omega_0$、`n` 表示边带阶次）："
    answer: "w0 / (1 - n)"
    variables:
      w0: [1, 20]
      n: [-4, 0]
    solution: "令 $\\Delta_n = \\omega_0 - \\omega + n\\omega = \\omega_0 + (n-1)\\omega = 0$，解得 $\\omega = \\frac{1}{1-n}\\omega_0$。"

  # ==========================================================================
  # Lesson Final: Explain it 自评总结题
  # ==========================================================================
  - id: longitudinal-sideband-final-explain
    dimension: conceptual
    type: explain
    role: core
    difficulty: 3
    est_minutes: 4
    prompt: "请系统梳理纵向交流调制下的边带激发物理全流程：（1）含时相互作用图像 $U_i(t)$ 与 Jacobi–Anger 展开如何把纵向调制变成贝塞尔边带梳？（2）在什么条件下可进一步化为单边带常系数哈密顿量 $H_{I,\\text{eff}}^{(n)}$，在将 $S_x, S_y$ 改写为 $S^+, S^-$ 以及最终还原为 $\\cos(\\varphi - n\\varphi_z)S_x + \\sin(\\varphi - n\\varphi_z)S_y$ 时各自必须确保保留哪些系数、无量纲自变量与自旋算符？（3）同源倾斜线圈倍频激发 $\\omega = \\frac{1}{1-n}\\omega_0$ 与固体核磁 MAS 边带之间有何共同机理？"
    rubric:
      - id: r1
        criterion: "说明含时变换 $U_i(t) = \\exp(-i[\\omega_0 t + \\chi\\sin(\\omega_z t+\\varphi_z)]S_z)$（$\\chi = \\Omega_z/\\omega_z$）消去静态与纵向调制项，并在 $S^+$ 前引入周期相位因子，经 Jacobi–Anger 展开产生间隔 $\\omega_z$、耦合为 $|J_n(\\chi)|\\Omega$ 的边带梳。"
        weight: 1
        required: true
      - id: r2
        criterion: "说明可分辨条件 $|J_n(\\chi)\\Omega| \\ll \\omega_z$ 允许只保留单一近共振阶 $n$，再作二次变换 $U_2 = e^{+i\\Delta_n t S_z}$（$\\Delta_n = \\omega_0 - \\omega + n\\omega_z$）得 $H_{I,\\text{eff}}^{(n)} = \\Delta_n S_z + J_n(\\chi)\\Omega[\\cos(\\varphi - n\\varphi_z)S_x + \\sin(\\varphi - n\\varphi_z)S_y]$，并明确指出改写 $S^+$ 须保留 $\\frac{1}{2}$ 因子、贝塞尔自变量为无量纲 $\\chi$ 且横项必须保留 $S_x$（以及小 $\\omega_z$ 下需数值求解）。"
        weight: 1
        required: true
      - id: r3
        criterion: "说明倾斜单线圈 $\\omega_z = \\omega$ 给出倍频激发 $\\omega = \\frac{1}{1-n}\\omega_0$（$n \\le 0$），可用带内低频（如 $\\omega_0/2$）跨越功放带宽上限，并与 MAS 转子周期调制各向异性 $S_z$ 耦合产生 $\\omega_0 + n\\omega_r$ 边带同源。"
        weight: 1
        required: true
      - id: r4
        criterion: "补充提及负奇数阶宇称 $J_{-n}(\\chi) = (-1)^n J_n(\\chi)$ 或载波抑制零点 $J_0(\\chi) = 0$（$\\chi \\approx 2.4048$）以及小 $\\chi$ 下二倍频耦合的平方标度律 $\\frac{\\Omega_z\\Omega}{2\\omega}$。"
        weight: 1
        required: false
    exemplar: "面对总哈密顿量中的纵向调制 $\\Omega_z\\cos(\\omega_z t + \\varphi_z)S_z$，先构造含时相互作用图像 $U_i(t) = \\exp(-i[\\omega_0 t + \\chi\\sin(\\omega_z t+\\varphi_z)]S_z)$（无量纲调制指数 $\\chi = \\Omega_z/\\omega_z$），其时间偏导把静态项和纵向项一并消去，只留周期相位因子 $e^{i\\chi\\sin(\\omega_z t+\\varphi_z)}$ 乘在 $\\frac{\\Omega}{2}S^+$ 上（修正原讲义漏掉的 $\\frac{1}{2}$）。再经 Jacobi–Anger 傅里叶展开（修正 $J_n(x)\\to J_n(\\chi)$），单频驱动裂分为位置 $\\omega_0 + n\\omega_z$、间隔 $\\omega_z$ 的边带共振梳，各阶强度为 $|J_n(\\chi)|\\Omega$（其中 $\\chi \\approx 2.4048$ 时 $J_0=0$ 实现载波抑制）。当可分辨条件 $|J_n(\\chi)\\Omega| \\ll \\omega_z$ 成立时，最多只有一项近共振，对其施以二次变换 $U_2 = e^{+i\\Delta_n t S_z}$（$\\Delta_n = \\omega_0 - \\omega + n\\omega_z$）即化为常系数形式 $H_{I,\\text{eff}}^{(n)} = \\Delta_n S_z + J_n(\\chi)\\Omega[\\cos(\\varphi-n\\varphi_z)S_x + \\sin(\\varphi-n\\varphi_z)S_y]$（补齐讲义漏印的 $S_x$，并注意负奇数阶满足 $J_{-n}(\\chi)=(-1)^n J_n(\\chi)$）；若 $\\omega_z$ 太小导致多边带干涉，则只能数值求解。最后，倾斜单线圈令 $\\omega_z = \\omega$ 给出倍频激发 $\\omega = \\frac{1}{1-n}\\omega_0$（$n \\le 0$），使 $5\\text{ GHz}$ 功放能以耦合 $|J_{-1}(\\chi)|\\Omega \\approx \\frac{\\Omega_z\\Omega}{2\\omega}$ 激发 $10\\text{ GHz}$ 能隙；而固体核磁魔角旋转（MAS）正是转子频率 $\\omega_r$ 对各向异性 $S_z$ 耦合的周期相位调制，按相同贝塞尔展开产生 $\\omega_0 + n\\omega_r$ 旋转边带。"
