concept: single-qubit-gates
exercises:
  # ==========================================================================
  # Step 1: gate-resonant-xy-pulses (5 题课堂 + 3 题 recall)
  # ==========================================================================
  - id: u2-l1-xy-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: "在共振条件下（$\\delta = 0$），驱动脉冲演化算符 $U = e^{-i\\theta\\vec{\\boldsymbol{n}}\\cdot\\vec{\\boldsymbol{S}}}$ 中的转角 $\\theta$ 与赤道转轴 $\\vec{\\boldsymbol{n}}$ 分别由哪两个实验参数直接控制？"
    options:
      - id: a
        text: "转角 $\\theta = \\Omega t$ 由驱动幅度 $\\Omega$ 与脉冲持续时间 $t$ 决定；赤道轴 $\\vec{\\boldsymbol{n}} = (\\cos\\beta, \\sin\\beta, 0)$ 的方位完全由驱动相位 $\\beta$ 决定。"
        correct: true
        feedback: "准确无误！$\\delta = 0$ 使极角 $\\alpha = \\pi/2$、$\\Omega_{\\text{eff}} = \\Omega$，从而实现脉宽定转角、相位定转轴的解耦控制。"
      - id: b
        text: "转角 $\\theta$ 仅由驱动相位 $\\beta$ 决定，而赤道转轴方向则随脉冲持续时间 $t$ 连续旋转。"
        correct: false
        feedback: "正好把两个角色颠倒了：恒定相位 $\\beta$ 在整个脉冲期间锁定一条固定的赤道转轴 $\\vec{\\boldsymbol{n}}$，而作用时间 $t$ 只累积绕该轴旋转的角度 $\\theta = \\Omega t$。"
      - id: c
        text: "当 $\\delta = 0$ 时转轴固定沿 $+z$ 轴 $(0, 0, 1)$，与驱动相位 $\\beta$ 无关。"
        correct: false
        feedback: "只有关闭驱动（$\\Omega = 0$）而保留失谐 $\\delta \\neq 0$ 时，转轴才沿着 $z$ 轴；共振驱动的转轴躺在 $x\\text{-}y$ 赤道面内。"
      - id: d
        text: "当 $\\delta = 0$ 时 $(\\pi/2)_\\beta$ 与 $(\\pi)_\\beta$ 只能取 $\\beta = 0$，其他相位都会产生非幺正演化。"
        correct: false
        feedback: "任何实数值相位 $\\beta$ 都给出完全幺正的赤道 $SU(2)$ 旋转，$\\beta = 0$ 与 $\\beta = \\pi/2$ 只是其中的 $x$ 轴与 $y$ 轴特例。"
    solution: "共振时 $\\delta = 0$ 给出 $\\Omega_{\\text{eff}} = \\Omega$ 与 $\\alpha = \\pi/2$，故旋转角为 $\\theta = \\Omega t$，而赤道面单位转轴为 $\\vec{\\boldsymbol{n}} = (\\cos\\beta, \\sin\\beta, 0)$，由驱动相位 $\\beta$ 唯一确定。"

  - id: u2-l1-xy-self-explain
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "在刚刚推导出共振 $\\pi$ 脉冲 $(\\pi)_x = \\begin{pmatrix}0 & -i\\\\ -i & 0\\end{pmatrix}$ 时，为什么它的矩阵表达式比纯泡利矩阵 $\\sigma_x$ 多出一个 $-i$ 因子，且该如何纠正原讲义第 7 页在 $\\beta = 0$ 处的印刷记号？"
    options:
      - id: a
        text: "因为当 $\\theta = \\pi$、$\\beta = 0$ 时 $\\cos(\\pi/2) = 0$、$-i\\sin(\\pi/2) = -i$，所以 $e^{-i\\pi S_x} = -i\\sigma_x$；原讲义把 $\\beta = 0$ 的这一矩阵误印成了 $(\\pi)_\\pi$，按转轴下标应当写作 $(\\pi)_x$。"
        correct: true
        feedback: "非常精准！$-i$ 是由指数算符在 $\\theta/2 = \\pi/2$ 处展开自然生成的物理相位，而 $(\\pi)_\\pi$ 是仅在 $\\beta = 0$ 位置出现的下标印刷笔误。"
      - id: b
        text: "因为 $\\sigma_x$ 的矩阵元写错了符号，实际磁共振翻转门应当去掉 $-i$ 直接写作 $\\sigma_x$；讲义下标 $(\\pi)_\\pi$ 代表反转了 $\\pi$ 弧度，无需修改。"
        correct: false
        category: incorrect_reasoning
        feedback: "直接写 $\\sigma_x$ 漏掉了演化算符在 $\\theta=\\pi$ 处展开的非对角相位 $-i$（正确矩阵元为 $-i$ 而非 $+1$）；而且脉冲下标标示的是转轴方向（$x$、$y$ 或方位角 $\\beta$），$(\\pi)_\\pi$ 处本意正是 $\\beta = 0$ 的 $x$ 轴门。"
      - id: c
        text: "$-i$ 来自作用时间 $t$ 取了复数虚时间，而 $(\\pi)_\\pi$ 特指 $\\beta = \\pi/2$ 对应的 $y$ 轴门。"
        correct: false
        category: misunderstood_definition
        feedback: "演化时间 $t$ 与驱动参数均为实数，$-i$ 来源于量子演化算符 $e^{-i H_I t}$ 中的虚数单位 $i$；$\\beta = \\pi/2$ 的矩阵是 $(\\pi)_y$，并非讲义 $\\beta = 0$ 处误印的 $(\\pi)_\\pi$。"
      - id: d
        text: "$-i$ 来源于把 $|0\\rangle$ 与 $|1\\rangle$ 顺序颠倒定义；如果按 $|1\\rangle=(1,0)^T$ 排序就不会出现 $-i$。"
        correct: false
        category: math_error
        feedback: "即便交换计算基顺序，$-i\\sin(\\pi/2)\\sigma_x = -i\\sigma_x$ 的整体前置因子 $-i$ 依然保持不变。"
    solution: "将 $\\theta = \\pi, \\beta = 0$ 代入 $\\cos(\\theta/2)\\mathbb{1} - i\\sin(\\theta/2)(\\cos\\beta\\,\\sigma_x + \\sin\\beta\\,\\sigma_y)$ 直接给出 $-i\\sigma_x$，对应 $x$ 轴 $\\pi$ 旋转 $(\\pi)_x$，原讲义第 7 页所印 $(\\pi)_\\pi$ 为下标笔误。"

  - id: u2-l1-xy-duration-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    params:
      Om_mhz:
        min: 4
        max: 20
        step: 4
    prompt: "设某自旋比特处于精确共振（$\\delta = 0$），施加拉比频率为 $\\Omega/(2\\pi) = {{=Om_mhz}}\\text{ MHz}$ 的横向微波驱动。实现单比特 $(\\pi/2)_\\beta$ 门所需的脉冲持续时间 $t_{\\pi/2}$ 是多少纳秒（$\\text{ns}$，保留两位小数）？"
    answer_expr: "250 / Om_mhz"
    tolerance:
      abs: 0.05
    common_wrong:
      - answer_expr: "500 / Om_mhz"
        category: math_error
        feedback: "你计算的是完整翻转角 $\\theta = \\pi$ 对应的 $\\pi$ 脉冲时长 $t_\\pi = \\frac{1}{2(\\Omega/2\\pi)}$；本题要求的是 $(\\pi/2)_\\beta$ 门，只需一半时间。"
      - answer_expr: "1000 / Om_mhz"
        category: math_error
        feedback: "$1/(\\Omega/2\\pi)$ 对应的是转过一整圈 $\\theta = 2\\pi$ 的完整周期；实现 $\\theta = \\pi/2$ 只需周期的四分之一。"
      - answer_expr: "125 / Om_mhz"
        category: math_error
        feedback: "多除以了一次 $2$（相当于把转角算成了 $\\pi/4$）。请核对 $\\theta = \\Omega t = 2\\pi(\\Omega/2\\pi)t = \\pi/2$。"
    hints:
      - "共振时旋转角 $\\theta = \\Omega t = 2\\pi(\\Omega/2\\pi)t$。"
      - "令 $\\theta = \\pi/2$，注意 $1\\text{ MHz}^{-1} = 1000\\text{ ns}$。"
    solution: "由 $2\\pi(\\Omega/2\\pi)t_{\\pi/2} = \\pi/2$ 得 $t_{\\pi/2} = \\frac{1000\\text{ ns}}{4 \\times {{=Om_mhz}}} = {{=round(250 / Om_mhz, 2)}}\\text{ ns}$。"

  - id: u2-l1-xy-spot-mistake
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "某同学在计算 $(\\pi/2)_y |1\\rangle$ 时写道：「因为 $(\\pi/2)_\\beta$ 的右上矩阵元是 $-i e^{-i\\beta}$，而 $y$ 轴对应 $\\beta = \\pi/2$，所以 $e^{-i\\beta} = +i$，从而得到右上矩阵元 $+1$，最终输出 $\\frac{1}{\\sqrt{2}}(|0\\rangle + |1\\rangle)$。」请指出这一推导中的核心错误："
    options:
      - id: a
        text: "符号算反了：$e^{-i\\pi/2} = -i$ 而非 $+i$，因此右上矩阵元为 $-i(-i) = -1$，正确输出应为 $\\frac{1}{\\sqrt{2}}(-|0\\rangle + |1\\rangle)$。"
        correct: true
        feedback: "抓得非常准！记住 $e^{-i\\pi/2} = -i$、$e^{i\\pi/2} = +i$，从而 $(\\pi/2)_y = \\frac{1}{\\sqrt{2}}\\begin{pmatrix}1 & -1\\\\ 1 & 1\\end{pmatrix}$，作用在 $|1\\rangle$ 上给出负号的 $|0\\rangle$ 分量。"
      - id: b
        text: "$y$ 轴脉冲对应的驱动相位应当取 $\\beta = \\pi$ 而非 $\\beta = \\pi/2$。"
        correct: false
        feedback: "$\\beta = \\pi$ 对应的是沿 $-x$ 轴的反转轴 $(-1, 0, 0)$；$y$ 轴单位矢量 $(0, 1, 0)$ 确实要求 $\\beta = \\pi/2$。"
      - id: c
        text: "右上矩阵元应该使用 $e^{+i\\beta}$ 而左下矩阵元使用 $e^{-i\\beta}$。"
        correct: false
        feedback: "由 $\\sigma_y = \\begin{pmatrix}0 & -i\\\\ i & 0\\end{pmatrix}$ 可验证，右上角确为 $-i e^{-i\\beta}$（当 $\\beta = \\pi/2$ 时 $(-i)e^{-i\\pi/2} = (-i)(-i\\sin(\\pi/2)) = -1$ 再乘以总因子 $\\frac{1}{\\sqrt{2}}$），原公式的指数符号没有错。"
      - id: d
        text: "$(\\pi/2)_y$ 只能把 $|1\\rangle$ 变成虚系数叠加态，结果中不应出现实数系数。"
        correct: false
        feedback: "恰恰相反，由于 $-i\\sigma_y = \\begin{pmatrix}0 & -1\\\\ 1 & 0\\end{pmatrix}$ 为全实矩阵，$(\\pi/2)_y$ 正是生成实系数叠加态的基本操作。"
    solution: "将 $\\beta = \\pi/2$ 正确代入通用表达式得 $e^{-i\\pi/2} = -i$、$e^{i\\pi/2} = +i$，于是 $(\\pi/2)_y = \\frac{1}{\\sqrt{2}}\\begin{pmatrix}1 & -1\\\\ 1 & 1\\end{pmatrix}$，作用于 $|1\\rangle$ 得到 $\\frac{1}{\\sqrt{2}}(-|0\\rangle + |1\\rangle)$。"

  - id: u2-l1-xy-phase-transfer
    dimension: transfer
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "假设实验先对初态 $|0\\rangle$ 施加一个共振 $(\\pi/2)_y$ 门，紧接着想仅靠调整下一段共振 $\\pi/2$ 脉冲的驱动相位 $\\beta$ 把量子态精确拉回初态 $|0\\rangle$（不改作用轴所在直线、仅反向旋转）。第二段脉冲应采用哪个驱动相位，其矩阵与作用结果是什么？"
    options:
      - id: a
        text: "将第二段脉冲的相位反转至 $\\beta = -\\pi/2$，此时 $(\\pi/2)_{-\\pi/2} = \\frac{1}{\\sqrt{2}}\\begin{pmatrix}1 & 1\\\\ -1 & 1\\end{pmatrix} = (\\pi/2)_y^\\dagger$，连续作用正好精确回到 $|0\\rangle$。"
        correct: true
        feedback: "迁移得极好！把相位移动 $\\pi$（从 $\\pi/2$ 变为 $-\\pi/2$）会把转轴 $\\vec{\\boldsymbol{n}}$ 反向为 $-\\vec{\\boldsymbol{n}}$，从而生成逆门 $(\\pi/2)_y^\\dagger$，一步抵消前序旋转。"
      - id: b
        text: "保持 $\\beta = +\\pi/2$ 再施加一次 $(\\pi/2)_y$ 就能直接回到 $|0\\rangle$。"
        correct: false
        feedback: "沿同一方向连续两次 $\\pi/2$ 旋转相当于一次 $(\\pi)_y$ 门，会把 $|0\\rangle$ 彻底翻转到 $|1\\rangle$，而不是回到 $|0\\rangle$。"
      - id: c
        text: "将相位改为 $\\beta = 0$ 施加 $(\\pi/2)_x$ 门即可抵消 $(\\pi/2)_y$ 的旋转。"
        correct: false
        feedback: "$(\\pi/2)_y |0\\rangle = \\frac{1}{\\sqrt{2}}(|0\\rangle+|1\\rangle)$ 经过 $(\\pi/2)_x$ 后变为 $\\frac{1-i}{2}(|0\\rangle+|1\\rangle)$，仍留在等权叠加态上。"
      - id: d
        text: "必须在第二段施加 $(\\pi)_y$ 门（脉宽加倍）才能从叠加态正交退回到 $|0\\rangle$。"
        correct: false
        feedback: "$(\\pi)_y$ 作用于 $\\frac{1}{\\sqrt{2}}(|0\\rangle+|1\\rangle)$ 会将其送至 $\\frac{1}{\\sqrt{2}}(-|0\\rangle+|1\\rangle)$（绕 $y$ 轴多转了 $\\pi$），无法回到 $|0\\rangle$。"
    solution: "当 $\\beta = -\\pi/2$ 时，转轴 $\\vec{\\boldsymbol{n}} = (0, -1, 0)$ 与 $(\\pi/2)_y$ 的转轴相反，给出 $e^{-i(-\\pi/2)} = +i$、$e^{i(-\\pi/2)} = -i$，即 $(\\pi/2)_{-\\pi/2} = \\frac{1}{\\sqrt{2}}\\begin{pmatrix}1 & 1\\\\ -1 & 1\\end{pmatrix} = (\\pi/2)_y^\\dagger$，与 $(\\pi/2)_y$ 相乘恒等于 $\\mathbb{1}$。"

  - id: u2-l1-recall-xy-explain
    dimension: conceptual
    type: explain
    role: recall
    knowledge_point: gate-resonant-xy-pulses
    difficulty: 1
    est_minutes: 1
    prompt: "简述共振（$\\delta=0$）时有效转轴与转角如何化简，并写出由相位 $\\beta$ 切换 $(\\pi)_x$ 与 $(\\pi)_y$ 门的核心公式。"
    rubric:
      - id: r1
        criterion: "说明 $\\delta=0$ 时极角 $\\alpha=\\pi/2$，有效轴 $\\vec{\\boldsymbol{n}}=(\\cos\\beta,\\sin\\beta,0)$ 处于赤道面且转角 $\\theta=\\Omega t$。"
        weight: 1
        required: true
      - id: r2
        criterion: "给出 $(\\pi)_\\beta = \\begin{pmatrix}0 & -i e^{-i\\beta}\\\\ -i e^{i\\beta} & 0\\end{pmatrix}$，并指出 $\\beta=0$ 为 $(\\pi)_x=-i\\sigma_x$、$\\beta=\\pi/2$ 为 $(\\pi)_y=-i\\sigma_y$。"
        weight: 1
        required: true
    exemplar: "共振条件下 $\\delta = 0$ 使有效转轴倾角 $\\alpha = \\pi/2$、单位轴 $\\vec{\\boldsymbol{n}} = (\\cos\\beta, \\sin\\beta, 0)$ 落在赤道平面且转角 $\\theta = \\Omega t$。令 $\\theta = \\pi$ 得通用 $\\pi$ 脉冲门 $(\\pi)_\\beta = \\begin{pmatrix}0 & -i e^{-i\\beta}\\\\ -i e^{i\\beta} & 0\\end{pmatrix}$：取 $\\beta = 0$ 为 $(\\pi)_x = -i\\sigma_x$，取 $\\beta = \\pi/2$ 为 $(\\pi)_y = -i\\sigma_y$。"

  - id: u2-l1-recall-xy-mc
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: gate-resonant-xy-pulses
    difficulty: 1
    est_minutes: 0.5
    prompt: "下列哪一个脉冲参数组合对应共振门 $(\\pi/2)_y = \\frac{1}{\\sqrt{2}}\\begin{pmatrix}1 & -1\\\\ 1 & 1\\end{pmatrix}$？"
    options:
      - id: a
        text: "$\\delta = 0$，$\\theta = \\Omega t = \\pi/2$，$\\beta = \\pi/2$"
        correct: true
        feedback: "正确！$\\beta = \\pi/2$ 选定 $y$ 轴，$\\theta = \\pi/2$ 给出 $1/\\sqrt{2}$ 矩阵元。"
      - id: b
        text: "$\\delta = 0$，$\\theta = \\Omega t = \\pi/2$，$\\beta = 0$"
        correct: false
        feedback: "$\\beta = 0$ 选定 $x$ 轴，得到的是带虚数非对角元的 $(\\pi/2)_x = \\frac{1}{\\sqrt{2}}\\begin{pmatrix}1 & -i\\\\ -i & 1\\end{pmatrix}$。"
      - id: c
        text: "$\\delta = 0$，$\\theta = \\Omega t = \\pi$，$\\beta = \\pi/2$"
        correct: false
        feedback: "$\\theta = \\pi$ 对应完整翻转门 $(\\pi)_y = \\begin{pmatrix}0 & -1\\\\ 1 & 0\\end{pmatrix}$，对角元已变为零。"
      - id: d
        text: "$\\Omega = 0$，$\\theta = \\delta t = \\pi/2$，$\\beta = \\pi/2$"
        correct: false
        feedback: "关闭驱动（$\\Omega = 0$）时转轴在 $+z$ 轴，只能产生对角相位门 $S_{\\text{MR}}$。"
    solution: "由 $(\\pi/2)_\\beta = \\frac{1}{\\sqrt{2}}\\begin{pmatrix}1 & -i e^{-i\\beta}\\\\ -i e^{i\\beta} & 1\\end{pmatrix}$ 取 $\\beta = \\pi/2$，得 $e^{-i\\pi/2}=-i$、$e^{i\\pi/2}=i$，正是 $(\\pi/2)_y$。"

  - id: u2-l1-recall-xy-expr
    dimension: math
    type: expression
    role: recall
    knowledge_point: gate-resonant-xy-pulses
    difficulty: 1
    est_minutes: 0.5
    prompt: "在共振（$\\delta = 0$）且横向角拉比频率为 $\\Omega$ 时，写出实现 $(\\pi/2)_\\beta$ 门所需的脉冲时间 $t_{\\pi/2}$ 表达式（用 `Om` 表示角频率 $\\Omega$，圆周率用 `pi` 表示）。"
    answer: "pi / (2 * Om)"
    variables:
      Om: [1, 20]
    solution: "由共振旋转角公式 $\\theta = \\Omega t = \\pi/2$，解得 $t_{\\pi/2} = \\frac{\\pi}{2\\Omega}$。"

  # ==========================================================================
  # Step 2: gate-z-and-hadamard-pulses (5 题课堂 + 3 题 recall)
  # ==========================================================================
  - id: u2-l1-hz-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: "在控制参数平面 $(\\Omega, \\delta)$ 上，通过自由演化 $z$ 门（$T$、$S$、$Z_{\\text{MR}}$）与通过单脉冲实现磁共振 Hadamard 门 $H_{\\text{MR}}$ 分别需要满足什么参数条件？"
    options:
      - id: a
        text: "$z$ 门令驱动关闭（$\\Omega = 0$）并利用失谐 $\\delta t$ 分别取 $\\pi/4, \\pi/2, \\pi$；$H_{\\text{MR}}$ 令 $\\Omega = \\delta$、$\\beta = 0$（$45^\\circ$ 倾斜转轴）且总转角 $\\theta = \\sqrt{2}\\Omega t = \\pi$。"
        correct: true
        feedback: "非常清晰！自由演化沿着纵轴（$\\Omega=0$）积累 $z$ 相移，而 $H_{\\text{MR}}$ 则位于 $\\Omega = \\delta$ 的 $45^\\circ$ 角平分线上完成一次 $\\pi$ 旋转。"
      - id: b
        text: "$z$ 门要求精确共振（$\\delta = 0$）且相位 $\\beta = \\pi$；$H_{\\text{MR}}$ 则要求关闭驱动（$\\Omega = 0$）令 $\\delta t = \\pi/2$。"
        correct: false
        feedback: "$\\delta = 0$ 只能得到赤道面内的 $x/y$ 门，无法得到纯 $z$ 轴相移门；而 $\\Omega=0$ 时无法把 $|0\\rangle$ 与 $|1\\rangle$ 耦合到叠加态，不能产生 Hadamard 门。"
      - id: c
        text: "$H_{\\text{MR}}$ 需要令 $\\Omega = \\delta$、$\\beta = \\pi/2$ 且转角 $\\theta = \\pi/2$。"
        correct: false
        feedback: "$H_{\\text{MR}} = -i(\\sigma_x + \\sigma_z)/\\sqrt{2}$ 需要转轴在 $x\\text{-}z$ 平面内（$\\beta = 0$）并且转足 $\\theta = \\pi$，才能令 $\\cos(\\theta/2)=0$。"
      - id: d
        text: "$T$、$S$、$Z_{\\text{MR}}$ 门和 $H_{\\text{MR}}$ 门都在 $\\Omega = \\delta$ 的条件线上实现，仅通过脉冲时间区分。"
        correct: false
        feedback: "当 $\\Omega = \\delta \\neq 0$ 时转轴有横向 $\\sigma_x$ 分量，不同时长一般产生非对角矩阵，不能得到纯对角相位门 $T, S, Z_{\\text{MR}}$。"
    solution: "关闭驱动（$\\Omega=0$）得到纯对角相移门 $e^{-i\\delta t S_z}$，对应 $T(\\pi/4)$、$S(\\pi/2)$、$Z_{\\text{MR}}(\\pi)$；令 $\\Omega=\\delta$、$\\beta=0$ 使 $\\vec{\\boldsymbol{n}}=(1/\\sqrt{2}, 0, 1/\\sqrt{2})$，在 $\\theta=\\sqrt{2}\\Omega t = \\pi$ 时得 $H_{\\text{MR}}$。"

  - id: u2-l1-hz-self-explain
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "刚才我们推导出 $\\Omega = 0$ 时演化算符是 $U|_{\\Omega=0} = \\begin{pmatrix}e^{-i\\delta t/2} & 0\\\\ 0 & e^{i\\delta t/2}\\end{pmatrix}$。如果一个叠加态 $c_0|0\\rangle + c_1|1\\rangle$ 经过任意失谐 $z$ 门（$T$、$S$ 或 $Z_{\\text{MR}}$）作用，它的基矢布居概率 $|c_0|^2$、$|c_1|^2$ 与两分量相对相位各自会怎样变化？"
    options:
      - id: a
        text: "布居概率 $|c_0|^2$ 与 $|c_1|^2$ 完全保持不变，因为矩阵只有对角元；但 $|1\\rangle$ 相对 $|0\\rangle$ 会额外积累相对相移 $\\delta t$（即 $e^{i\\delta t}$ 因子）。"
        correct: true
        feedback: "完全正确！提取公因子 $e^{-i\\delta t/2}$ 即得 $e^{-i\\delta t/2}\\text{diag}(1, e^{i\\delta t})$，清晰展示出对角演化不改布居、只推前相对相位。"
      - id: b
        text: "布居概率 $|c_0|^2$ 与 $|c_1|^2$ 会以角频率 $\\delta$ 来回振荡交换，而相对相位保持为零。"
        correct: false
        category: incorrect_reasoning
        feedback: "没有非对角耦合元时，$|0\\rangle$ 与 $|1\\rangle$ 之间不会发生任何跃迁，布居概率严格守恒。"
      - id: c
        text: "只有整个态矢量乘以一个统一的全局相位 $e^{-i\\delta t/2}$，基矢之间的相对相位也不改变。"
        correct: false
        category: math_error
        feedback: "对角线上两个元素符号相反（$e^{-i\\delta t/2}$ 与 $e^{+i\\delta t/2}$），所以 $|1\\rangle$ 相对 $|0\\rangle$ 产生的是 $e^{+i\\delta t}$ 的真实可观测相对相移。"
      - id: d
        text: "只有在 $Z_{\\text{MR}}$（$\\delta t = \\pi$）时布居才守恒，$T$ 与 $S$ 门会让布居部分转移到另一能级。"
        correct: false
        category: misunderstood_definition
        feedback: "只要 $\\Omega = 0$，演化算符在任意时间 $t$ 都是对角矩阵，所有 $z$ 相位门都保持 $|c_0|^2, |c_1|^2$ 不变。"
    solution: "由于 $U|_{\\Omega=0} = e^{-i\\delta t/2}\\begin{pmatrix}1 & 0\\\\ 0 & e^{i\\delta t}\\end{pmatrix}$ 仅含对角矩阵元，末态为 $e^{-i\\delta t/2}(c_0|0\\rangle + c_1 e^{i\\delta t}|1\\rangle)$，因此布居数 $|c_k|^2$ 不变而相对相位增加 $\\delta t$。"

  - id: u2-l1-hz-timing-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 3
    params:
      Om_mhz:
        min: 2
        max: 10
        step: 2
    prompt: "为了用单脉冲合成磁共振 Hadamard 门 $H_{\\text{MR}}$，设定横向拉比频率与失谐相等：$\\Omega/(2\\pi) = \\delta/(2\\pi) = {{=Om_mhz}}\\text{ MHz}$，且驱动相位 $\\beta = 0$。求满足 $\\theta = \\Omega_{\\text{eff}}t_H = \\pi$ 所需的脉宽 $t_H$（单位：$\\text{ns}$，保留至 $0.1\\text{ ns}$ 精度）。"
    answer_expr: "500 / (sqrt(2) * Om_mhz)"
    tolerance:
      abs: 0.1
    common_wrong:
      - answer_expr: "500 / Om_mhz"
        category: math_error
        feedback: "忘记计算失谐与驱动的合成有效频率 $\\Omega_{\\text{eff}} = \\sqrt{\\Omega^2 + \\delta^2} = \\sqrt{2}\\Omega$，误按 $\\theta = \\Omega t$ 求解使结果偏大了 $\\sqrt{2}$ 倍。"
      - answer_expr: "250 / (sqrt(2) * Om_mhz)"
        category: math_error
        feedback: "这是转角 $\\theta = \\pi/2$ 的时长；沿着 $45^\\circ$ 倾斜轴必须转过完整 $\\theta = \\pi$ 才能消去 $\\cos(\\theta/2)\\mathbb{1}$ 项并得到 $H_{\\text{MR}}$。"
      - answer_expr: "1000 / (sqrt(2) * Om_mhz)"
        category: math_error
        feedback: "使用了 $\\theta = 2\\pi$ 整周期而不是 $\\theta = \\pi$ 半周期，脉宽大了一倍。"
    hints:
      - "先求有效拉比频率 $\\Omega_{\\text{eff}}/(2\\pi) = \\sqrt{(\\Omega/2\\pi)^2 + (\\delta/2\\pi)^2} = \\sqrt{2}\\times {{=Om_mhz}}\\text{ MHz}$。"
      - "再令 $t_H = \\frac{1000\\text{ ns}}{2(\\Omega_{\\text{eff}}/2\\pi)}$。"
    solution: "由 $\\Omega_{\\text{eff}}/(2\\pi) = {{=Om_mhz}}\\sqrt{2}\\text{ MHz}$，令 $\\Omega_{\\text{eff}}t_H = \\pi$ 得 $t_H = \\frac{500}{\\sqrt{2}\\times {{=Om_mhz}}} \\approx {{=round(500 / (sqrt(2) * Om_mhz), 2)}}\\text{ ns}$。"

  - id: u2-l1-hz-spot-mistake
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "一位同学听说「Hadamard 门能把基态变成等权叠加态」，于是类比共振 $(\\pi/2)_y$ 脉冲写道：「在 $\\Omega = \\delta$、$\\beta = 0$ 时，只需作用转角 $\\theta = \\Omega_{\\text{eff}}t = \\pi/2$ 就能实现 $H_{\\text{MR}}$ 门。」请指出这段类比为什么出错："
    options:
      - id: a
        text: "沿 $45^\\circ$ 倾斜轴 $\\vec{\\boldsymbol{n}} = (1,0,1)/\\sqrt{2}$ 必须转过 $\\theta = \\pi$ 才能令 $\\cos(\\theta/2) = 0$，从而得到纯粹的 $-i(\\sigma_x+\\sigma_z)/\\sqrt{2}$；若只转 $\\pi/2$，还会残留 $\\frac{1}{\\sqrt{2}}\\mathbb{1}$ 对角偏置，不再是 $H_{\\text{MR}}$。"
        correct: true
        feedback: "指出了本质差别！$(\\pi/2)_y$ 沿 $y$ 轴旋转 $\\pi/2$ 即可使 $|0\\rangle$ 变为等权叠加态，而沿倾斜 $45^\\circ$ 轴 $\\vec{\\boldsymbol{n}}$ 则必须转足 $\\pi$ 才能消去 $\\cos(\\theta/2)\\mathbb{1}$ 项并把基矢混合成对称叠加。"
      - id: b
        text: "应当将驱动相位改为 $\\beta = \\pi/2$ 并转过 $\\theta = \\pi/2$ 才能实现 $H_{\\text{MR}}$。"
        correct: false
        feedback: "$\\beta = \\pi/2$ 会引入虚部矩阵元 $\\sigma_y$，不再是实比例矩阵 $-i(\\sigma_x+\\sigma_z)/\\sqrt{2}$。"
      - id: c
        text: "当 $\\Omega = \\delta$ 时有效拉比频率变为零，根本无法实现任何角度的旋转。"
        correct: false
        feedback: "$\\Omega_{\\text{eff}} = \\sqrt{\\Omega^2+\\delta^2} = \\sqrt{2}\\Omega$ 比单轴驱动更快，并不为零。"
      - id: d
        text: "只要转过 $\\theta = 2\\pi$ 就能得到 $H_{\\text{MR}}$ 门。"
        correct: false
        feedback: "转过 $\\theta = 2\\pi$ 时 $\\cos(\\pi) = -1, \\sin(\\pi) = 0$，演化算符直接等于 $-\\mathbb{1}$。"
    solution: "在 $\\vec{\\boldsymbol{n}} = (\\sigma_x+\\sigma_z)/\\sqrt{2}$ 时，只有 $\\theta = \\pi$ 使 $\\cos(\\theta/2) = 0$、$\\sin(\\theta/2) = 1$，才能给出 $H_{\\text{MR}} = -i(\\sigma_x+\\sigma_z)/\\sqrt{2}$；取 $\\theta = \\pi/2$ 会保留 $\\frac{1}{\\sqrt{2}}\\mathbb{1}$ 而破坏目标门结构。"

  - id: u2-l1-hz-detuning-transfer
    dimension: transfer
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "如果在倾斜轴构造实验中仍保持幅值相等 $\\Omega = \\delta > 0$ 与总转角 $\\theta = \\sqrt{2}\\Omega t = \\pi$，但把驱动相位从 $\\beta = 0$ 改设为 $\\beta = \\pi$，所实现的单比特门矩阵变成什么？"
    options:
      - id: a
        text: "$-\\frac{i}{\\sqrt{2}}\\begin{pmatrix}1 & -1\\\\ -1 & -1\\end{pmatrix} = -i\\frac{-\\sigma_x + \\sigma_z}{\\sqrt{2}}$"
        correct: true
        feedback: "非常稳健！$\\beta = \\pi$ 仅把水平分量 $\\cos\\beta$ 反号（$n_x \\to -1/\\sqrt{2}$），保留 $n_z = +1/\\sqrt{2}$，故只翻转非对角元的符号。"
      - id: b
        text: "$-\\frac{i}{\\sqrt{2}}\\begin{pmatrix}-1 & 1\\\\ 1 & 1\\end{pmatrix}$"
        correct: false
        feedback: "该矩阵对应 $\\sigma_z$ 分量反号（即失谐变为 $\\delta = -\\Omega < 0$ 而 $\\beta = 0$ 仍不变的情况）。"
      - id: c
        text: "$-i\\begin{pmatrix}1 & 0\\\\ 0 & -1\\end{pmatrix}$"
        correct: false
        feedback: "这是纯失谐 $\\Omega = 0$、$\\delta t = \\pi$ 的 $Z_{\\text{MR}}$ 门；只要 $\\Omega \\neq 0$，非对角元在 $\\theta = \\pi$ 处就不会为零。"
      - id: d
        text: "$+\\frac{i}{\\sqrt{2}}\\begin{pmatrix}1 & 1\\\\ 1 & -1\\end{pmatrix} = -H_{\\text{MR}}$"
        correct: false
        feedback: "同时改变整体正负号要求 $\\vec{\\boldsymbol{n}} \\to -\\vec{\\boldsymbol{n}}$，这需要 $\\beta=\\pi$ 且 $\\delta$ 也一起反号，仅改 $\\beta$ 不会把 $z$ 分量反号。"
    solution: "当 $\\beta = \\pi$ 时 $\\vec{\\boldsymbol{n}} = (-1/\\sqrt{2}, 0, 1/\\sqrt{2})$，在 $\\theta = \\pi$ 处 $U = -i\\vec{\\boldsymbol{n}}\\cdot\\vec{\\boldsymbol{\\sigma}} = -\\frac{i}{\\sqrt{2}}(-\\sigma_x + \\sigma_z) = -\\frac{i}{\\sqrt{2}}\\begin{pmatrix}1 & -1\\\\ -1 & -1\\end{pmatrix}$。"

  - id: u2-l1-recall-hz-explain
    dimension: conceptual
    type: explain
    role: recall
    knowledge_point: gate-z-and-hadamard-pulses
    difficulty: 1
    est_minutes: 1
    prompt: "用简练的话比较实现磁共振 $T/S/Z_{\\text{MR}}$ 相位门与 Hadamard 门 $H_{\\text{MR}}$ 所需的控制参数（$\\Omega, \\delta, \\beta, \\theta$）及对应矩阵形式。"
    rubric:
      - id: r1
        criterion: "说明 $T/S/Z_{\\text{MR}}$ 门令 $\\Omega = 0$ 依靠自由演化 $\\theta = \\delta t$（取 $\\pi/4, \\pi/2, \\pi$）获得对角矩阵 $\\text{diag}(e^{-i\\delta t/2}, e^{i\\delta t/2})$。"
        weight: 1
        required: true
      - id: r2
        criterion: "说明 $H_{\\text{MR}}$ 令 $\\Omega = \\delta$、$\\beta = 0$，且在 $\\theta = \\sqrt{2}\\Omega t = \\pi$ 时得到 $-\\frac{i}{\\sqrt{2}}\\begin{pmatrix}1 & 1\\\\ 1 & -1\\end{pmatrix}$。"
        weight: 1
        required: true
    exemplar: "当关闭驱动 $\\Omega = 0$ 时，自由演化仅沿 $+z$ 轴累积相移 $\\theta = \\delta t$，给出对角矩阵 $\\text{diag}(e^{-i\\delta t/2}, e^{i\\delta t/2})$，取 $\\delta t = \\pi/4, \\pi/2, \\pi$ 即分别实现 $T_{\\text{MR}}$、$S_{\\text{MR}}$ 与 $Z_{\\text{MR}} = -i\\sigma_z$。而实现 $H_{\\text{MR}}$ 须使 $\\Omega = \\delta$、$\\beta = 0$（转轴倾角 $45^\\circ$），并持续作用至 $\\theta = \\sqrt{2}\\Omega t = \\pi$，得到 $H_{\\text{MR}} = -\\frac{i}{\\sqrt{2}}\\begin{pmatrix}1 & 1\\\\ 1 & -1\\end{pmatrix}$。"

  - id: u2-l1-recall-hz-mc
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: gate-z-and-hadamard-pulses
    difficulty: 1
    est_minutes: 0.5
    prompt: "在同一失谐 $\\delta > 0$（关闭驱动 $\\Omega = 0$）的自由演化下，实现 $S_{\\text{MR}}$ 门所需时间 $t_S$ 与实现 $T_{\\text{MR}}$ 门所需时间 $t_T$ 满足什么关系？"
    options:
      - id: a
        text: "$t_S = 2 t_T$（分别对应 $\\delta t_S = \\pi/2$ 与 $\\delta t_T = \\pi/4$）"
        correct: true
        feedback: "完全正确！$S$ 门的 $z$ 旋转角是 $T$ 门的两倍，故时间精确翻倍。"
      - id: b
        text: "$t_S = \\frac{1}{2} t_T$"
        correct: false
        feedback: "$T$ 门又叫 $\\pi/8$ 门（旋转角 $\\pi/4$），$S$ 门旋转角 $\\pi/2$ 更大，因此 $t_S$ 应大于 $t_T$。"
      - id: c
        text: "$t_S = \\sqrt{2}\\,t_T$"
        correct: false
        feedback: "$\\sqrt{2}$ 因子来自 $\\Omega = \\delta$ 合成有效频率 $\\Omega_{\\text{eff}}$ 时的 Hadamard 门，自由演化时间与角 $\\delta t$ 呈线性正比。"
      - id: d
        text: "$t_S = 4 t_T$"
        correct: false
        feedback: "$4 t_T$ 对应 $\\delta t = \\pi$ 的 $Z_{\\text{MR}}$ 门，而不是 $S_{\\text{MR}}$ 门。"
    solution: "因 $\\theta = \\delta t$ 在 $T_{\\text{MR}}$ 与 $S_{\\text{MR}}$ 中分别取 $\\pi/4$ 与 $\\pi/2$，故在同一 $\\delta$ 下恒有 $t_S = 2 t_T$。"

  - id: u2-l1-recall-hz-expr
    dimension: math
    type: expression
