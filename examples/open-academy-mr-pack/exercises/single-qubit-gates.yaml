  - id: u2-l1-su2-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: "物理脉冲实现的 $H_{\\text{MR}} = -i\\hat{U}_{\\text{H}}$ 与量子光学教科书中的计算 Hadamard 门 $\\hat{U}_{\\text{H}} = \\frac{1}{\\sqrt{2}}\\begin{pmatrix}1 & 1\\\\ 1 & -1\\end{pmatrix}$ 在群论属性与单比特物理观测量上有何异同？"
    options:
      - id: a
        text: "两者行列式不同（$\\det(H_{\\text{MR}}) = +1 \\in SU(2)$ 而 $\\det(\\hat{U}_{\\text{H}}) = -1 \\in U(2)$），但两者仅差不可观测的全局相位 $-i$，故对单比特初态给出的测量概率分布和分量间相对相位完全一致。"
        correct: true
        feedback: "非常透彻！$SU(2)$ 是物理脉冲演化的天然群结构，而计算门通过剥离全局相位将矩阵简化为实对称或首行归一形式。"
      - id: b
        text: "因相差因子 $-i$，作用在 $|0\\rangle$ 上后测量 $|1\\rangle$ 的概率会从 $1/2$ 变成 $-1/2$。"
        correct: false
        feedback: "概率等于复概率幅的模平方，$|(-i)(1/\\sqrt{2})|^2 = |-i|^2 / 2 = 1/2$，全局相位的模恒为 $1$。"
      - id: c
        text: "$H_{\\text{MR}}$ 与 $\\hat{U}_{\\text{H}}$ 都满足 $\\det = +1$，两者唯一的区别在于基矢 $|0\\rangle$ 与 $|1\\rangle$ 的能量高低排序相反。"
        correct: false
        feedback: "直接计算行列式即可知 $\\det(\\hat{U}_{\\text{H}}) = \\frac{1}{2}(-1-1) = -1 \\neq +1$，该差异源于整体前置因子 $-i$，与基矢排序无关。"
      - id: d
        text: "$\\hat{U}_{\\text{H}}$ 是幺正算符而 $H_{\\text{MR}}$ 因含 $-i$ 因子不再满足 $U^\\dagger U = \\mathbb{1}$。"
        correct: false
        feedback: "$(-i\\hat{U}_{\\text{H}})^\\dagger(-i\\hat{U}_{\\text{H}}) = (+i)(-i)\\hat{U}_{\\text{H}}^2 = \\mathbb{1}$，$H_{\\text{MR}}$ 严格幺正。"
    solution: "所有由 $e^{-i\\theta\\vec{\\boldsymbol{n}}\\cdot\\vec{\\boldsymbol{S}}}$ 生成的脉冲门都满足 $\\det(U)=+1$ 与 $U^\\dagger U = \\mathbb{1}$（属于 $SU(2)$）；$\\hat{U}_{\\text{H}}$ 属于 $U(2)$（$\\det = -1$），两者之差 $-i$ 对任意单比特末态的概率幅比和模平方均无影响。"

  - id: u2-l1-su2-self-explain
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "按照 Gerry–Knight §11.10 式 (11.29) 的四门电路 $\\hat{U}_{\\text{PG}}(\\varphi+\\pi/2)\\hat{U}_{\\text{H}}\\hat{U}_{\\text{PG}}(2\\theta)\\hat{U}_{\\text{H}}|0\\rangle$ 直接乘出矩阵，结果其实是 $e^{i\\theta}(\\cos\\theta\\,|0\\rangle + e^{i\\varphi}\\sin\\theta\\,|1\\rangle)$，而原书略去了 $e^{i\\theta}$。为什么略去 $e^{i\\theta}$ 在单比特态制备上是完全合理的？"
    options:
      - id: a
        text: "因为 $e^{i\\theta}$ 同等地乘在 $|0\\rangle$ 与 $|1\\rangle$ 两个分量前面，对单比特来说属于全局相位，在测量投影概率和两个分量的相对相位比 $c_1/c_0$ 中完全消掉。"
        correct: true
        feedback: "完全正确！全局相位 $e^{i\\theta}$ 不含在量子态的物理可观测量中，提取公因子后两分量之间的相对相位才真正表征 $\\varphi$ 与 $\\theta$。"
      - id: b
        text: "因为只有在 $\\theta = 0$ 时才需要该回路，此时 $e^{i\\theta} = 1$ 恰好消失。"
        correct: false
        category: incorrect_reasoning
        feedback: "式 (11.29) 是用于制备任意振幅角 $\\theta$ 与相对相位 $\\varphi$ 叠加态的通用电路，对任意 $\\theta$ 全局因子 $e^{i\\theta}$ 都不可观测。"
      - id: c
        text: "因为最后一个相位门 $\\hat{U}_{\\text{PG}}(\\varphi+\\pi/2)$ 作用在 $|0\\rangle$ 分量上会乘以 $e^{-i\\theta}$，把 $e^{i\\theta}$ 自动消掉了。"
        correct: false
        category: math_error
        feedback: "计算相位门 $\\hat{U}_{\\text{PG}}(\\alpha) = \\text{diag}(1, e^{i\\alpha})$ 对 $|0\\rangle$ 的对角元恒为 $1$，并不会引入 $e^{-i\\theta}$ 因子；$e^{i\\theta}$ 是通过将 $\\frac{1}{\\sqrt{2}}(|0\\rangle + e^{i2\\theta}|1\\rangle)$ 提取公因子而产生的。"
      - id: d
        text: "因为单比特量子态的测量概率直接取实部而不取模平方，虚部相位自动忽略。"
        correct: false
        category: misunderstood_definition
        feedback: "测量概率始终是复振幅的模平方 $|c_k|^2$（而非实部），正因 $|e^{i\\theta}|^2 = 1$ 才使得全局相位不改概率。"
    solution: "对第二门后出现的 $e^{i2\\theta}$ 提取公共相位 $e^{i\\theta}$，最终矢量严格等于 $e^{i\\theta}(\\cos\\theta\\,|0\\rangle + e^{i\\varphi}\\sin\\theta\\,|1\\rangle)$；因 $|e^{i\\theta}| = 1$ 且分子分母可约去，全局因子 $e^{i\\theta}$ 对单比特可观测量毫无影响。"

  - id: u2-l1-su2-circuit-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 3
    params:
      theta_deg:
        min: 15
        max: 35
        step: 5
      phi_deg:
        min: 30
        max: 120
        step: 30
    prompt: "用四门电路 $\\hat{U}_{\\text{PG}}(\\varphi+\\pi/2)\\hat{U}_{\\text{H}}\\hat{U}_{\\text{PG}}(2\\theta)\\hat{U}_{\\text{H}}|0\\rangle$ 从 $|0\\rangle$ 制备目标叠加态，其中参数角取 $\\theta = {{=theta_deg}}^\\circ$、$\\varphi = {{=phi_deg}}^\\circ$。电路完成后测得量子比特处于 $|1\\rangle$ 态的概率 $P_1$ 是多少（填 $0$ 到 $1$ 之间的小数，保留三位小数）？"
    answer_expr: "sin(theta_deg * pi / 180)^2"
    tolerance:
      abs: 0.005
    common_wrong:
      - answer_expr: "cos(theta_deg * pi / 180)^2"
        category: math_error
        feedback: "你计算的是留在初态 $|0\\rangle$ 的概率 $\\cos^2\\theta$；注意电路输出为 $e^{i\\theta}(\\cos\\theta\\,|0\\rangle + e^{i\\varphi}\\sin\\theta\\,|1\\rangle)$，$|1\\rangle$ 的振幅模长为 $\\sin\\theta$。"
      - answer_expr: "sin((theta_deg / 2) * pi / 180)^2"
        category: math_error
        feedback: "误把角度再折半成 $\\theta/2$；注意第一门 $\\hat{U}_{\\text{PG}}(2\\theta)$ 里的 $2\\theta$ 经后续干涉与公因子提取后，进入最终叠加态振幅的正是 $\\theta$ 而非 $\\theta/2$。"
      - answer_expr: "sin(theta_deg * pi / 180)"
        category: math_error
        feedback: "忘记把概率幅 $\\sin\\theta$ 取模平方！量子力学中测量概率为 $P_1 = |e^{i\\theta}e^{i\\varphi}\\sin\\theta|^2 = \\sin^2\\theta$。"
    hints:
      - "由 Gerry–Knight 式 (11.29)，电路输出为 $e^{i\\theta}(\\cos\\theta\\,|0\\rangle + e^{i\\varphi}\\sin\\theta\\,|1\\rangle)$。"
      - "$|1\\rangle$ 分量上的概率为 $P_1 = |e^{i(\\theta+\\varphi)}\\sin\\theta|^2 = \\sin^2\\theta$，与 $\\varphi$ 无关。"
    solution: "最终输出态为 $e^{i\\theta}(\\cos{{=theta_deg}}^\\circ\\,|0\\rangle + e^{i{{=phi_deg}}^\\circ}\\sin{{=theta_deg}}^\\circ\\,|1\\rangle)$，因此 $P_1 = \\sin^2({{=theta_deg}}^\\circ) \\approx {{=round(sin(theta_deg * pi / 180)^2, 3)}}$。"

  - id: u2-l1-su2-spot-mistake
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "某同学在计算两步物理脉冲的乘积时这样推理：「既然物理门 $H_{\\text{MR}}$ 和教科书门 $\\hat{U}_{\\text{H}}$ 在单比特测量上物理等价，而 $\\hat{U}_{\\text{H}}^2 = \\mathbb{1}$，所以连续施加两次磁共振 Hadamard 脉冲同样满足 $H_{\\text{MR}}^2 = +\\mathbb{1}$。」下列哪种修正最精准？"
    options:
      - id: a
        text: "矩阵平方时必须把前置因子一起平方：$H_{\\text{MR}}^2 = (-i\\hat{U}_{\\text{H}})^2 = (-i)^2\\hat{U}_{\\text{H}}^2 = -\\mathbb{1}$；虽然单独作用于单比特时 $-\\mathbb{1}$ 与 $+\\mathbb{1}$ 测量效果相同，但作为算符恒等式符号严格取负。"
        correct: true
        feedback: "严密准确！自旋 $1/2$ 绕任意固定轴转 $2\\pi$ 会带来 $-1$ 的全局相因子，正是 $SU(2)$ 与三维空间旋转差异的集中体现。"
      - id: b
        text: "实际上 $\\hat{U}_{\\text{H}}^2 = -\\mathbb{1}$ 而 $H_{\\text{MR}}^2 = +\\mathbb{1}$，因为 $-i$ 的平方正好把负号消成正号。"
        correct: false
        feedback: "恰好弄反了：实对称矩阵 $\\hat{U}_{\\text{H}}$ 满足 $\\hat{U}_{\\text{H}}^2 = +\\mathbb{1}$，而 $(-i)^2 = -1$ 才让 $H_{\\text{MR}}^2 = -\\mathbb{1}$。"
      - id: c
        text: "$H_{\\text{MR}}$ 并非自逆门，平方之后会变成泡利矩阵 $Z_{\\text{MR}}$ 而不是单位矩阵的倍数。"
        correct: false
        feedback: "计算 $(-i\\hat{U}_{\\text{H}})^2$ 可知其结果是 $-\\mathbb{1}$，仍是单位矩阵的纯相位倍数，并非 $Z_{\\text{MR}}$。"
      - id: d
        text: "只有在施加到 $|1\\rangle$ 上时才得 $-1$，施加到 $|0\\rangle$ 上仍得 $+1$。"
        correct: false
        feedback: "$H_{\\text{MR}}^2 = -\\mathbb{1}$ 是整张矩阵的等式，无论作用在 $|0\\rangle$ 还是 $|1\\rangle$ 上都会统一乘上 $-1$。"
    solution: "因 $H_{\\text{MR}} = -i\\hat{U}_{\\text{H}}$ 且 $(-i)^2 = -1$、$\\hat{U}_{\\text{H}}^2 = +\\mathbb{1}$，直接相乘即得 $H_{\\text{MR}}^2 = -\\mathbb{1}$（对应自旋 $1/2$ 旋转 $2\\pi$ 积累的 $-1$ 相位）。"

  - id: u2-l1-su2-phase-transfer
    dimension: transfer
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "在真实磁共振硬件上执行 Gerry–Knight 四门电路时，只能直接运行 $SU(2)$ 脉冲门 $H_{\\text{MR}} = -i\\hat{U}_{\\text{H}}$ 与自由演化 $z$ 相位门 $U_z(\\alpha) = e^{-i\\alpha S_z} = e^{-i\\alpha/2}\\hat{U}_{\\text{PG}}(\\alpha)$。若直接用 $U_z(\\varphi+\\pi/2)\\,H_{\\text{MR}}\\,U_z(2\\theta)\\,H_{\\text{MR}}|0\\rangle$ 替换原 $U(2)$ 电路，输出末态会如何变化？"
    options:
      - id: a
        text: "整体矩阵乘积依然保持在 $SU(2)$ 内（$\\det = +1$），输出矢量相对于原四门精确矩阵乘积仅多出一个纯全局相位因子 $e^{-i(\\theta+\\varphi/2+5\\pi/4)}$，任意单比特测量概率 $|c_0|^2, |c_1|^2$ 与相对相位 $\\varphi$ 完全不变。"
        correct: true
        feedback: "迁移非常彻底！由于每次门替换都只是乘以常数标量相位（$-i$ 与 $e^{-i\\alpha/2}$），标量可直接移出全部矩阵乘积之外并汇成统一的不可观测全局相位。"
      - id: b
        text: "由于每次换门都要修改相对相位，最终 $|1\\rangle$ 分量上的相对相位不再等于 $\\varphi$，而是变成 $\\varphi - \\theta$。"
        correct: false
        feedback: "全局前置标量相位对矩阵的每一行每一列一视同仁，从矩阵乘法中提出公因子后绝对不会改变 $|0\\rangle$ 与 $|1\\rangle$ 之间的相对相位。"
      - id: c
        text: "两个 $H_{\\text{MR}}$ 带来的 $-i$ 相乘变为 $-1$，会把原本制备在 $|0\\rangle$ 与 $|1\\rangle$ 上的布居完全反转过来。"
        correct: false
        feedback: "全局负号 $-1$ 不改变 $|0\\rangle$ 或 $|1\\rangle$ 的任何测量概率，与布居交换（比特翻转）完全是两回事。"
      - id: d
        text: "替换后演化算符不再属于 $SU(2)$，行列式不再等于 $+1$。"
        correct: false
        feedback: "$SU(2)$ 对矩阵乘法封闭：两个及以上 $\\det = +1$ 的矩阵相乘，乘积的行列式恒等于 $+1$。"
    solution: "因 $H_{\\text{MR}} = -i\\hat{U}_{\\text{H}}$ 与 $U_z(\\alpha) = e^{-i\\alpha/2}\\hat{U}_{\\text{PG}}(\\alpha)$ 都与计算门仅差纯标量全局相位，四门连乘只会在原式基础上多出常数整体相因子（具体为 $(-i)^2 e^{-i\\theta} e^{-i(\\varphi+\\pi/2)/2}$），既保持 $\\det = +1$ 又完全不改变物理态的测量概率与相对相位。"

  - id: u2-l1-recall-su2-explain
    dimension: conceptual
    type: explain
    role: recall
    knowledge_point: gate-su2-global-phase-and-circuits
    difficulty: 1
    est_minutes: 1
    prompt: "解释物理脉冲门（$SU(2)$）与计算量子门（$U(2)$）的区别，并说明为什么全局相位在单比特态中不可观测。"
    rubric:
      - id: r1
        criterion: "指出物理自旋脉冲门满足 $U^\\dagger U = \\mathbb{1}$ 且 $\\det(U)=+1$（属于 $SU(2)$），而 $\\hat{U}_{\\text{H}}, \\hat{U}_{\\text{PG}}$ 等计算门因约定原因属于 $U(2)$（如 $\\det(\\hat{U}_{\\text{H}})=-1$），两者仅差整体相位因子。"
        weight: 1
        required: true
      - id: r2
        criterion: "说明整体相因子 $e^{i\\gamma}$ 在基矢测量概率 $|e^{i\\gamma}c_k|^2 = |c_k|^2$ 与分量间相对相位 $(e^{i\\gamma}c_1)/(e^{i\\gamma}c_0)$ 中均完全消去。"
        weight: 1
        required: true
    exemplar: "磁共振物理脉冲门均满足幺正性且行列式 $\\det(U)=+1$，严格属于 $SU(2)$ 群；而 $\\hat{U}_{\\text{H}}$（$\\det=-1$）、$\\hat{U}_{\\text{PG}}(\\varphi)$（$\\det=e^{i\\varphi}$）等计算门属于 $U(2)$，两者仅差一个全局相位因子（例如 $H_{\\text{MR}} = -i\\hat{U}_{\\text{H}}$）。对单比特而言，全局相因子 $e^{i\\gamma}$ 在任何概率测量 $|e^{i\\gamma}c_k|^2=|c_k|^2$ 及分量相对相位比值中都会完全抵消，因此不产生可观测差异。"

  - id: u2-l1-recall-su2-mc
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: gate-su2-global-phase-and-circuits
    difficulty: 1
    est_minutes: 0.5
    prompt: "在 Gerry–Knight 式 (11.29) 的四门电路中，要从 $|0\\rangle$ 合成出目标态（忽略全局相位）$\\cos\\theta\\,|0\\rangle + e^{i\\varphi}\\sin\\theta\\,|1\\rangle$，由右向左依次作用的四个门应当是哪一组？"
    options:
      - id: a
        text: "$\\hat{U}_{\\text{PG}}(\\varphi + \\pi/2)\\,\\hat{U}_{\\text{H}}\\,\\hat{U}_{\\text{PG}}(2\\theta)\\,\\hat{U}_{\\text{H}}|0\\rangle$"
        correct: true
        feedback: "准确无误！中间的 $\\hat{U}_{\\text{PG}}(2\\theta)$ 决定最终计算基振幅 $\\cos\\theta$、$\\sin\\theta$，末尾的 $\\hat{U}_{\\text{PG}}(\\varphi+\\pi/2)$ 再把 $-i$ 调整到相对相位 $e^{i\\varphi}$。"
      - id: b
        text: "$\\hat{U}_{\\text{PG}}(\\varphi)\\,\\hat{U}_{\\text{H}}\\,\\hat{U}_{\\text{PG}}(\\theta)\\,\\hat{U}_{\\text{H}}|0\\rangle$"
        correct: false
        feedback: "若中间相位门仅放 $\\theta$，最终振幅将变成 $\\cos(\\theta/2)$ 与 $\\sin(\\theta/2)$，而且末尾少了 $\\pi/2$ 补偿会遗留额外的 $-i$ 相对相位。"
      - id: c
        text: "$\\hat{U}_{\\text{H}}\\,\\hat{U}_{\\text{PG}}(\\varphi + \\pi/2)\\,\\hat{U}_{\\text{H}}\\,\\hat{U}_{\\text{PG}}(2\\theta)|0\\rangle$"
        correct: false
        feedback: "第一个门必须是 $\\hat{U}_{\\text{H}}$ 以把 $|0\\rangle$ 展开为等权叠加；若先对 $|0\\rangle$ 作用 $\\hat{U}_{\\text{PG}}(2\\theta)$ 只能得到不变的 $|0\\rangle$。"
      - id: d
        text: "$\\hat{U}_{\\text{PG}}(2\\theta)\\,\\hat{U}_{\\text{H}}\\,\\hat{U}_{\\text{PG}}(\\varphi + \\pi/2)\\,\\hat{U}_{\\text{H}}|0\\rangle$"
        correct: false
        feedback: "决定布居比例的参数 $\\theta$ 必须位于两次 $\\hat{U}_{\\text{H}}$ 的干涉内侧，最外层的相位门无法再改变 $|0\\rangle$ 与 $|1\\rangle$ 的布居比例。"
    solution: "由右向左依次经 $\\hat{U}_{\\text{H}}$ 展平、$\\hat{U}_{\\text{PG}}(2\\theta)$ 引入相位差 $2\\theta$、第二次 $\\hat{U}_{\\text{H}}$ 干涉成 $e^{i\\theta}(\\cos\\theta|0\\rangle - i\\sin\\theta|1\\rangle)$，最后由 $\\hat{U}_{\\text{PG}}(\\varphi + \\pi/2)$ 将 $-i = e^{-i\\pi/2}$ 调为 $e^{i\\varphi}$。"

