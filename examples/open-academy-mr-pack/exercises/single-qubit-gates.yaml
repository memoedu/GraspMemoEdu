  - id: u2-l1-final-explain
    dimension: conceptual
    type: explain
    role: core
    difficulty: 2
    est_minutes: 4
    prompt: "请用自己的话系统梳理磁共振单比特量子门构造与电路合成的三大支柱：（1）共振赤道面内如何通过脉冲时间与相位 $\\beta$ 构造 $(\\pi/2)_\\beta$、$(\\pi)_\\beta$ 及 Pauli-X/Y 门，并说明原讲义 $(\\pi)_\\pi$ 笔误如何纠正；（2）如何在 $(\\Omega,\\delta)$ 平面上分别构造自由演化 $T/S/Z_{\\text{MR}}$ 门与倾斜轴 Hadamard 门 $H_{\\text{MR}}$；（3）物理 $SU(2)$ 脉冲门与计算 $U(2)$ 门的全局相位差异为何不影响单比特物理观测，以及 Gerry–Knight 四门电路如何合成任意叠加态。"
    rubric:
      - id: r1
        criterion: "说清 $\\delta=0$ 时 $\\vec{\\boldsymbol{n}}=(\\cos\\beta,\\sin\\beta,0)$、$\\theta=\\Omega t$，给出 $(\\pi/2)_\\beta, (\\pi)_\\beta$ 与 $(\\pi)_x=-i\\sigma_x, (\\pi)_y=-i\\sigma_y$，并指明讲义第 7 页 $\\beta=0$ 处误印为 $(\\pi)_\\pi$ 实为 $(\\pi)_x$。"
        weight: 1
        required: true
      - id: r2
        criterion: "说明关闭驱动 $\\Omega=0$ 靠 $\\theta=\\delta t$ 依次取 $\\pi/4, \\pi/2, \\pi$ 得 $T, S, Z_{\\text{MR}}$；令 $\\Omega=\\delta, \\beta=0$ 且 $\\theta=\\sqrt{2}\\Omega t = \\pi$ 得 $H_{\\text{MR}} = -i(\\sigma_x+\\sigma_z)/\\sqrt{2}$。"
        weight: 1
        required: true
      - id: r3
        criterion: "对比物理 $SU(2)$（$\\det U = +1$, $H_{\\text{MR}}^2 = -\\mathbb{1}$）与计算 $U(2)$（$\\det\\hat{U}_{\\text{H}} = -1$）的全局相位差，解释单比特不可观测性并写出四门电路 $\\hat{U}_{\\text{PG}}(\\varphi+\\pi/2)\\hat{U}_{\\text{H}}\\hat{U}_{\\text{PG}}(2\\theta)\\hat{U}_{\\text{H}}|0\\rangle$。"
        weight: 1
        required: true
      - id: r4
        criterion: "补充指出四门电路严格乘积带有不可观测公因子 $e^{i\\theta}$，而原式 (11.29) 为简洁起见将其略去。"
        weight: 1
        required: false
    exemplar: "从一般旋转 $U = \\cos(\\theta/2)\\mathbb{1} - i\\sin(\\theta/2)\\vec{\\boldsymbol{n}}\\cdot\\vec{\\boldsymbol{\\sigma}}$ 出发：（1）当精确共振 $\\delta=0$ 时，转角 $\\theta=\\Omega t$ 而转轴 $\\vec{\\boldsymbol{n}}=(\\cos\\beta,\\sin\\beta,0)$ 处于赤道平面，由相位 $\\beta$ 连续切换旋转轴；取 $\\beta=0$ 与 $\\pi/2$ 即得 $(\\pi/2)_x, (\\pi/2)_y$ 与 $(\\pi)_x=-i\\sigma_x, (\\pi)_y=-i\\sigma_y$，同时须修正原讲义第 7 页将 $\\beta=0$ 处 $(\\pi)_x$ 错印为 $(\\pi)_\\pi$ 的笔误。（2）若关闭驱动 $\\Omega=0$ 而让自旋自由演化，则 $\\theta=\\delta t$ 沿 $+z$ 轴产生对角相移门 $T(\\pi/4)$、$S(\\pi/2)$ 与 $Z_{\\text{MR}}(\\pi)$；若令 $\\Omega=\\delta$ 且 $\\beta=0$，有效轴倾角为 $45^\\circ$、$\\Omega_{\\text{eff}}=\\sqrt{2}\\Omega$，作用至 $\\theta=\\pi$ 即得 $H_{\\text{MR}} = -\\frac{i}{\\sqrt{2}}\\begin{pmatrix}1 & 1\\\\ 1 & -1\\end{pmatrix}$。（3）所有物理脉冲演化都属于 $SU(2)$ 群（$\\det(U)=+1$，且 $H_{\\text{MR}}^2=-\\mathbb{1}$），与计算 $U(2)$ 门 $\\hat{U}_{\\text{H}}$（$\\det=-1$）、$\\hat{U}_{\\text{PG}}(\\varphi)$ 仅差不可观测的全局相位因子，不会改变任何基测量概率和相对相位；交替级联两次 $\\hat{U}_{\\text{H}}$ 与相位门组成四门电路 $\\hat{U}_{\\text{PG}}(\\varphi+\\pi/2)\\hat{U}_{\\text{H}}\\hat{U}_{\\text{PG}}(2\\theta)\\hat{U}_{\\text{H}}|0\\rangle$，准确生成任意单比特叠加态 $e^{i\\theta}(\\cos\\theta|0\\rangle + e^{i\\varphi}\\sin\\theta|1\\rangle)$（Gerry–Knight 式 11.29 略去了整体因子 $e^{i\\theta}$）。"
