    prompt: "在构造 Hadamard 门 $H_{\\text{MR}}$ 的条件 $\\Omega = \\delta > 0$ 下，写出有效拉比频率 $\\Omega_{\\text{eff}}$ 的简化表达式（用 `Om` 表示驱动幅度 $\\Omega$，平方根写成 `sqrt(...)`）。"
    answer: "sqrt(2) * Om"
    variables:
      Om: [1, 20]
    solution: "将 $\\delta = \\Omega$ 代入 $\\Omega_{\\text{eff}} = \\sqrt{\\Omega^2 + \\delta^2}$，直接得到 $\\Omega_{\\text{eff}} = \\sqrt{2}\\Omega$。"

