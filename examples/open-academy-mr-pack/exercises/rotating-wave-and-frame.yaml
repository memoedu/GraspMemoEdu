  - id: rwa-final-explain
    dimension: conceptual
    type: explain
    role: core
    difficulty: 2
    est_minutes: 4
    prompt: "请用自己的话系统回答三个问题：（1）旋波近似是如何分解线性驱动场并决定舍去哪一项的？（2）相互作用图像变换 $U_i = e^{-i\\omega t S_z}$ 如何消除时间变量 $t$？（3）在什么条件下旋波近似会失效？"
    rubric:
      - id: r1
        criterion: "说明将线偏振余弦场分解为等幅度的逆时针（$+1$ 角动量）与顺时针（$-1$ 角动量）两个圆偏振分量，并以电子自旋向上跃迁 $\\Delta m_S = +1$ 的角动量守恒与方向相反解释为何舍去顺时针项。"
        weight: 1
        required: true
      - id: r2
        criterion: "说明 $U_i = e^{-i\\omega t S_z}$ 切换到随驱动同步旋转的参考系，通过导数修正把静态项变为 $(\\omega_0 - \\omega)S_z$，并利用三维旋转公式或 $U_i^\\dagger S^+ U_i = e^{i\\omega t}S^+$ 将旋转驱动转回只含初相位 $\\varphi$ 的常系数形式。"
        weight: 1
        required: true
      - id: r3
        criterion: "说明当驱动场太强、$\\Omega$ 可比拟或不再远小于 $\\omega_0$ 时，旋波近似失效，被舍去的反向项会引起共振频率偏移。"
        weight: 1
        required: true
      - id: r4
        criterion: "补充指出升降算符方法不仅对高自旋成立，还可直接推广到玻色子的产生与湮灭算符 $a^\\dagger, a$。"
        weight: 1
        required: false
    exemplar: "旋波近似先把沿 $x$ 轴振荡的余弦场 $2\\Omega\\cos(\\omega t+\\varphi)S_x$ 拆成幅值同为 $\\Omega$ 的逆时针与顺时针两个圆偏振分量；由于电子自旋向上跃迁需要吸收 $+1$ 角动量光子（$\\Delta m_S=+1$），顺时针（$-1$）分量角动量不守恒且方向相反，在弱驱动下被忽略。接着作相互作用图像变换 $U_i = e^{-i\\omega t S_z}$ 坐进同步旋转参考系：时间求导把静态能级项改写为 $(\\omega_0 - \\omega)S_z$，而通过三维旋转公式顺时针转回 $\\omega t$（或借助升降算符恒等式 $U_i^\\dagger S^+ U_i = e^{i\\omega t}S^+$），含时驱动化简为固定的 $\\Omega[\\cos(\\varphi)S_x + \\sin(\\varphi)S_y]$，升降算符法还可推广到产生湮灭算符。最后，当强驱动下 $\\Omega$ 不再远小于 $\\omega_0$ 时，反向项无法被平均掉而引发共振频率偏移，旋波近似随之失效。"
