concept: su2-evolution-and-rabi-prob
exercises:
  # ==========================================================================
  # Step 1: su2-effective-field-and-unitary (5 题课堂 + 3 题 recall)
  # ==========================================================================
  - id: rabi-axis-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: "在把常系数有效哈密顿量写成 $H_I = \\Omega_{\\text{eff}}\\,\\vec{\\boldsymbol{n}}\\cdot\\vec{\\boldsymbol{S}}$ 时，严格共振（$\\delta = \\omega_0 - \\omega = 0$）对有效旋转轴 $\\vec{\\boldsymbol{n}}$ 的方向有什么决定性影响？"
    options:
      - id: a
        text: "极角 $\\theta' = 90^\\circ$，有效转轴 $\\vec{\\boldsymbol{n}} = (\\cos\\varphi, \\sin\\varphi, 0)$ 完全倒在赤道 $x\\text{-}y$ 平面内，从而能将下态 $|m_S=-1/2\\rangle$ 沿水平轴彻底翻转到上态 $|m_S=+1/2\\rangle$。"
        correct: true
        feedback: "完全正确。当 $\\delta = 0$ 时 $\\cos\\theta' = \\delta/\\Omega_{\\text{eff}} = 0$，转轴不再向上偏移 $z$ 分量，正好实现极点到极点的完全翻转。"
      - id: b
        text: "有效转轴直接变成沿 $+z$ 轴方向的 $(0, 0, 1)$，与初相位 $\\varphi$ 无关。"
        correct: false
        feedback: "$\\delta = 0$ 恰恰让 $z$ 分量 $\\cos\\theta'=0$ 消失；只有驱动关闭（$\\Omega = 0$）且 $\\delta > 0$ 时转轴才指沿 $+z$ 轴。"
      - id: c
        text: "有效拉比频率 $\\Omega_{\\text{eff}}$ 变为零，使演化算符 $U_I$ 恒等于单位算符 $\\mathbb{1}$。"
        correct: false
        feedback: "$\\delta = 0$ 时 $\\Omega_{\\text{eff}} = \\sqrt{\\Omega^2 + 0} = \\Omega$，并不是零。"
      - id: d
        text: "转角公式里的 $\\theta = \\Omega_{\\text{eff}}t$ 固定死为 $90^\\circ$，不再随时间 $t$ 变化。"
        correct: false
        feedback: "固定在 $90^\\circ$ 的是不随时间变化的倾角 $\\theta'$；围绕转轴进行的旋转角 $\\theta = \\Omega_{\\text{eff}}t$ 始终随时间线性增加。"
    solution: "共振时 $\\delta = 0$，故 $\\cos\\theta' = \\delta/\\Omega_{\\text{eff}} = 0$、$\\sin\\theta' = 1$，有效旋转轴 $\\vec{\\boldsymbol{n}} = (\\cos\\varphi, \\sin\\varphi, 0)$ 完全处于 $x\\text{-}y$ 赤道平面内。"

  - id: rabi-axis-self-explain
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "在刚刚写出 $U_I = e^{-i H_I t} = \\cos(\\theta/2)\\mathbb{1} - i\\sin(\\theta/2)\\vec{\\boldsymbol{n}}\\cdot\\vec{\\boldsymbol{\\sigma}}$ 时，为什么三角函数自变量里会出现二分之一因子 $\\theta/2$，而不是 $\\cos(\\theta)\\mathbb{1} - i\\sin(\\theta)\\vec{\\boldsymbol{n}}\\cdot\\vec{\\boldsymbol{\\sigma}}$？"
    options:
      - id: a
        text: "因为泡利矢量满足 $\\vec{\\boldsymbol{\\sigma}} = 2\\vec{\\boldsymbol{S}}$，把 $H_I t = \\Omega_{\\text{eff}}t\\,\\vec{\\boldsymbol{n}}\\cdot\\vec{\\boldsymbol{S}}$ 改写成 $\\vec{\\boldsymbol{\\sigma}}$ 时自然多出了因子 $1/2$（即 $\\frac{\\theta}{2}\\vec{\\boldsymbol{n}}\\cdot\\vec{\\boldsymbol{\\sigma}}$），同时 $(\\vec{\\boldsymbol{n}}\\cdot\\vec{\\boldsymbol{\\sigma}})^2=\\mathbb{1}$ 展开直接把它带进 $\\cos$ 与 $\\sin$。"
        correct: true
        feedback: "抓住了重点！自旋 $1/2$ 算符本征值为 $\\pm 1/2$ 而泡利矩阵本征值为 $\\pm 1$，两者差出的 $1/2$ 正是旋量旋转特征的“半角”来源。"
      - id: b
        text: "因为做了旋波近似时丢掉了一半能量项，所以演化角必须跟着减半。"
        correct: false
        category: incorrect_reasoning
        feedback: "旋波近似后保留项已经用半幅值 $\\Omega$ 写入 $H_I$；这里的 $\\theta/2$ 纯粹来源于自旋算符 $\\vec{\\boldsymbol{S}} = \\vec{\\boldsymbol{\\sigma}}/2$。"
      - id: c
        text: "因为时间演化只需计算到半周期 $t/2$，之后状态就会自动保持不变。"
        correct: false
        category: misunderstood_definition
        feedback: "演化角是完整的 $\\theta = \\Omega_{\\text{eff}}t$，$\\theta/2$ 反映的是自旋态波函数相对于三维几何矢量旋转的半角规律。"
      - id: d
        text: "因为矩阵指数在取虚数单位 $i$ 之后会自动把角度系数缩小为原来的一半。"
        correct: false
        category: math_error
        feedback: "$e^{-i\\alpha A}$ 当 $A^2=\\mathbb{1}$ 时展开为 $\\cos(\\alpha)\\mathbb{1} - i\\sin(\\alpha)A$，不会自己除以 $2$；这里的 $\\alpha$ 本身就等于 $\\theta/2$。"
    solution: "由于泡利算符满足 $\\vec{\\boldsymbol{\\sigma}} = 2\\vec{\\boldsymbol{S}}$ 且 $(\\vec{\\boldsymbol{n}}\\cdot\\vec{\\boldsymbol{\\sigma}})^2 = \\mathbb{1}$，所以 $e^{-i\\theta\\vec{\\boldsymbol{n}}\\cdot\\vec{\\boldsymbol{S}}} = e^{-i(\\theta/2)\\vec{\\boldsymbol{n}}\\cdot\\vec{\\boldsymbol{\\sigma}}} = \\cos(\\theta/2)\\mathbb{1} - i\\sin(\\theta/2)\\vec{\\boldsymbol{n}}\\cdot\\vec{\\boldsymbol{\\sigma}}$。"

  - id: rabi-eff-freq-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 3
    params:
      Om:
        min: 3
        max: 9
        step: 3
      delta:
        min: 4
        max: 12
        step: 4
    constraints:
      - "Om * 4 == delta * 3"
    prompt: "某自旋脉冲实验的横向单分量驱动幅度为 $\\Omega/(2\\pi) = {{=Om}}\\text{ MHz}$，失谐偏共振为 $\\delta/(2\\pi) = {{=delta}}\\text{ MHz}$。求旋转坐标系中的有效拉比频率 $\\Omega_{\\text{eff}}/(2\\pi)$ 是多少 $\\text{MHz}$？"
    answer_expr: "sqrt(Om*Om + delta*delta)"
    tolerance:
      abs: 0.01
    common_wrong:
      - answer_expr: "Om + delta"
        category: math_error
        feedback: "横向驱动与纵向失谐相互垂直，必须按直角三角形求矢量合成长度 $\\sqrt{\\Omega^2 + \\delta^2}$，不能直接代数相加。"
      - answer_expr: "abs(delta - Om)"
        category: math_error
        feedback: "有效频率由正交分量合成，不可能比其中任一分量还小，应按 $\\sqrt{\\Omega^2+\\delta^2}$ 计算。"
    hints:
      - "利用勾股合成公式 $\\Omega_{\\text{eff}} = \\sqrt{\\Omega^2 + \\delta^2}$。"
      - "这里恰好构成 $3\\text{–}4\\text{–}5$ 比例的直角三角形。"
    solution: "由 $\\Omega_{\\text{eff}}/(2\\pi) = \\sqrt{{{=Om}}^2 + {{=delta}}^2} = {{=sqrt(Om*Om + delta*delta)}}\\text{ MHz}$。"

  - id: rabi-angle-spot-mistake
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "一位同学在计算有失谐（$\\delta \\ne 0$）驱动下的演化算符时写道：『$t$ 时刻演化算符 $U_I = \\cos(\\theta'/2)\\mathbb{1} - i\\sin(\\theta'/2)\\vec{\\boldsymbol{n}}\\cdot\\vec{\\boldsymbol{\\sigma}}$，其中 $\\cos\\theta' = \\delta/\\Omega_{\\text{eff}}$，所以演化状态与时间 $t$ 无关』。这段推导混淆了哪两个角度？"
    options:
      - id: a
        text: "把定义有效转轴倾斜度、与时间无关的极角 $\\theta'$（满足 $\\cos\\theta'=\\delta/\\Omega_{\\text{eff}}$）当成了随时间线性累积的旋转角度 $\\theta = \\Omega_{\\text{eff}}t$。"
        correct: true
        feedback: "一针见血！$\\theta'$ 只用来指向固定单位轴 $\\vec{\\boldsymbol{n}}$，而写进 $U_I$ 的是随时间演化的 $\\theta = \\Omega_{\\text{eff}}t$。"
      - id: b
        text: "错把 $\\cos\\theta'$ 的分母写成了 $\\Omega_{\\text{eff}}$，实际分母应该只有横向幅度 $\\Omega$。"
        correct: false
        category: math_error
        feedback: "$\\cos\\theta' = \\delta/\\Omega_{\\text{eff}}$（分母是矢量斜边模长 $\\Omega_{\\text{eff}}$）这半句反而是对的，错在把 $\\theta'$ 填进了 $U_I$ 的演化解角里。"
      - id: c
        text: "当 $\\delta \\ne 0$ 时演化算符里不能出现 $\\vec{\\boldsymbol{\\sigma}}$，只能把 $H_I$ 当成纯对角矩阵演化。"
        correct: false
        category: misapplied_technique
        feedback: "只要 $\\Omega \\ne 0$，有效场轴就存在横向分量，演化解算符必然同时含横向泡利分量与 $z$ 分量。"
      - id: d
        text: "应该把 $U_I$ 中的 $\\theta'/2$ 乘以 $2$ 变为 $\\theta'$，即无需半角。"
        correct: false
        category: misunderstood_definition
        feedback: "演化算符三角函数自变量不仅应当保持半角，而且里面的角度是 $\\theta = \\Omega_{\\text{eff}}t$ 而非 $\\theta'$。"
    solution: "有效转轴 $\\vec{\\boldsymbol{n}}$ 的方向由静态极角 $\\theta'$（$\\cos\\theta'=\\delta/\\Omega_{\\text{eff}}$）与方位角 $\\varphi$ 确定；而演化算符 $U_I$ 绕该轴转过的角度是随时间增大的 $\\theta = \\Omega_{\\text{eff}}t$。"

  - id: rabi-axis-phase-transfer
    dimension: transfer
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 3
    prompt: "设某自旋在相互作用图像中恰好共振（$\\delta = 0$），实验者先令驱动初相位 $\\varphi = \\pi/2$ 作用了使旋转角 $\\theta = \\pi/2$ 的时长 $t$。根据 $H_I = \\Omega_{\\text{eff}}\\vec{\\boldsymbol{n}}\\cdot\\vec{\\boldsymbol{S}}$ 与 $U_I$，此时自旋态绕哪根坐标轴转动了多大角度？"
    options:
      - id: a
        text: "绕 $+y$ 轴（单位轴 $\\vec{\\boldsymbol{n}} = (0, 1, 0)$）转过 $\\theta = \\pi/2$，演化算符 $U_I = \\cos(\\pi/4)\\mathbb{1} - i\\sin(\\pi/4)\\sigma_y$。"
        correct: true
        feedback: "迁移准确！$\\delta=0$ 给 $\\sin\\theta'=1, \\cos\\theta'=0$，再由 $\\varphi=\\pi/2$ 得 $\\vec{\\boldsymbol{n}} = (0,1,0)$，转角为 $\\theta = \\pi/2$（即半角 $\\pi/4$）。"
      - id: b
        text: "绕 $+x$ 轴转过 $\\pi/2$，对应演化算符 $\\cos(\\pi/4)\\mathbb{1} - i\\sin(\\pi/4)\\sigma_x$。"
        correct: false
        category: misapplied_technique
        feedback: "绕 $+x$ 轴对应初相位 $\\varphi = 0$；当 $\\varphi = \\pi/2$ 时 $(\\cos\\varphi, \\sin\\varphi) = (0, 1)$，指向 $+y$ 轴。"
      - id: c
        text: "绕 $+z$ 轴转过 $\\pi/2$，因为共振时纵向项主导转动。"
        correct: false
        category: incorrect_reasoning
        feedback: "共振 $\\delta = 0$ 恰恰令 $n_z = \\cos\\theta' = 0$，转轴全部躺在 $x\\text{-}y$ 平面，没有任何 $z$ 分量。"
      - id: d
        text: "绕 $+y$ 轴转过 $\\pi/4$，因此矩阵系数中出现 $\\cos(\\pi/8)$ 与 $\\sin(\\pi/8)$。"
        correct: false
        category: math_error
        feedback: "算符式子里的半角 $\\theta/2 = \\pi/4$ 已经体现了几何转角 $\\theta = \\pi/2$ 的一半，不能再次除以 $2$。"
    solution: "当 $\\delta = 0$ 且 $\\varphi = \\pi/2$ 时，有效转轴为 $\\vec{\\boldsymbol{n}} = (\\cos(\\pi/2), \\sin(\\pi/2), 0) = (0, 1, 0)$；故 $\\theta = \\pi/2$ 时有 $U_I = \\cos(\\pi/4)\\mathbb{1} - i\\sin(\\pi/4)\\sigma_y$。"

  - id: rabi-recall-axis-say
    dimension: conceptual
    type: explain
    role: recall
    knowledge_point: su2-effective-field-and-unitary
    difficulty: 1
    est_minutes: 1
    prompt: "用一两句话写出 $H_I$ 中有效拉比频率 $\\Omega_{\\text{eff}}$、单位转轴 $\\vec{\\boldsymbol{n}}$ 及 $SU(2)$ 演化算符 $U_I$ 的物理含义。"
    rubric:
      - id: r1
        criterion: "说明定义偏共振 $\\delta = \\omega_0 - \\omega$ 与合成模长 $\\Omega_{\\text{eff}} = \\sqrt{\\Omega^2 + \\delta^2}$，将哈密顿量合成为绕单位轴 $\\vec{\\boldsymbol{n}}$ 的等效进动 $H_I = \\Omega_{\\text{eff}}\\vec{\\boldsymbol{n}}\\cdot\\vec{\\boldsymbol{S}}$。"
        weight: 1
        required: true
      - id: r2
        criterion: "给出演化算符 $U_I = \\cos(\\theta/2)\\mathbb{1} - i\\sin(\\theta/2)\\vec{\\boldsymbol{n}}\\cdot\\vec{\\boldsymbol{\\sigma}}$（$\\theta=\\Omega_{\\text{eff}}t$、$\\vec{\\boldsymbol{\\sigma}}=2\\vec{\\boldsymbol{S}}$）。"
        weight: 1
        required: true
    exemplar: "引入偏共振 $\\delta = \\omega_0 - \\omega$ 与有效拉比频率 $\\Omega_{\\text{eff}} = \\sqrt{\\Omega^2+\\delta^2}$ 后，常系数哈密顿量简化为 $H_I = \\Omega_{\\text{eff}}\\vec{\\boldsymbol{n}}\\cdot\\vec{\\boldsymbol{S}}$；利用泡利矢量 $\\vec{\\boldsymbol{\\sigma}} = 2\\vec{\\boldsymbol{S}}$ 展开指数算符，即得绕固定轴 $\\vec{\\boldsymbol{n}}$ 转动角度 $\\theta = \\Omega_{\\text{eff}}t$ 的 $SU(2)$ 演化算符 $U_I = \\cos(\\theta/2)\\mathbb{1} - i\\sin(\\theta/2)\\vec{\\boldsymbol{n}}\\cdot\\vec{\\boldsymbol{\\sigma}}$。"

  - id: rabi-recall-axis-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: su2-effective-field-and-unitary
    difficulty: 1
    est_minutes: 0.5
    prompt: "在有效转轴公式 $\\vec{\\boldsymbol{n}} = (\\sin\\theta'\\cos\\varphi,\\; \\sin\\theta'\\sin\\varphi,\\; \\cos\\theta')$ 中，哪一项决定转轴朝 $+z$ 轴还是赤道面偏斜的倾角 $\\theta'$？"
    options:
      - id: a
        text: "由偏共振与总有效频率之比 $\\cos\\theta' = \\delta/\\Omega_{\\text{eff}}$ 决定"
        correct: true
        feedback: "正确。$\\delta = 0$ 时 $\\cos\\theta'=0$（倒在赤道面）；$|\\delta| \\gg \\Omega$ 时转轴几乎倒向 $z$ 轴。"
      - id: b
        text: "仅由驱动初相位 $\\varphi$ 的余弦 $\\cos\\varphi$ 决定"
        correct: false
        feedback: "初相位 $\\varphi$ 只决定 $\\vec{\\boldsymbol{n}}$ 投影在 $x\\text{-}y$ 平面中的方位角，不影响 $z$ 分量。"
      - id: c
        text: "随演化时间 $t$ 以 $\\theta' = \\Omega_{\\text{eff}}t$ 持续增大"
        correct: false
        feedback: "随时间线性增长的是围绕 $\\vec{\\boldsymbol{n}}$ 转动的角度 $\\theta$；转轴倾角 $\\theta'$ 由常数 $\\Omega, \\delta$ 固定。"
      - id: d
        text: "恒等于 $45^\\circ$，与驱动场幅值 $\\Omega$ 和失谐 $\\delta$ 都无关"
        correct: false
        feedback: "只有当 $\\delta = \\Omega$ 的特例才恰好出现 $\\theta' = 45^\\circ$。"
    solution: "由于 $H_I = \\delta S_z + \\Omega[\\cos(\\varphi)S_x + \\sin(\\varphi)S_y]$，提取模长 $\\Omega_{\\text{eff}} = \\sqrt{\\Omega^2+\\delta^2}$ 后自然得到 $\\cos\\theta' = \\delta/\\Omega_{\\text{eff}}$。"

  - id: rabi-recall-axis-formula
    dimension: math
    type: expression
    role: recall
    knowledge_point: su2-effective-field-and-unitary
    difficulty: 1
    est_minutes: 0.5
    prompt: "写出单分量驱动幅值 $\\Omega$ 与偏共振 $\\delta = \\omega_0 - \\omega$ 合成的有效拉比频率 $\\Omega_{\\text{eff}}$ 表达式（用 `Om` 表示 $\\Omega$，`d` 表示 $\\delta$，平方根写成 `sqrt(...)`）。"
    answer: "sqrt(Om^2 + d^2)"
    variables:
      Om: [1, 20]
      d: [-15, 15]
    solution: "横向驱动 $\\Omega$ 与纵向失谐 $\\delta$ 正交合成，有效拉比频率为 $\\Omega_{\\text{eff}} = \\sqrt{\\Omega^2 + \\delta^2}$。"

  # ==========================================================================
  # Step 2: rabi-probability-and-ode-duality (5 题课堂 + 3 题 recall)
  # ==========================================================================
  - id: rabi-prob-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: "如果保持横向驱动幅度 $\\Omega$ 不变，逐渐把驱动频率 $\\omega$ 调得越来越偏离自旋共振频率 $\\omega_0$（使 $|\\delta| = |\\omega_0 - \\omega|$ 不断增大），拉比跃迁概率曲线 $P(t)$ 会出现哪两个同步变化？"
    options:
      - id: a
        text: "最大跃迁峰值 $\\Omega^2/(\\Omega^2+\\delta^2)$ 会变小（越来越少原子被激发），同时有效振荡频率 $\\Omega_{\\text{eff}} = \\sqrt{\\Omega^2+\\delta^2}$ 变大（振荡节奏反而变快）。"
        correct: true
        feedback: "物理图像非常清晰！有效旋转轴越来越斜向 $z$ 轴，所以转出的圆圈很小、翻不到对极点，但因为合矢量变长所以绕那条轴转得更快。"
      - id: b
        text: "最大跃迁峰值依然能达到 $1.0$，只是需要更长的脉冲时间才能到达峰值。"
        correct: false
        feedback: "只有在绝对共振 $\\delta = 0$ 时最大概率才等于 $1.0$；任何 $\\delta \\ne 0$ 都会压低幅度，且因为 $\\Omega_{\\text{eff}}$ 变大峰值出现时间反而更早。"
      - id: c
        text: "最大跃迁峰值下降到 $\\Omega^2/(\\Omega^2+\\delta^2)$，但振荡速度跟着一起放慢。"
        correct: false
        feedback: "振荡速度由 $\\Omega_{\\text{eff}} = \\sqrt{\\Omega^2+\\delta^2}$ 决定，失谐越大速度越快而非越慢。"
      - id: d
        text: "跃迁概率不再作周期振荡，而是按指数律单调衰减至零。"
        correct: false
        feedback: "只要没有退相干与衰减，常系数闭合二能级系统的跃迁概率始终做严格的正弦平方周期振荡。"
    solution: "在 $P(t) = \\frac{\\Omega^2}{\\Omega^2+\\delta^2}\\sin^2(\\frac{\\sqrt{\\Omega^2+\\delta^2}\\,t}{2})$ 中，增大 $|\\delta|$ 会降低幅度因子（抑制共振激发），同时增大有效角频率 $\\Omega_{\\text{eff}}$（加快拉比振荡频率）。"

  - id: rabi-prob-self-explain
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "在刚才的例题里，取 $\\Omega/(2\\pi)=6\\text{ MHz}$、$\\delta/(2\\pi)=8\\text{ MHz}$，我们分别用演化解 $|\\psi\\rangle = U_I|1\\rangle$ 和拉比公式都算出了 $P = 0.18$。若用《量子光学》二阶常微分方程 $\\ddot{C}_e - i\\delta\\dot{C}_e + \\frac{\\Omega^2}{4}C_e = 0$ 求解同一组参数，为什么一定会得到完全一样的概率 $0.18$？"
    options:
      - id: a
        text: "因为两条路线本质上都在求解同一个相互作用图像薛定谔方程（只是在基底系数上直接消元成微分方程，与直接写幺正矩阵指数完全等价），而且两个系统的参数映射 $\\Omega \\leftrightarrow V/\\hbar$ 与 $\\delta \\leftrightarrow \\Delta$ 严格一致。"
        correct: true
        feedback: "打通了！无论是 $2\\times 2$ 矩阵演化算符还是一阶/二阶常微分方程，求解的是同一套耦合线性微分动力学，自然得到一字不差的精确结果。"
      - id: b
        text: "因为这只是 $t = 25\\text{ ns}$ 特殊时刻下的数值巧合，其他时刻两个公式差两倍。"
        correct: false
        category: incorrect_reasoning
        feedback: "对所有时间 $t$ 和所有参数，$|\\langle 0|U_I|1\\rangle|^2$ 与 $|C_e(t)|^2$ 在解析公式上都一模一样。"
      - id: c
        text: "因为微分方程默认忽略了反向项以外的静态能级项 $\\delta$，只在失谐很大时相等。"
        correct: false
        category: misunderstood_definition
        feedback: "微分方程里的 $-i\\delta\\dot{C}_e$ 项正好完整保留了一般偏共振 $\\delta = \\omega_0 - \\omega$。"
      - id: d
        text: "因为两个模型都假设总概率 $|C_g|^2 + |C_e|^2 = 0.36$ 而不是 $1$。"
        correct: false
        category: math_error
        feedback: "总概率始终严格归一等于 $1$，$0.36$ 是该失谐下的最大上态激发峰值 $\\Omega^2/\\Omega_{\\text{eff}}^2$。"
    solution: "演化算符 $U_I = e^{-i H_I t}$ 是薛定谔方程的矩阵算符形式，而 Gerry & Knight §4.4 的耦合微分方程则是该方程在能级本征基上的分量展开；二者在任意时刻和任意失谐下严格等价。"

  - id: rabi-prob-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 3
    params:
      Om:
        min: 4
        max: 8
        step: 2
      delta:
        min: 4
        max: 8
        step: 2
    constraints:
      - "(Om == 4 and delta == 8) or (Om == 6 and delta == 8) or (Om == 8 and delta == 6) or (Om == 8 and delta == 4)"
    prompt: "已知某二能级系统初态全部处于下能级 $|1\\rangle$（即 $|g\\rangle$），外加驱动强度为 $\\Omega/(2\\pi) = {{=Om}}\\text{ MHz}$、偏共振为 $\\delta/(2\\pi) = {{=delta}}\\text{ MHz}$。随着驱动时间延长，系统跃迁至上能级 $|0\\rangle$（即 $|e\\rangle$）所能达到的最大可能概率 $P_{\\max}$（用小数表示，例如 `0.5`）是多少？"
    answer_expr: "(Om*Om) / (Om*Om + delta*delta)"
    tolerance:
      abs: 0.005
    common_wrong:
      - answer_expr: "Om / sqrt(Om*Om + delta*delta)"
        category: math_error
        feedback: "这是有效转轴在横向平面投影的振幅比 $\\Omega/\\Omega_{\\text{eff}}$，概率需要对振幅取平方！"
      - answer_expr: "(delta*delta) / (Om*Om + delta*delta)"
        category: misunderstood_definition
        feedback: "你把公式分子误取成了 $\\delta^2$；随失谐增大，跃迁峰值应该变小，分子是横向驱动平方 $\\Omega^2$。"
    hints:
      - "令拉比概率式里的 $\\sin^2(\\Omega_{\\text{eff}}t/2)$ 取最大值 $1$。"
      - "计算峰值系数 $P_{\\max} = \\Omega^2 / (\\Omega^2 + \\delta^2)$。"
    solution: "在 $P(t) = \\frac{\\Omega^2}{\\Omega^2+\\delta^2}\\sin^2(\\frac{\\Omega_{\\text{eff}} t}{2})$ 中，取正弦平方最大值 $1$ 得 $P_{\\max} = \\frac{{{=Om}}^2}{{{=Om}}^2 + {{=delta}}^2} = {{=(Om*Om)/(Om*Om+delta*delta)}}$。"

  - id: rabi-prob-spot-mistake
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "一位同学抄写课本上由 $U_I|1\\rangle$ 展开的末态公式时，漏看括号写成了：$|\\psi(t)\\rangle = (\\cos\\frac{\\theta}{2} + i\\sin\\frac{\\theta}{2})n_z|1\\rangle - i\\sin\\frac{\\theta}{2}(n_x - i n_y)|0\\rangle$。怎样一眼看出这条式子一定抄错了括号？"
    options:
      - id: a
        text: "检验完全共振 $\\delta = 0$（即 $n_z = 0$）并取 $t = 0$（$\\theta = 0$）：错式会让整个 $|1\\rangle$ 振幅乘上 $n_z = 0$ 使态矢量归零，违背归一化；实际仅 $i\\sin(\\theta/2)$ 一项乘以 $n_z$，即 $(\\cos\\frac{\\theta}{2} + i\\sin\\frac{\\theta}{2}\\, n_z)|1\\rangle$。"
        correct: true
        feedback: "检验绝妙！用 $t=0$ 或 $n_z=0$ 等特例代入立刻就能排错：$U_I(0) = \\mathbb{1}$ 不含 $n_z$，因此 $\\cos(\\theta/2)$ 绝不能被 $n_z$ 乘上去。"
      - id: b
        text: "问题出在 $|0\\rangle$ 项前面的 $n_x - i n_y$ 漏掉了外层平方，括号位置反而是对的。"
        correct: false
        category: incorrect_reasoning
        feedback: "末态波函数是量子态振幅（还不能取平方，算概率时才取模方），错误确确实实出现在第一项 $n_z$ 乘到了 $\\cos(\\theta/2)$ 上。"
      - id: c
        text: "错在第一项应该用减号而不是加号，因为 $\\sigma_z|1\\rangle = +|1\\rangle$。"
        correct: false
        category: math_error
        feedback: "计算基规定 $|1\\rangle = |m_S=-1/2\\rangle$，因此 $\\sigma_z|1\\rangle = -|1\\rangle$，与演化算符里 $-i\\sin(\\theta/2)$ 负负得正正是加号。"
      - id: d
        text: "只有把 $\\theta/2$ 改成 $\\theta$ 才能满足归一化，括号位置并没有错。"
        correct: false
        category: math_error
        feedback: "即便是改角度，只要 $\\cos$ 还乘在 $n_z$ 上，共振时 $n_z = 0$ 依然会丢掉全部 $|1\\rangle$ 成分，不可能守恒概率。"
    solution: "因 $U_I = \\cos(\\theta/2)\\mathbb{1} - i\\sin(\\theta/2)\\vec{\\boldsymbol{n}}\\cdot\\vec{\\boldsymbol{\\sigma}}$ 中单位算符 $\\mathbb{1}$ 不含 $n_z$，故末态必须是 $(\\cos\\frac{\\theta}{2} + i\\sin\\frac{\\theta}{2}\\,n_z)|1\\rangle - i\\sin\\frac{\\theta}{2}(n_x-i n_y)|0\\rangle$。"

  - id: rabi-ode-transfer
    dimension: transfer
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 3
    prompt: "依据《量子光学》§4.4 由二阶微分方程 $\\ddot{C}_e - i\\delta\\dot{C}_e + \\frac{\\Omega^2}{4}C_e = 0$ 导出半经典拉比公式时，如果把激光强度调得极微弱、使相互作用时间极短（或大失谐极限下有 $\\Omega \\ll |\\delta|$），在什么条件下它恰好退化回微扰论给不出大布居转移的行为（$P_e(t) \\ll 1$）？"
    options:
      - id: a
        text: "当驱动远弱于失谐（$\\Omega \\ll |\\delta|$）使得最大峰值因子 $\\Omega^2/(\\Omega^2+\\delta^2) \\approx \\Omega^2/\\delta^2 \\ll 1$ 时，上能级布居始终微小，正对应含时微扰论的成立区间。"
        correct: true
        feedback: "融会贯通！这也是 Gerry & Knight 第 4.4 节末尾专门指出微扰论只是拉比精确解在弱场大失谐或极短脉冲极限下的退化情形。"
      - id: b
        text: "只有在精确共振 $\\delta = 0$ 且驱动时间等于 $\\pi/\\Omega$ 时，微扰论才会退化出来。"
        correct: false
        category: incorrect_reasoning
        feedback: "$\\delta = 0$ 且 $\\Omega t = \\pi$ 产生 $100\\%$ 布居反转，恰恰彻底破坏了微扰论假定 $P_e(t) \\ll 1$ 的前提。"
      - id: c
        text: "微扰论在量子力学里永远成立，与 $\\Omega/|\\delta|$ 的比值和持续时间 $t$ 无关。"
        correct: false
        category: misunderstood_definition
        feedback: "近共振强场驱动可引起高达 $100\\%$ 的布居数来回振荡，是微扰论无法描述而必须启用 Rabi 模型的根本原因。"
      - id: d
        text: "特征根 $\\lambda_\\pm$ 必须变成纯虚数使概率随时间单调发散。"
        correct: false
        category: math_error
        feedback: "$\\Omega_{\\text{eff}} = \\sqrt{\\Omega^2 + \\delta^2} > 0$ 为实数，使 $P_e(t)$ 始终在 $[0, 1]$ 内有界振荡。"
    solution: "当 $\\Omega \\ll |\\delta|$ 时，拉比概率最大振幅被压低至 $(\\Omega/\\delta)^2 \\ll 1$（或当作用极短 $\\Omega t \\ll 1$ 时 $\\sin(\\Omega t/2) \\approx \\Omega t/2$），上态布居保持微弱，正好恢复出含时微扰论的结果。"

  - id: rabi-recall-prob-say
