  # Step 3: inversion-pulses-and-jc-quantized-rabi (5 题课堂 + 3 题 recall)
  # ==========================================================================
  - id: rabi-pulse-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: "在共振（$\\delta = 0$）条件下从基态 $|1\\rangle$（即 $|g\\rangle$）出发，分别施加 $\\pi$ 脉冲和 $\\pi/2$ 脉冲后，粒子数反转 $W = P_e - P_g$ 与布居态分别是什么？"
    options:
      - id: a
        text: "$\\pi$ 脉冲使 $W = +1$（完全翻转至上态 $|0\\rangle$）；$\\pi/2$ 脉冲使 $W = 0$（上下两态各占 $50\\%$ 布居的等权相干叠加态）。"
        correct: true
        feedback: "完全准确！$W(t) = -\\cos(\\Omega t)$：在 $\\Omega t = \\pi$ 得 $+1$，在 $\\Omega t = \\pi/2$ 得 $0$。"
      - id: b
        text: "$\\pi$ 脉冲使 $W = 0$；$\\pi/2$ 脉冲使 $W = +1$。"
        correct: false
        feedback: "搞反了两个脉冲的布居效果：$\\Omega t = \\pi$ 对应 $P_e = 1$（完全反转，$W=+1$），$\\Omega t = \\pi/2$ 才是半翻转叠加（$P_e=0.5, W=0$）。"
      - id: c
        text: "两者都会使 $W = -1$，因为脉冲结束后态自动回到基态 $|1\\rangle$。"
        correct: false
        feedback: "$W = -1$ 是初始未驱动态或完整周期 $2\\pi$ 脉冲后的结果，不是 $\\pi$ 或 $\\pi/2$ 脉冲。"
      - id: d
        text: "$\\pi/2$ 脉冲给出与外部随机噪音一样的 $50\\%$ 非相干混合态，没有确定的相对相位。"
        correct: false
        feedback: "幺正演化给出的是拥有严格固定相对相位的纯量子叠加态 $\\frac{1}{\\sqrt{2}}(|1\\rangle - i e^{-i\\varphi}|0\\rangle)$，这是后续做 Ramsey 干涉的基础。"
    solution: "由 $W(t) = 2P_e(t) - 1 = -\\cos(\\Omega t)$，取 $\\Omega t = \\pi$（$\\pi$ 脉冲）得 $W = +1$（彻底反转）；取 $\\Omega t = \\pi/2$（$\\pi/2$ 脉冲）得 $W = 0$（生成上下等权纯叠加态）。"

  - id: rabi-pulse-self-explain
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "在刚才高 $Q$ 光腔的 JC 模型例题里，为什么光腔里一颗光子也没有（零光子真空态 $|n=0\\rangle$）时，量子化拉比频率 $\\Omega(0) = 2\\lambda$ 依然不为零；而在 $n = 8$ 光子态时振荡速度刚好变成 $3$ 倍？"
    options:
      - id: a
        text: "因为原子从上态释放光子跃迁到 $|g\\rangle|n+1\\rangle$ 时，产生算符作用规律 $a^\\dagger|n\\rangle = \\sqrt{n+1}|n+1\\rangle$ 在 $n=0$ 时给出系数 $\\sqrt{0+1}=1 \\ne 0$，触发真空拉比振荡；而在 $n=8$ 时 $\\sqrt{8+1}=3$，耦合直接放大 $3$ 倍。"
        correct: true
        feedback: "透彻！半经典理论需要经典场振幅非零才能驱动跃迁，而全量子产生算符自带的 $\\sqrt{n+1}$ 在 $n=0$ 时就天然保留 $1$ 倍真空涨落耦合。"
      - id: b
        text: "因为实验者在 $n=0$ 时额外开启了一个辅助微波线圈维持 $\\Omega(0) = 2\\lambda$。"
        correct: false
        category: incorrect_reasoning
        feedback: "全量子 JC 哈密顿量没有任何额外外加经典驱动场，纯粹靠原子与单模真空场的真空涨落耦合实现自发发射再重吸收。"
      - id: c
        text: "因为真空中拉比频率永远与光子数无关，只是 $n=8$ 时把常数 $\\lambda$ 人为乘了 $3$。"
        correct: false
        category: misunderstood_definition
        feedback: "JC 耦合矩阵元严格正比于玻色子跃迁矩阵元 $\\sqrt{n+1}$，因此对 $n=8$ 自然就是 $\\sqrt{9} = 3$ 倍而非人为规定。"
      - id: d
        text: "因为粒子数算符 $a^\\dagger a$ 的本征值在真空态时等于 $+1$ 而不是 $0$。"
        correct: false
        category: math_error
        feedback: "$a^\\dagger a|n=0\\rangle = 0$，真正让矩阵元在 $n=0$ 非零的是在释放光子时使光子数升到 $|n=1\\rangle$ 的 $a^\\dagger|n=0\\rangle = \\sqrt{1}|n=1\\rangle$。"
    solution: "在 JC 模型耦合 $|e\\rangle|n\\rangle \\leftrightarrow |g\\rangle|n+1\\rangle$ 中，跃迁耦合正比于 $\\langle n+1|a^\\dagger|n\\rangle = \\sqrt{n+1}$；所以 $n=0$ 时系数 $\\sqrt{1}=1$ 产生真空拉比振荡，而 $n=8$ 时系数 $\\sqrt{9}=3$ 使速率扩大为 $3$ 倍。"

  - id: rabi-pulse-duration-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 3
    params:
      Om_mhz:
        min: 5
        max: 25
        step: 5
    prompt: "在电子自旋磁共振实验中，将驱动频率精确调谐至共振（$\\delta = 0$），且单分量驱动幅度为 $\\Omega/(2\\pi) = {{=Om_mhz}}\\text{ MHz}$。若要实现一个 $\\pi/2$ 脉冲（使反转度达到 $W = 0$），需要的最短脉冲时长 $t_{\\pi/2}$ 是多少 $\\text{ns}$？"
    answer_expr: "250 / Om_mhz"
    tolerance:
      abs: 0.1
    common_wrong:
      - answer_expr: "500 / Om_mhz"
        category: misapplied_technique
        feedback: "这是 $\\pi$ 脉冲时长 $t_\\pi = 1/(2\\cdot \\Omega/(2\\pi))$，题干要实现的不是 $\\pi$ 脉冲而是半长时长的 $\\pi/2$ 脉冲！"
      - answer_expr: "1000 / Om_mhz"
        category: math_error
        feedback: "那是转整整一圈 $2\\pi$ 所需周期 $1/(\\Omega/(2\\pi))$，$\\pi/2$ 脉冲只有全周期的四分之一。"
    hints:
      - "共振角频率 $\\Omega = 2\\pi\\times (\\Omega/2\\pi)$；满足 $\\Omega t_{\\pi/2} = \\pi/2$。"
      - "利用换算：当 $\\Omega/(2\\pi)$ 单位为 $\\text{MHz}$ 时，$t_{\\pi/2}(\\text{ns}) = \\frac{1000}{4\\times (\\Omega/2\\pi)} = \\frac{250}{{{=Om_mhz}}}$。"
    solution: "由 $\\Omega t_{\\pi/2} = \\pi/2$ 得 $t_{\\pi/2} = \\frac{1}{4(\\Omega/2\\pi)} = \\frac{1}{4\\times {{=Om_mhz}}\\text{ MHz}} = \\frac{250}{{{=Om_mhz}}}\\text{ ns} = {{=250/Om_mhz}}\\text{ ns}$。"

  - id: rabi-pulse-spot-mistake
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "设系统从激发上态 $|e\\rangle$ 出发，半经典共振粒子数反转为 $W(t) = \\cos(\\Omega t)$。某同学在推导全量子 JC 模型的单光子数态跃迁时写下：『从半经典式 $W(t) = \\cos(\\Omega t)$ 出发，把 $\\Omega$ 直接替换成 JC 耦合矩阵元 $\\lambda\\sqrt{n+1}$，所以量子化拉比振荡频率为 $\\Omega(n) = \\lambda\\sqrt{n+1}$』。哪里少算了一个因子？"
    options:
      - id: a
        text: "少了因子 $2$：因为在旋转坐标系（$\\delta=0,\\varphi=0$）中半经典有效哈密顿量是 $H_I = \\Omega S_x = \\frac{\\Omega}{2}(S^+ + S^-)$（$\\Omega$ 乘在 $S_x$ 而非 $2S_x$ 上），升降耦合矩阵元实际上为 $\\Omega/2$；所以 $\\lambda\\sqrt{n+1}$ 对应 $\\Omega(n)/2$，真正的 $\\Omega(n) = 2\\lambda\\sqrt{n+1}$。"
        correct: true
        feedback: "关键的因子 $2$ 把握得极其精准！这也解释了为什么 $P(t) = \\sin^2(\\lambda t\\sqrt{n+1}) = \\sin^2(\\Omega(n)t/2)$ 里 $W(t) = \\cos(2\\lambda t\\sqrt{n+1})$。"
      - id: b
        text: "反而多了一个 $\\sqrt{n+1}$ 因子，正确应该是 $\\Omega(n) = \\lambda n$，并在 $n=0$ 时等于零。"
        correct: false
        category: misunderstood_definition
        feedback: "耦合 $|e\\rangle|n\\rangle \\leftrightarrow |g\\rangle|n+1\\rangle$ 的矩阵元来自 $a^\\dagger|n\\rangle = \\sqrt{n+1}|n+1\\rangle$，绝不是 $n$，真空 $n=0$ 确实非零。"
      - id: c
        text: "粒子数反转 $W(t)$ 定义中的系数错了，正确式子不含余弦而是 $W(t) = \\sin(\\lambda t)$。"
        correct: false
        category: math_error
        feedback: "因为上、下态概率分别为 $\\cos^2(\\lambda t\\sqrt{n+1})$ 和 $\\sin^2(\\lambda t\\sqrt{n+1})$，作差正是由二倍角公式得出 $\\cos(2\\lambda t\\sqrt{n+1})$。"
      - id: d
        text: "式子完全正确，半经典和全量子里耦合系数前都恰好只相差 $1$ 倍。"
        correct: false
        category: incorrect_reasoning
        feedback: "代回 $n=0$ 从上态演化得 $P_f = \\sin^2(\\lambda t)$，对照半经典 $P = \\sin^2(\\Omega t/2)$ 显然必须有 $\\Omega(0) = 2\\lambda$。"
    solution: "在 JC 模型中有 $P_f(t) = \\sin^2(\\lambda t\\sqrt{n+1})$，令其与半经典共振跃迁式 $\\sin^2(\\Omega t/2)$ 一致，立刻可读出 $\\Omega(n)/2 = \\lambda\\sqrt{n+1}$，即 $\\Omega(n) = 2\\lambda\\sqrt{n+1}$。"

  - id: rabi-jc-vacuum-transfer
    dimension: transfer
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 3
    prompt: "（Gerry & Knight §4.5 深度迁移）在实验上，若我们不是向高 $Q$ 光腔注入确定的光子数态 $|n\\rangle$，而是注入近似经典激光的相干态（光子分布服从泊松分布、均值 $\\bar{n} > 0$），则粒子数反转是各个 $|n\\rangle$ 成分 $\\cos(2\\lambda t\\sqrt{n+1})$ 按泊松权重的加权和。与单一定态 $|n\\rangle$ 或半经典驱动相比，这会导致什么独特现象？"
    options:
      - id: a
        text: "因为不同光子数 $n$ 对应的拉比频率 $2\\lambda\\sqrt{n+1}$ 彼此不等，各分量的余弦先是因相位散开而出现表观消逝（塌缩 collapse），经过一段静默后由于离散平方根分量重新局部同相而再现复苏（revival），彻底揭示了光的量子离散性。"
        correct: true
        feedback: "漂亮的跨源深度迁移！这正是 Gerry & Knight §4.5 说明半经典常幅激光无法解释、只有光量子化的离散 $\\sqrt{n+1}$ 频谱才能产生的量子塌缩与复苏（collapse and revival）。"
      - id: b
        text: "因为相干态是最接近经典场的量子态，所以它的反转度与半经典公式 $W(t)=\\cos(\\Omega t)$ 一样永远保持等幅纯正弦振荡，绝不会衰减或复苏。"
        correct: false
        category: incorrect_reasoning
        feedback: "这正是 Gerry & Knight 在 95–96 页专门驳斥的常见直觉误区：即便最经典的量子相干态，因为光子数离散分布也会出现半经典模型完全没有的塌缩与复苏。"
      - id: c
        text: "只要注入相干态，粒子数反转就会在所有时刻恒定等于 $W(t) = +1$ 不发生振荡。"
        correct: false
        category: misunderstood_definition
        feedback: "相干态是各种 $n$ 的叠加，每个 $n$ 成分都会拉比振荡，叠加后才体现出波形的调制、塌缩与复苏。"
      - id: d
        text: "相干态因为粒子数 $\\bar{n}$ 不稳定，会使真空态 $n=0$ 分量失去耦合而不参与演化。"
        correct: false
        category: incorrect_reasoning
        feedback: "任何包含 $n=0$ 权重的成分照样按 $\\cos(2\\lambda t\\sqrt{1})$ 独立参与叠加。"
    solution: "在全量子 JC 模型下，相干态下反转度是各非谐频率 $\\Omega(n) = 2\\lambda\\sqrt{n+1}$ 的离散权重叠加：初期不同频率相干消散导致拉比振荡“塌缩（collapse）”，长时后离散相位重聚导致“复苏（revival）”，这是光场离散量子化的直接证据。"

  - id: rabi-recall-pulse-say
    dimension: conceptual
    type: explain
    role: recall
    knowledge_point: inversion-pulses-and-jc-quantized-rabi
    difficulty: 1
    est_minutes: 1
    prompt: "用一两句话说明：什么是粒子数反转 $W(t)$、共振下 $\\pi$ 与 $\\pi/2$ 脉冲分别实现什么效果，以及为什么全量子 JC 模型在 $n=0$ 时仍有拉比振荡？"
    rubric:
      - id: r1
        criterion: "写出 $W(t) = P_e(t) - P_g(t) = 2P(t) - 1$，指出共振下 $\\pi$ 脉冲（$\\Omega t=\\pi$）使 $W=+1$ 完全反转，$\\pi/2$ 脉冲（$\\Omega t=\\pi/2$）使 $W=0$ 形成等权叠加态。"
        weight: 1
        required: true
      - id: r2
        criterion: "说明全量子 JC 模型中耦合频率为 $\\Omega(n) = 2\\lambda\\sqrt{n+1}$，因产生算符因子 $\\sqrt{n+1}$ 在 $n=0$ 时非零而引发纯量子的真空拉比振荡。"
        weight: 1
        required: true
    exemplar: "粒子数反转 $W(t)=P_e-P_g=2P-1$，在共振（$\\delta=0$）时 $\\pi$ 脉冲（$t=\\pi/\\Omega$）实现 $W=+1$ 的完全布居反转，$\\pi/2$ 脉冲（$t=\\pi/(2\\Omega)$）实现 $W=0$ 的等权相干叠加。而在全量子 JC 模型中，耦合强弱由 $\\Omega(n) = 2\\lambda\\sqrt{n+1}$ 决定，故即便在 $n=0$ 真空态也存在 $\\Omega(0)=2\\lambda$ 的真空拉比振荡。"

  - id: rabi-recall-pulse-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: inversion-pulses-and-jc-quantized-rabi
    difficulty: 1
    est_minutes: 0.5
    prompt: "假设共振驱动下的电子自旋原本全部处于基态 $|1\\rangle$，若施加一个精确的 $\\pi/2$ 脉冲，紧接测得它的粒子数反转 $W$ 等于多少？"
    options:
      - id: a
        text: "$0$（上下能级布居概率同为 $0.5$）"
        correct: true
        feedback: "正确。$W = P_e - P_g = 0.5 - 0.5 = 0$，这也是构造等权相干叠加态的标志脉冲。"
      - id: b
        text: "$+1$（全部被激发到了上态 $|0\\rangle$）"
        correct: false
        feedback: "$W = +1$ 是 $\\pi$ 脉冲的结果，需要 $\\pi/2$ 脉冲两倍的时间。"
      - id: c
        text: "$-1$（仍然全部留在基态 $|1\\rangle$）"
        correct: false
        feedback: "$W = -1$ 对应未演化（$t=0$）或整周期回到下态的 $2\\pi$ 脉冲。"
      - id: d
        text: "$+0.5$（因为旋转角度 $\\theta=\\pi/2$ 刚好是一半的反转）"
        correct: false
        feedback: "当 $P_e = 0.5$ 时，$P_g = 1 - 0.5 = 0.5$，因此相减 $W = 0.5 - 0.5 = 0$ 而非 $0.5$。"
    solution: "对初态 $|1\\rangle$ 施加共振 $\\pi/2$ 脉冲（$\\Omega t = \\pi/2$）得 $P_e = \\sin^2(\\pi/4) = 0.5$，故 $W = 2(0.5) - 1 = 0$。"

  - id: rabi-recall-pulse-formula
    dimension: math
    type: expression
    role: recall
    knowledge_point: inversion-pulses-and-jc-quantized-rabi
    difficulty: 1
    est_minutes: 0.5
    prompt: "写出全量子 Jaynes–Cummings 模型中原子处于激发态 $|e\\rangle$、腔内初始有 $n$ 个光子（耦合通道 $|e\\rangle|n\\rangle \\leftrightarrow |g\\rangle|n+1\\rangle$，共振 $\\delta = 0$）时的量子化拉比频率 $\\Omega(n)$ 公式（用 `lam` 表示耦合常数 $\\lambda$，`n` 表示光子数，平方根写成 `sqrt(...)`）。"
    answer: "2 * lam * sqrt(n + 1)"
    variables:
      lam: [1, 10]
      n: [0, 20]
    solution: "由耦合矩阵元 $\\lambda\\sqrt{n+1}$ 与共振跃迁概率 $\\sin^2(\\Omega(n)t/2) = \\sin^2(\\lambda t\\sqrt{n+1})$ 对比，得 $\\Omega(n) = 2\\lambda\\sqrt{n+1}$。"

