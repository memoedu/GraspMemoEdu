  - id: rabi-final-explain
    dimension: conceptual
    type: explain
    role: core
    difficulty: 2
    est_minutes: 4
    prompt: "请用自己的话系统回答三个核心问题：（1）如何把常系数 $H_I$ 写成有效转轴并利用 $\\vec{\\boldsymbol{\\sigma}}=2\\vec{\\boldsymbol{S}}$ 得到 $SU(2)$ 演化算符 $U_I$？（2）《磁共振基础》的演化算符法与《量子光学》的耦合概率幅方程如何共同导出拉比跃迁概率公式，失谐 $\\delta$ 对曲线有哪些影响？（3）什么是粒子数反转 $W(t)$、共振 $\\pi$ / $(\\pi/2)$ 脉冲，以及它怎样过渡到全量子 JC 模型的量子化拉比频率？"
    rubric:
      - id: r1
        criterion: "说明定义 $\\delta=\\omega_0-\\omega$ 与 $\\Omega_{\\text{eff}}=\\sqrt{\\Omega^2+\\delta^2}$ 将 $H_I$ 化为 $\\Omega_{\\text{eff}}\\vec{\\boldsymbol{n}}\\cdot\\vec{\\boldsymbol{S}}$，并用 $\\vec{\\boldsymbol{\\sigma}}=2\\vec{\\boldsymbol{S}}$ 与 $\\theta=\\Omega_{\\text{eff}}t$ 得出 $U_I=\\cos(\\theta/2)\\mathbb{1}-i\\sin(\\theta/2)\\vec{\\boldsymbol{n}}\\cdot\\vec{\\boldsymbol{\\sigma}}$。"
        weight: 1
        required: true
      - id: r2
        criterion: "指出从 $U_I|1\\rangle$（括号在 $\\sin(\\theta/2)\\,n_z$ 内）与二阶概率幅方程均可得到 $P(t)=\\frac{\\Omega^2}{\\Omega^2+\\delta^2}\\sin^2(\\frac{\\Omega_{\\text{eff}}t}{2})$，并说明 $|\\delta|$ 增大会压低激发峰值同时加快有效振荡频率。"
        weight: 1
        required: true
      - id: r3
        criterion: "说明粒子数反转 $W(t)=P_e-P_g=2P-1$，共振时 $\\pi$ 脉冲完成全反转（$W=+1$）、$\\pi/2$ 脉冲制备等权叠加态（$W=0$），且在全量子 JC 模型中拉比频率量子化为 $\\Omega(n)=2\\lambda\\sqrt{n+1}$，带来 $n=0$ 真空拉比振荡。"
        weight: 1
        required: true
      - id: r4
        criterion: "补充指出相干态由于各离散 $n$ 分量拥有不同的 $\\sqrt{n+1}$ 频率而产生“塌缩与复苏”现象。"
        weight: 1
        required: false
    exemplar: "首先定义失谐 $\\delta = \\omega_0 - \\omega$ 与有效拉比频率 $\\Omega_{\\text{eff}} = \\sqrt{\\Omega^2+\\delta^2}$，把旋转系哈密顿量合成为 $H_I = \\Omega_{\\text{eff}}\\vec{\\boldsymbol{n}}\\cdot\\vec{\\boldsymbol{S}}$；利用泡利矢量 $\\vec{\\boldsymbol{\\sigma}} = 2\\vec{\\boldsymbol{S}}$ 与转角 $\\theta = \\Omega_{\\text{eff}}t$ 展开矩阵指数，得 $U_I = \\cos(\\theta/2)\\mathbb{1} - i\\sin(\\theta/2)\\vec{\\boldsymbol{n}}\\cdot\\vec{\\boldsymbol{\\sigma}}$。从 $U_I|1\\rangle$ 的 $|0\\rangle$ 分量模方出发（注意 $n_z$ 仅乘于 $\\sin(\\theta/2)$ 项），与《量子光学》对耦合概率幅方程 $\\ddot{C}_e - i\\delta\\dot{C}_e + \\frac{\\Omega^2}{4}C_e=0$ 求解完全等价，都得到 $P(t) = \\frac{\\Omega^2}{\\Omega^2+\\delta^2}\\sin^2(\\frac{\\Omega_{\\text{eff}}t}{2})$：偏共振 $|\\delta|$ 越大则最大跃迁幅度越低而有效振荡越快。最后，粒子数反转 $W(t)=2P-1$ 在共振 $\\pi$ 脉冲处达 $+1$ 完成全反转、$\\pi/2$ 脉冲处等于 $0$ 制备相干叠加；而在全量子 Jaynes–Cummings 模型中耦合变为 $\\Omega(n) = 2\\lambda\\sqrt{n+1}$，不仅在 $n=0$ 产生纯量子的真空拉比振荡，在相干光下还会表现出塌缩与复苏。"
