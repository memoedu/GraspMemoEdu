    rubric:
      - id: r1
        criterion: "写出 $P(t) = \\frac{\\Omega^2}{\\Omega^2+\\delta^2}\\sin^2\\left(\\frac{\\sqrt{\\Omega^2+\\delta^2}\\,t}{2}\\right)$，说明两种方法给出同一公式。"
        weight: 1
        required: true
      - id: r2
        criterion: "指出 $|\\delta|$ 增大既压低了跃迁最大概率，又提高了有效拉比振荡频率 $\\Omega_{\\text{eff}}$。"
        weight: 1
        required: true
    exemplar: "由 $U_I|1\\rangle$ 取 $|0\\rangle$ 振幅模方，与《量子光学》求解 $\\ddot{C}_e - i\\delta\\dot{C}_e + \\frac{\\Omega^2}{4}C_e = 0$ 一致，均给出 $P(t) = \\frac{\\Omega^2}{\\Omega^2+\\delta^2}\\sin^2\\left(\\frac{\\sqrt{\\Omega^2+\\delta^2}\\,t}{2}\\right)$。失谐 $|\\delta|$ 越大会让跃迁最大峰值越低，但振荡有效频率 $\\sqrt{\\Omega^2+\\delta^2}$ 反而越快。"

  - id: rabi-recall-prob-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: rabi-probability-and-ode-duality
    difficulty: 1
    est_minutes: 0.5
    prompt: "从下能级 $|1\\rangle$ 出发经 $U_I$ 演化后，下面哪个选项是修正括号错误后的严格表达式？"
    options:
      - id: a
        text: "$|\\psi\\rangle = (\\cos\\frac{\\theta}{2} + i\\sin\\frac{\\theta}{2}\\, n_z)|1\\rangle + (-i\\sin\\frac{\\theta}{2})(n_x - i n_y)|0\\rangle$"
        correct: true
        feedback: "正确。单位算符 $\\mathbb{1}$ 不乘 $n_z$，因此 $n_z$ 只附在 $\\sin(\\theta/2)$ 之后。"
      - id: b
        text: "$|\\psi\\rangle = (\\cos\\frac{\\theta}{2} + i\\sin\\frac{\\theta}{2})n_z|1\\rangle + (-i\\sin\\frac{\\theta}{2})(n_x - i n_y)|0\\rangle$"
        correct: false
        feedback: "这是讲义排版误括后的错式，会在共振 $n_z = 0$ 时错误丢掉 $|1\\rangle$ 分量。"
      - id: c
        text: "$|\\psi\\rangle = \\cos\\frac{\\theta}{2}|1\\rangle - i\\sin\\frac{\\theta}{2}\\,n_z|0\\rangle$"
        correct: false
        feedback: "$\\sigma_z|1\\rangle = -|1\\rangle$ 留在 $|1\\rangle$ 态上，而翻到 $|0\\rangle$ 的是横向分量 $n_x - i n_y$。"
      - id: d
        text: "$|\\psi\\rangle = \\cos\\theta|1\\rangle - i\\sin\\theta(n_x + i n_y)|0\\rangle$"
        correct: false
        feedback: "自旋 $1/2$ 的演化角是半角 $\\theta/2$，且丢失了 $|1\\rangle$ 中的纵向相位因子与对角 $n_z$。"
    solution: "因 $\\mathbb{1}|1\\rangle = |1\\rangle$ 且 $(\\vec{\\boldsymbol{n}}\\cdot\\vec{\\boldsymbol{\\sigma}})|1\\rangle = -n_z|1\\rangle + (n_x - i n_y)|0\\rangle$，正确末态为 $(\\cos\\frac{\\theta}{2} + i\\sin\\frac{\\theta}{2}\\, n_z)|1\\rangle + (-i\\sin\\frac{\\theta}{2})(n_x - i n_y)|0\\rangle$。"

  - id: rabi-recall-prob-formula
