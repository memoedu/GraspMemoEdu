  - id: bs-final-explain
    dimension: conceptual
    type: explain
    role: core
    difficulty: 3
    est_minutes: 5
    prompt: "请系统梳理一般横向非共振项与 Bloch-Siegert 平移的完整图景：（1）如何用两次旋转系变换和一次自旋量化轴倾斜处理非共振横向项，为什么既能舍去快变纵向项、改回 $S_{x,y,z}$ 表象符号，却要保留斜边能隙拉伸？（2）如何导出普适公式 $\\Delta_{\\text{BS}}$、反旋项极限以及旋波近似的定量边界？（3）能级排斥的符号律是什么，它如何与量子光学色散 AC Stark 频移及多音寄生驱动误差统一起来？"
    rubric:
      - id: r1
        criterion: "说明先用 $U_i'=e^{-i(\\omega' t+\\varphi')S_z}$ 定格非共振项并绕 $y$ 轴微倾 $\\theta$ 对角化静态块为 $\\operatorname{sgn}(\\omega_0-\\omega')\\sqrt{(\\omega_0-\\omega')^2+\\Omega'^2}\\,S_z'$；说明因快变纵向项零均值抖动相角极微（$\\ll 1$）、$(S'_x,S'_y,S'_z)$ 与 $(S_x,S_y,S_z)$ 幺正等价且态重叠偏差 $\\sin^2(\\theta/2)\\ll 1$、$\\cos^2(\\theta/2)\\approx 1$，可沿用 $S_{x,y,z}$ 表象而保留静态线性累加的斜边能隙拉伸。"
        weight: 1
        required: true
      - id: r2
        criterion: "说明作第二重变换 $U_i''=e^{-i[(\\omega-\\omega')t-\\varphi']S_z}$ 消去时间与 $-\\varphi'$ 偏置，二阶展开导出 $\\Delta_{\\text{BS}} = \\frac{\\Omega'^2}{2(\\omega_0-\\omega')}$；代入反旋项 $\\omega'=-\\omega$ 得 $\\Delta_{\\text{BS}} \\approx \\frac{\\Omega^2}{4\\omega_0}$ 及 RWA 边界 $\\frac{\\Omega}{4\\omega_0}\\ll 1$。"
        weight: 1
        required: true
      - id: r3
        criterion: "阐明能级排斥符号律（红失谐 $\\omega'<\\omega_0$ 蓝移、蓝失谐 $\\omega'>\\omega_0$ 红移），并通过 $\\Omega'=2\\lambda\\sqrt{n}$ 精确对接色散 JC 的受激 AC Stark 频移 $2n\\frac{\\lambda^2}{\\omega_0-\\omega_c}$ 及多音寄生串扰。"
        weight: 1
        required: true
      - id: r4
        criterion: "补充点出教材在式 (1.19)、(1.20) 与式 (1.23) 中的关键勘误修正，或分析全量子模型在 $n=0$ 时多出的真空频移。"
        weight: 1
        required: false
    exemplar: "（1）加入远失谐横向驱动 $\\Omega'$ 后，先作 $U_i'=e^{-i(\\omega' t+\\varphi')S_z}$ 定格非共振驱动，再绕 $y$ 轴微倾角 $\\theta$（$\\cos\\theta=|\\omega_0-\\omega'|/\\sqrt{(\\omega_0-\\omega')^2+\\Omega'^2}$）对角化静态块 ③ 为 $\\operatorname{sgn}(\\omega_0-\\omega')\\sqrt{(\\omega_0-\\omega')^2+\\Omega'^2}\\,S_z'$。在 $|\\Omega'|\\ll|\\omega_0-\\omega'|$ 时，高频振荡的 $S_z'$ 纵向项平均为零（相角上限 $\\frac{\\Omega\\sin\\theta}{|\\omega-\\omega'|}\\ll 1$），连同 $\\sin^2(\\theta/2)$ 反向项一并舍去；又因 $(S'_x,S'_y,S'_z)$ 与 $(S_x,S_y,S_z)$ 满足严格幺正等价的自旋 $1/2$ 代数、态基重叠偏差 $\\sin^2(\\theta/2)\\sim 10^{-6}\\text{--}10^{-4}$ 且 $\\cos^2(\\theta/2)\\approx 1$，可继续在 $S_{x,y,z}$ 表象写作等效哈密顿量，而把静态累加的斜边能隙拉伸完整保留。（2）再作第二重变换 $U_i''=e^{-i[(\\omega-\\omega')t-\\varphi']S_z}$ 抵消时间依赖与 $-\\varphi'$ 相位偏移，斜边二阶展开即得 $\\Delta_{\\text{BS}} = \\frac{\\Omega'^2}{2(\\omega_0-\\omega')}$；对反旋项 $\\Omega'=\\Omega,\\omega'=-\\omega$ 得 $\\frac{\\Omega^2}{2(\\omega_0+\\omega)}\\approx\\frac{\\Omega^2}{4\\omega_0}$，从而给出 RWA 定量判据 $\\frac{\\Delta_{\\text{BS}}}{\\Omega}\\approx\\frac{\\Omega}{4\\omega_0}\\ll 1$（长脉冲另须 $|\\Delta_{\\text{BS}}|t_{\\text{p}}\\ll 1$）。（3）公式分母 $\\omega_0-\\omega'$ 统一了能级排斥符号律：红失谐（含反旋项）蓝移、蓝失谐红移；在色散 JC 有效哈密顿量 $\\hat{H}_{\\text{eff}} = \\Delta_{\\text{disp}}(|e\\rangle\\langle e|+2\\hat{a}^\\dagger\\hat{a}S_z)$（$\\Delta_{\\text{disp}}=\\frac{\\lambda^2}{\\omega_0-\\omega_c}$）中，取 $\\Omega'=2\\lambda\\sqrt{n}$ 后受激 AC Stark 频移与 $\\Delta_{\\text{BS}}$ 完全重合（全量子模型在 $n=0$ 时另给出真空频移 $\\Delta_{\\text{disp}}$），该规律同样解释了多音旁支微波引起的串扰移峰误差。"
