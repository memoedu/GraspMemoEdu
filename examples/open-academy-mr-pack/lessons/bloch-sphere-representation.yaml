objective: |
  **Goal:** 能够把任意单比特纯态与统计混态的密度矩阵统一表示为 Bloch 矢量 $\rho = \frac{\mathbb{1}+\vec{\boldsymbol{n}}\cdot\vec{\boldsymbol{\sigma}}}{2}$（$|\vec{\boldsymbol{n}}|\le 1$），利用 $\vec{\boldsymbol{n}}=\operatorname{Tr}(\rho\vec{\boldsymbol{\sigma}})$、纯度 $\operatorname{Tr}(\rho^2)=\frac{1+|\vec{\boldsymbol{n}}|^2}{2}$ 与本征值判定纯混程度，并证明幺正门 $U = e^{-i\theta\vec{\boldsymbol{n}}\cdot\vec{\boldsymbol{S}}}$ 等价于 Bloch 矢量的三维旋转 $R_{\vec{\boldsymbol{n}}\cdot\theta}$。
recap:
  - concept: su2-evolution-and-rabi-prob
    text: "引入偏共振 $\\delta$、有效频率 $\\Omega_{\\text{eff}}$ 与泡利矢量 $\\vec{\\boldsymbol{\\sigma}} = 2\\vec{\\boldsymbol{S}}$ 后，演化算符写作 $U_I = \\cos(\\theta/2)\\mathbb{1} - i\\sin(\\theta/2)\\vec{\\boldsymbol{n}}\\cdot\\vec{\\boldsymbol{\\sigma}}$，共振 $\\pi/2$ 脉冲把 $|1\\rangle$ 映为 $\\frac{1}{\\sqrt{2}}(|1\\rangle - i e^{-i\\varphi}|0\\rangle)$。"
  - concept: single-qubit-gates
    text: "（选修背景）调节驱动幅值、失谐与相位构造各类单比特门脉冲时，其幺正演化均统一写为绕轴的 $SU(2)$ 旋转 $U = e^{-i\\theta\\vec{\\boldsymbol{n}}\\cdot\\vec{\\boldsymbol{S}}}$。"
where_this_fits: |
  ### 从抽象复数态矢到三维几何直观

  在前几课中，我们一直用复数概率幅 $c_0|0\rangle + c_1|1\rangle$ 和 $2\times 2$ 矩阵 $U = e^{-i\theta\vec{\boldsymbol{n}}\cdot\vec{\boldsymbol{S}}}$ 追踪自旋动力学。然而这套态矢描述有两个短板：第一，物理上不可观测的整体相位会反复干扰直觉；第二，真实系综或受环境扰动的子系统往往处于统计混合态，根本无法写成单一态矢 $|\psi\rangle$。

  本课引入密度矩阵 $\rho$ 与 Bloch 球表象：既消除了冗余的整体相位、把纯态与混态统一装进三维单位球，又借助旋转坐标系推导中用过的三维旋转公式，把任意单比特门化作直观的绕轴旋转！
knowledge_points:
  - id: bloch-pure-state-mapping
    title: "建立单比特纯态与 Bloch 球面的几何映射"
    tldr: |
      - 任意单比特纯态 $|\psi\rangle = \cos(\theta/2)|0\rangle + \sin(\theta/2)e^{i\varphi}|1\rangle$ 对应单位 Bloch 矢量 $\vec{\boldsymbol{n}} = (\sin\theta\cos\varphi, \sin\theta\sin\varphi, \cos\theta)$（$|\vec{\boldsymbol{n}}|=1$）。
      - 密度矩阵 $\rho = |\psi\rangle\langle\psi| = \frac{\mathbb{1} + \vec{\boldsymbol{n}}\cdot\vec{\boldsymbol{\sigma}}}{2}$ 自动消去整体相位，其非对角元 $\rho_{01}$ 为 $\frac{1}{2}(n_x - i n_y)$，匹配 $\sigma_y = \begin{pmatrix}0&-i\\i&0\end{pmatrix}$。
      - Bloch 球上的对跖点 $+\vec{\boldsymbol{n}}$ 与 $-\vec{\boldsymbol{n}}$ 对应相互正交的纯态。
    explain: |
      ### 消去整体相位：从纯态态矢到投影密度矩阵

      取计算基 $|0\rangle = |m_S=+1/2\rangle = (1,0)^T$ 与 $|1\rangle = |m_S=-1/2\rangle = (0,1)^T$，任意归一化单比特纯态（相差整体相位视为同一物理态）均可按式 (1.34) 参数化为：
      $$|\psi\rangle = \cos\left(\frac{\theta}{2}\right)|0\rangle + \sin\left(\frac{\theta}{2}\right)e^{i\varphi}|1\rangle,\qquad \theta\in[0,\pi],\;\varphi\in[0,2\pi)$$
      在 Gerry–Knight《Introductory Quantum Optics》附录 A 式 (A26) 中，作者采用对称相位写法 $|\Psi\rangle = \cos(\frac{\theta}{2})e^{-i\varphi/2}|0\rangle + \sin(\frac{\theta}{2})e^{i\varphi/2}|1\rangle = e^{-i\varphi/2}|\psi\rangle$。只要构造**密度矩阵（投影算符）** $\rho = |\psi\rangle\langle\psi|$，整体相位因子便因 $e^{-i\varphi/2}e^{+i\varphi/2} = 1$ 而彻底消去，两种写法给出完全相同的 $\rho$！

      ### 展开密度矩阵与矩阵元符号核对

      由 $\vec{\boldsymbol{\sigma}} = 2\vec{\boldsymbol{S}}$ 可知泡利矩阵为 $\sigma_x = \begin{pmatrix}0&1\\1&0\end{pmatrix}$、$\sigma_y = \begin{pmatrix}0&-i\\i&0\end{pmatrix}$、$\sigma_z = \begin{pmatrix}1&0\\0&-1\end{pmatrix}$。利用 $|0\rangle\langle 0| = \frac{\mathbb{1}+\sigma_z}{2}$、$|1\rangle\langle 1| = \frac{\mathbb{1}-\sigma_z}{2}$ 以及 $e^{-i\varphi}|0\rangle\langle 1| + e^{i\varphi}|1\rangle\langle 0| = \cos\varphi\,\sigma_x + \sin\varphi\,\sigma_y$，结合倍角公式即可导出式 (1.35)：
      $$\rho = |\psi\rangle\langle\psi| = \frac{\mathbb{1} + \vec{\boldsymbol{n}}\cdot\vec{\boldsymbol{\sigma}}}{2} = \frac{1}{2}\begin{pmatrix} 1+n_z & n_x - i n_y \\ n_x + i n_y & 1-n_z \end{pmatrix}$$
      其中**单位 Bloch 矢量** $\vec{\boldsymbol{n}} = (\sin\theta\cos\varphi,\; \sin\theta\sin\varphi,\; \cos\theta)$ 满足 $|\vec{\boldsymbol{n}}|=1$，所有纯态恰好铺满单位球面。特别警示：Gerry–Knight 附录 A 式 (A25) 虽在式 (A24) 取标准 $\sigma_2 = \sigma_y = \begin{pmatrix}0&-i\\i&0\end{pmatrix}$，却误把矩阵右上角与左下角的 $\pm i s_2$ 符号写反；请务必以匹配的 $\rho_{01} = \frac{1}{2}(n_x - i n_y)$ 与 $\rho_{10} = \frac{1}{2}(n_x + i n_y)$ 为准！

