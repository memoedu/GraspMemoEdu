summary: |
  - **纯态球面映射**：纯态 $|\psi\rangle = \cos(\theta/2)|0\rangle + \sin(\theta/2)e^{i\varphi}|1\rangle$ 对应的密度矩阵为 $\rho = \frac{\mathbb{1} + \vec{\boldsymbol{n}}\cdot\vec{\boldsymbol{\sigma}}}{2} = \frac{1}{2}\begin{pmatrix}1+n_z & n_x-in_y\\ n_x+in_y & 1-n_z\end{pmatrix}$（$|\vec{\boldsymbol{n}}|=1$），自动消除整体相位，且对跖点 $\pm\vec{\boldsymbol{n}}$ 正交。
  - **混态、迹反演与纯度判据**：统计混态给出 $|\vec{\boldsymbol{n}}|<1$ 的球内矢量，修正式 (1.36) 投影写法与式 (1.38) 无多余 `/2` 后可得 $\vec{\boldsymbol{n}} = \operatorname{Tr}(\rho\vec{\boldsymbol{\sigma}})$；纯度 $\operatorname{Tr}(\rho^2) = \frac{1+|\vec{\boldsymbol{n}}|^2}{2}$ 与本征值 $\frac{1\pm|\vec{\boldsymbol{n}}|}{2}$ 严格区分纯态与混态。
  - **单比特门的三维旋转同构**：幺正演化 $\rho_f = U\rho_0 U^\dagger$（$U = e^{-i\theta\vec{\boldsymbol{n}}\cdot\vec{\boldsymbol{S}}}$）严格同构于 Bloch 矢量绕 $\vec{\boldsymbol{n}}$ 的右手旋转 $\vec{\boldsymbol{n}}_f = R_{\vec{\boldsymbol{n}}\cdot\theta}(\vec{\boldsymbol{n}}_0)$。
  **Next:** 建立 Bloch 球几何图景后，下一课将回头剖析旋波近似中曾舍去的反向旋转分量如何在强驱动或近共振条件下引发二阶共振频移，从而定量界定旋波近似的成立边界。
