summary: |
  - **共振赤道 $X/Y$ 门**：$\delta=0$ 时有效转轴落在赤道面 $\vec{\boldsymbol{n}} = (\cos\beta, \sin\beta, 0)$，脉冲 $(\pi/2)_\beta$ 与 $(\pi)_\beta$ 由相位 $\beta$ 切换 $x$、$y$ 轴旋转；原讲义 $\beta=0$ 的 $(\pi)_x = -i\sigma_x$ 误印为 $(\pi)_\pi$ 须予以纠正。
  - **失谐 $z$ 门与倾斜 Hadamard 门**：纯失谐自由演化（$\Omega=0, \theta=\delta t$）给出对角相移门 $T$、$S$ 与 $Z_{\text{MR}}$；令 $\Omega=\delta$、$\beta=0$ 并在 $\theta=\sqrt{2}\Omega t = \pi$ 截断即得 $H_{\text{MR}} = -i(\sigma_x+\sigma_z)/\sqrt{2}$。
  - **$SU(2)$ 全局相位与四门电路**：物理脉冲门恒满足 $\det(U) = +1 \in SU(2)$，与计算 $U(2)$ 门（如 $\hat{U}_{\text{H}}$、$\hat{U}_{\text{PG}}$）仅差不可观测的全局相位；通过 $\hat{U}_{\text{PG}}(\varphi+\pi/2)\hat{U}_{\text{H}}\hat{U}_{\text{PG}}(2\theta)\hat{U}_{\text{H}}|0\rangle$ 可合成任意单比特叠加态。
  **Next:** 下一课「态与门的 Bloch 球表示」将把本课构造的单比特叠加态与 $SU(2)$ 量子门映射为三维单位球面上的几何矢量与空间旋转操作，建立起完整的几何直观。
