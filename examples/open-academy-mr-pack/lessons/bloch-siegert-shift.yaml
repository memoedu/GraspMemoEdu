objective: |
  **Goal:** 能够通过一重旋转系变换与自旋量化轴倾斜处理远失谐横向驱动项（含旋波近似舍去的反向旋转项），再利用二次旋转系导出二阶频移 $\Delta_{\text{BS}} = \Omega'^2/[2(\omega_0 - \omega')]$，定量界定旋波近似的失效条件，并将其统一到能级排斥规律与量子光学色散 AC Stark 频移。
recap:
  - concept: rotating-wave-and-frame
    text: "旋波近似舍去角动量不守恒的反向旋转项后，经 $U_i = e^{-i\\omega t S_z}$ 得 $H_I = (\\omega_0 - \\omega)S_z + \\Omega[\\cos(\\varphi)S_x + \\sin(\\varphi)S_y]$；当强驱动使 $\\Omega$ 可比拟 $\\omega_0$ 时，反向项将引起共振频移。"
where_this_fits: |
  ### 保留非共振横向项后会发生什么？

  上一课在弱驱动假设下丢弃了反向旋转项 ①；但若驱动很强，或存在远失谐寄生微波，非共振横向项便不能平均为零，而是会悄悄移动真实共振频率。

  本课通过**两次相互作用图像变换**与**自旋轴倾斜**严格导出二阶 **Bloch-Siegert 平移** $\Delta_{\text{BS}}$，界定旋波近似的定量边界，并与量子光学色散 AC Stark 频移统一。
knowledge_points:
  - id: bs-first-frame-and-axis-tilt
    title: "一重旋转系变换与自旋轴倾斜"
    tldr: |
      - 把远失谐横向驱动 $\Omega'[\cos(\omega' t+\varphi')S_x+\sin(\omega' t+\varphi')S_y]$ 并入哈密顿量（反旋项 ① 对应 $\Omega'=\Omega,\omega'=-\omega,\varphi'=-\varphi$）。
      - 作第一重变换 $U_i' = e^{-i(\omega' t+\varphi')S_z}$ 定格非共振项，得静态块 ③ $= (\omega_0-\omega')S_z + \Omega' S_x$。
      - 绕 $y$ 轴微倾 $\theta$ 对角化 ③（含教材两处勘误），并利用快变平均与 $\cos^2(\theta/2)\approx 1$ 化简主驱动。
    explain: |
      ### 纳入一般非共振横向驱动

      保留主驱动（幅值 $\Omega$、频率 $\omega$、初相位 $\varphi$）的同时，再加入一路任意远失谐横向驱动（参数 $\Omega'$、$\omega'$、$\varphi'$）：
      $$H = \omega_0 S_z + \Omega\left[\cos(\omega t + \varphi)S_x + \sin(\omega t + \varphi)S_y\right] + \Omega'\left[\cos(\omega' t + \varphi')S_x + \sin(\omega' t + \varphi')S_y\right]$$
      若取 $\Omega' = \Omega$、$\omega' = -\omega$、$\varphi' = -\varphi$，第三项就正好还原上一课忽略的反向旋转项 ①（因为 $\cos(-\omega t-\varphi)=\cos(\omega t+\varphi)$ 而 $\sin(-\omega t-\varphi)=-\sin(\omega t+\varphi)$）。

      ### 第一重变换与量化轴倾斜

      为先定格 $\Omega'$ 项，作第一重相互作用图像变换 $U_i' = e^{-i(\omega' t + \varphi')S_z}$。由于只消去了含 $\omega' t + \varphi'$ 的相角，求导修正给出 $-\omega' S_z$，主驱动相角变为 $\alpha(t) = (\omega-\omega')t + (\varphi-\varphi')$：
      $$H_I' = \underbrace{(\omega_0 - \omega')S_z + \Omega' S_x}_{\text{③}} + \Omega\left[\cos\alpha(t)\,S_x + \sin\alpha(t)\,S_y\right]$$

      不含时的静态块 ③ 在 $x\text{-}z$ 平面构成一个略微歪斜的有效矢量。假设处于远失谐弱微扰区 $|\Omega'| \ll |\omega_0 - \omega'|$，绕 $y$ 轴旋转小角度 $\theta$（$\tan\theta = \frac{\Omega'}{\omega_0-\omega'}$）定义新量化轴：
      $$S_z' = \cos\theta\,S_z + \sin\theta\,S_x, \qquad S_x' = \cos\theta\,S_x - \sin\theta\,S_z, \qquad S_y' = S_y$$
      令 $\cos\theta = \frac{|\omega_0 - \omega'|}{\sqrt{(\omega_0 - \omega')^2 + \Omega'^2}} > 0$、$\sin\theta = \operatorname{sgn}(\omega_0-\omega')\frac{\Omega'}{\sqrt{(\omega_0-\omega')^2+\Omega'^2}}$，代入立得 $(\omega_0-\omega')S_z + \Omega' S_x = \operatorname{sgn}(\omega_0-\omega')\sqrt{(\omega_0-\omega')^2 + \Omega'^2}(\cos\theta\,S_z + \sin\theta\,S_x)$，从而对 $\omega_0 > \omega'$ 与 $\omega_0 < \omega'$ 皆严格对角化块 ③ 为 $\operatorname{sgn}(\omega_0-\omega')\sqrt{(\omega_0-\omega')^2+\Omega'^2}\,S_z'$。注意**教材勘误 1**：原书式 (1.19) 下方漏印了平方，分母写作 $\sqrt{(\omega_0-\omega')+\Omega'^2}$，正确必须保留平方 $(\omega_0-\omega')^2$。

