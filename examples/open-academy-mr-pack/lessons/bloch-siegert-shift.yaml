final: bs-final-explain
summary: |
  - **自旋量化轴倾斜（一重变换）**：在第一重旋转系 $U_i' = e^{-i(\omega' t+\varphi')S_z}$ 下，非共振横向块 $(\omega_0-\omega')S_z + \Omega' S_x$ 经绕 $y$ 轴小角旋转 $\theta$ 对角化为 $\operatorname{sgn}(\omega_0-\omega')\sqrt{(\omega_0-\omega')^2 + \Omega'^2}\,S_z'$；因快变纵向项只造成微弱相角抖动，且 $(S'_x,S'_y,S'_z)$ 与 $(S_x,S_y,S_z)$ 幺正等价（态重叠偏差 $\sin^2(\theta/2)\sim 10^{-6}\text{--}10^{-4}$）、$\cos^2(\theta/2)\approx 1$，可直接沿用实验室基矢符号同时保留斜边拉伸（须注意教材式 (1.19) 根号平方与式 (1.20) 分母 $\omega_0-\omega'$ 两处勘误）。
  - **Bloch-Siegert 平移与旋波边界（二重变换）**：再经 $U_i'' = e^{-i[(\omega-\omega')t-\varphi']S_z}$ 抵消时间与 $-\varphi'$ 偏置并做二阶展开，得出普适二阶频移 $\Delta_{\text{BS}} = \frac{\Omega'^2}{2(\omega_0-\omega')}$（修正教材错印 `Δ_SB`）。对旋波近似舍去的反向项（$\omega'=-\omega, \Omega'=\Omega$），得到 $\Delta_{\text{BS}} = \frac{\Omega^2}{2(\omega_0+\omega)} \approx \frac{\Omega^2}{4\omega_0}$，定量给出 RWA 成立边界 $\frac{\Omega}{4\omega_0} \ll 1$。
  - **能级排斥符号律与 AC Stark 同构**：红失谐（$\omega' < \omega_0$）导致蓝移（$\Delta_{\text{BS}}>0$），蓝失谐（$\omega' > \omega_0$）导致红移（$\Delta_{\text{BS}}<0$）；该公式在 $\Omega'=2\lambda\sqrt{n}$ 对应下正是《量子光学》大失谐色散 AC Stark 频移 $2n\frac{\lambda^2}{\omega_0-\omega_c}$ 的半经典极限。
  **Next:** 下一节「纵向驱动与边带及倍频激发」将转向沿静态磁场 $z$ 轴振荡的纵向交变场，探索量化轴不倾斜但能级发生周期性相位调制时产生的一系列伴随边带与倍频跃迁。
