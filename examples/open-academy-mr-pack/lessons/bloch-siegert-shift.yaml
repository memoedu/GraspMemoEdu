      接着把 $S_x = \cos\theta\,S_x' + \sin\theta\,S_z'$、$S_y = S_y'$ 代入主驱动项。先舍去随 $|\omega-\omega'|$ 高频振荡的 $\Omega\sin\theta\cos\alpha(t)\,S_z'$ 项：它沿 $S_z'$ 平均为零，积分相角误差上限仅 $\frac{\Omega\sin\theta}{|\omega-\omega'|} \sim \frac{\Omega\Omega'}{(\omega_0-\omega')^2} \sim 4\times 10^{-6}\text{ rad}$，而块 ③ 中的静态能隙拉伸会在第二重旋转系下随时间线性积累，绝不能舍。再用 $\cos\theta = \cos^2(\theta/2) - \sin^2(\theta/2)$ 与 $1 = \cos^2(\theta/2) + \sin^2(\theta/2)$ 拆解：
      $$\cos\alpha\,\cos\theta\,S_x' + \sin\alpha\,S_y' = \cos^2\frac{\theta}{2}(\cos\alpha\,S_x' + \sin\alpha\,S_y') - \sin^2\frac{\theta}{2}(\cos\alpha\,S_x' - \sin\alpha\,S_y')$$
      舍去极小的 $\sin^2(\theta/2)$ 反向项后得：
      $$H_I' \approx \operatorname{sgn}(\omega_0-\omega')\sqrt{(\omega_0-\omega')^2 + \Omega'^2}\,S_z' + \Omega\cos^2\frac{\theta}{2}\left[\cos\alpha(t)\,S_x' + \sin\alpha(t)\,S_y'\right]$$
      这里注意**教材勘误 2**：原书式 (1.20) 下方误将 $\cos\theta \approx 1 - \frac{1}{2}\big(\frac{\Omega'}{\omega_0-\omega'}\big)^2$ 的分母印成 $\omega - \omega'$（漏掉下标 $0$）。在弱微扰下 $\cos^2(\theta/2) \approx 1 - \frac{1}{4}\big(\frac{\Omega'}{\omega_0-\omega'}\big)^2 \approx 1$；而且 $(S_x', S_y', S_z')$ 与 $(S_x, S_y, S_z)$ 构成严格幺正等价的自旋 $1/2$ 代数（$U_i''$ 围绕 $S_z'$ 转动），本征态投影偏差 $\sin^2(\theta/2) = \frac{1-\cos\theta}{2} \sim 10^{-6}\text{--}10^{-4}$ 极微，因此可直接沿用 $(S_x, S_y, S_z)$ 符号表象并取 $\cos^2(\theta/2)\approx 1$，只保留斜边能隙拉伸！
    worked: |
      设某自旋在反向旋转项 ① 干扰下满足 $\omega_0/(2\pi) = 2.5\text{ GHz}$，反向项 $\omega'/(2\pi) = -2.5\text{ GHz}$、$\Omega'/(2\pi) = 10\text{ MHz}$，主驱动典型幅值与频率为 $\Omega/(2\pi) = 10\text{ MHz}$、$\omega \approx \omega_0$。我们来检验各近似量级为何能成立。

      1. **计算轴向系数差与轴倾角 $\theta$。**
         $$(\omega_0 - \omega')/(2\pi) = 5000\text{ MHz}, \qquad \tan\theta = \frac{10}{5000} = 2 \times 10^{-3} \implies \sin\theta \approx 2\times 10^{-3}.$$

      2. **对比舍去的纵向快变项与保留的静态拉伸。** 舍去项 $\Omega\sin\theta\cos\alpha(t)\,S_z'$ 幅值达 $10\text{ MHz}\times 2\times 10^{-3} = 20\text{ kHz}$，但它以 $|\omega-\omega'|/(2\pi) \approx 5\text{ GHz}$ 振荡平均为零，积分相角界限仅 $\frac{20\text{ kHz}}{5\text{ GHz}} = 4\times 10^{-6}\text{ rad}$；而块 ③ 斜边 $\sqrt{5000^2 + 10^2}\text{ MHz}$ 相对于 $5000\text{ MHz}$ 恒定拉长了 $10\text{ kHz}$，会随时间线性累加相移，故必须保留。

      3. **核对态重叠偏差与幺正等价表象。** 用勘误修正后的展式算得 $1 - \cos\theta \approx \frac{1}{2}(2\times 10^{-3})^2 = 2\times 10^{-6}$，态基重叠偏离与 $\sin^2(\theta/2) = \frac{1-\cos\theta}{2} \approx 1\times 10^{-6}$（$\cos^2(\theta/2) \approx 1 - 1\times 10^{-6}$）。因 $(S_x', S_y', S_z')$ 与 $(S_x, S_y, S_z)$ 满足完全等价的自旋 $1/2$ 代数且态基几乎重合，继续在 $S_{x,y,z}$ 表象下写有效哈密顿量即可兼顾简洁与高精度。
