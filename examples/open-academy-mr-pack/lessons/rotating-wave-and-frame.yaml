      ```

      交变电磁场携带量子化的能量份，叫做**光子**。右图中蓝色矢量绕 $+z$ 轴逆时针旋转，称作右旋圆偏振，对应角动量 $+1$ 的光子；红色矢量项①顺时针旋转，称作左旋圆偏振，对应角动量 $-1$ 的光子。

      ### 用角动量守恒舍去反向项

      电子自旋从 $|m_S = -1/2\rangle$ 向上吸收跃迁到 $|m_S = +1/2\rangle$ 时 $\Delta m_S = +1$，必须吸收 $+1$ 光子（向下发射跃迁 $\Delta m_S = -1$ 时则放出一个 $+1$ 光子，同样配对同一逆时针模式）。项①不仅对应角动量 $-1$ 不守恒，还沿相反方向高速旋转。于是在**旋波近似（Rotating-Wave Approximation，简称 RWA）**下舍去项①：
      $$H \approx \omega_0 S_z + \Omega\left[\cos(\omega t + \varphi)S_x + \sin(\omega t + \varphi)S_y\right]$$

      两项幅值同为 $\Omega$，舍去项①并不是因为它更小，而是角动量不守恒且方向反向。

      ### 判断旋波近似何时在强驱动下失效

      旋波近似仅在驱动远弱于能隙（$\Omega \ll \omega_0$，称作**弱驱动**条件）且驱动频率接近共振（$\omega$ 靠近能隙 $\omega_0$）时足够准确，此时反向项迅速平均抵消。若驱动强到 $\Omega$ 可比拟 $\omega_0$，项①来不及抵消并引起共振频率偏移，就必须保留反向项再做修正。
    worked: |
      我们来对一个典型的金刚石 NV 色心电子自旋实验做一次旋波近似分解。设共振普通频率（即能隙对应频率）$\omega_0 / (2\pi) = 10\text{ GHz}$，横向交变驱动场的普通频率 $\omega / (2\pi) = 9.99\text{ GHz}$、总幅值参数 $2\Omega / (2\pi) = 20\text{ MHz}$，初相位 $\varphi = 0$。

      1. **计算单个圆偏振分量的驱动幅值。** 从线性项 $2\Omega\cos(\omega t) S_x$ 拆成两个圆偏振分量后，每个分量的幅值减半：
         $$\Omega / (2\pi) = \frac{20\text{ MHz}}{2} = 10\text{ MHz}.$$

      2. **写出完整拆解式与被舍去的反向项①。** 按逆时针和顺时针分量展开后，用下括号标出顺时针项①：
         $$H = \omega_0 S_z + \Omega\left[\cos(\omega t)S_x + \sin(\omega t)S_y\right] + \underbrace{\Omega\left[\cos(\omega t)S_x - \sin(\omega t)S_y\right]}_{\text{①}}.$$

      3. **结合角动量守恒与弱驱动条件舍去项①。** 向上跃迁需要 $\Delta m_S = +1$，只匹配角动量 $+1$ 的逆时针分量；同时驱动 $\Omega / (2\pi) = 10\text{ MHz} \ll \omega_0 / (2\pi) = 10\text{ GHz}$ 且 $\omega$ 接近 $\omega_0$，旋波近似足够准确：
         $$H \approx \omega_0 S_z + \Omega\left[\cos(\omega t)S_x + \sin(\omega t)S_y\right].$$

      这样就把沿 $x$ 轴振荡的驱动场化简成了单一逆时针旋转驱动场。
