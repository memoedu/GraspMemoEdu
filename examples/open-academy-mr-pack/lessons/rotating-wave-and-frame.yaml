objective: |
  **Goal:** 能够把横向余弦驱动场分解为正反两个圆偏振分量并用角动量守恒解释旋波近似，再通过相互作用图像变换（旋转公式法与升降算符法）把含时磁共振哈密顿量化为不含时形式。
# 注：前置概念 spin-zeeman-and-drive 当前为 stub（尚未编写正课），按 Open Academy validate.ts 规则暂省略 recap 字段，改为在开篇和第 1 步首段自包含复述起点哈密顿量。
where_this_fits: |
  ### 什么是旋波近似与相互作用图像？

  **旋波近似**是把沿固定方向来回振荡的驱动场拆成顺、逆时针两个旋转分量后，舍去不能激发跃迁的反向分量；**相互作用图像**则是切换到随驱动场一起旋转的参考系，把依然随时间变化的哈密顿量写成常系数形式。

  为什么要做这两步？在静磁场和横向交变磁场下，哈密顿量带着随时间 $t$ 振荡的余弦项，很难直接看出自旋会怎样演化。先简化驱动场、再换到旋转坐标系，就能把时间 $t$ 彻底消去，为下一步求解演化铺平道路。
knowledge_points:
  - id: rwa-split-field
    title: "拆开驱动场并舍去反向项"
    tldr: |
      - 线偏振场可拆成正反两个等幅度旋转场。
      - 电子自旋跃迁匹配逆时针 $+1$ 光子分量，反向分量在弱驱动下可舍去。
      - 若驱动太强使 $\Omega$ 可比拟能隙 $\omega_0$，旋波近似不再适用，反向项引起共振频移。
    explain: |
      ### 从静态能级与线偏振场出发

      对于自旋 $1/2$ 的电子（如金刚石 NV 色心），无量纲算符 $S_z$ 的两个本征态用磁量子数 $m_S = \pm 1/2$ 记作 $|m_S = \pm 1/2\rangle$，满足 $S_z|m_S = \pm 1/2\rangle = \pm\frac{1}{2}|m_S = \pm 1/2\rangle$。电子旋磁比 $\gamma_e < 0$，在外加静磁场 $B_0 > 0$ 下 $\omega_0 = -\gamma_e B_0 > 0$，因此 $H_0 = \omega_0 S_z$ 给下能级 $|m_S = -1/2\rangle$ 与上能级 $|m_S = +1/2\rangle$ 赋予能量 $-\omega_0/2$ 和 $+\omega_0/2$，两能级之间的能量差（能隙）为 $\omega_0$。

      再叠加沿 $x$ 轴来回振荡的横向交变驱动场（幅值参数 $2\Omega = -\gamma_e B_x$，普通频率 $\omega/(2\pi)$，初相位 $\varphi$），除以 $\hbar$ 后得
      $$H = \omega_0 S_z + 2\Omega\cos(\omega t + \varphi) S_x$$

      ### 把余弦场拆成两个旋转分量

      只沿 $x$ 轴来回振荡的场叫**线偏振**场，在 $x\text{-}y$ 平面内绕圆圈转动的场叫**圆偏振**场。在右端一加一减同一个 $y$ 方向自旋分量 $S_y$ 项（$S_y$ 抵消、$S_x$ 相加还原），就把线偏振拆成一正一反两个等幅度的圆偏振分量：
      $$
      \begin{aligned}
      H &= \omega_0 S_z + 2\Omega\cos(\omega t + \varphi) S_x \\
        &= \omega_0 S_z + \Omega\left[\cos(\omega t + \varphi)S_x + \sin(\omega t + \varphi)S_y\right] + \underbrace{\Omega\left[\cos(\omega t + \varphi)S_x - \sin(\omega t + \varphi)S_y\right]}_{\text{①}}
      \end{aligned}
      $$
      下图左侧是两能级图，右侧是从 $+z$ 轴俯视的 $x\text{-}y$ 平面分解图：

      ```svg
