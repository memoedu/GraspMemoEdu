      - rwa-split-spot-mistake
      - rwa-split-nuclear-transfer

  - id: rwa-rotating-frame
    title: "跳进旋转坐标系消去时间"
    tldr: |
      - 相互作用图像变换相当于坐上与驱动场同频逆时针旋转的转盘去观察系统。
      - 在转盘上看，旋转的驱动矢量变成只由初相位决定的固定矢量，不再随时间变化。
      - 变换后整个哈密顿量成为常系数形式，由频率差与固定初相位共同决定。
    explain: |
      ### 切换到相互作用图像

      经旋波近似后，驱动矢量仍以角频率 $\omega$ 绕 $z$ 轴逆时针旋转。如果我们坐上同频逆时针旋转的参考系去观察，转动的矢量就会静止下来。

      量子力学中实现这一参考系切换的算符叫**相互作用图像变换**，定义为 $U_i = e^{-i\omega t S_z}$，其中 $i$ 是虚数单位（$i^2 = -1$）。$U_i$ 是**幺正算符**，即它的厄米共轭 $U_i^\dagger$（把数值取复共轭、算符共轭转置并倒换乘积次序）恰好等于它的逆算符，满足 $U_i^\dagger U_i = \mathbb{1}$（单位算符）。由于 $S_z$ 自身厄米（$S_z^\dagger = S_z$），取共轭后指数变号，即 $U_i^\dagger = e^{+i\omega t S_z}$。

      设实验室系态矢量为 $|\psi\rangle$，旋转系里的态矢量记为 $|\psi_I\rangle = U_i^\dagger|\psi\rangle$，即 $|\psi\rangle = U_i|\psi_I\rangle$。将其代入含时薛定谔方程 $i\frac{\partial}{\partial t}|\psi\rangle = H|\psi\rangle$，左侧由偏导乘积法则展开得到 $i\left(\frac{\partial}{\partial t}U_i\right)|\psi_I\rangle + U_i\, i\frac{\partial}{\partial t}|\psi_I\rangle = H U_i|\psi_I\rangle$。两边左乘 $U_i^\dagger$ 并整理出等效方程 $i\frac{\partial}{\partial t}|\psi_I\rangle = H_I|\psi_I\rangle$，其中有效哈密顿量为
      $$
      \begin{aligned}
      H_I &= U_i^\dagger H U_i - U_i^\dagger i \frac{\partial}{\partial t} U_i \\
          &= (\omega_0 - \omega)S_z + \Omega \underbrace{U_i^\dagger \left[\cos(\omega t + \varphi)S_x + \sin(\omega t + \varphi)S_y\right] U_i}_{\text{②}}
      \end{aligned}
      $$
      上式第一项由两部分相加得到。一方面，$S_z$ 与仅含 $S_z$ 的 $U_i$ **对易**（相乘可交换顺序），所以 $U_i^\dagger(\omega_0 S_z)U_i = \omega_0 S_z U_i^\dagger U_i = \omega_0 S_z$。另一方面，$\frac{\partial}{\partial t}U_i = -i\omega S_z U_i$，代回 $-U_i^\dagger i\frac{\partial}{\partial t}U_i$ 并用 $i^2=-1$ 得出 $-\omega S_z$，相加即得 $(\omega_0 - \omega)S_z$。

      ### 用三维旋转公式化解时间依赖

      令括号里旋转矢量的坐标为 $\vec{\boldsymbol{r}} = (\cos(\omega t + \varphi), \sin(\omega t + \varphi), 0)$，就可把夹在 $U_i^\dagger$ 与 $U_i$ 中间的部分写成 $\vec{\boldsymbol{r}}\cdot\vec{\boldsymbol{S}}$，整块记为项②。借助对任意自旋量子数都成立的**三维旋转公式**：
      $$e^{-i\theta \vec{\boldsymbol{n}}\cdot\vec{\boldsymbol{S}}}\left(\vec{\boldsymbol{r}}\cdot\vec{\boldsymbol{S}}\right)e^{i\theta \vec{\boldsymbol{n}}\cdot\vec{\boldsymbol{S}}} = R_{\vec{\boldsymbol{n}}\cdot\theta}(\vec{\boldsymbol{r}})\cdot\vec{\boldsymbol{S}}$$
      这里 $\vec{\boldsymbol{n}}$ 是**单位**方向矢量，而记号 $R_{\vec{\boldsymbol{n}}\cdot\theta}(\vec{\boldsymbol{r}})$ 里的中间点只用来分隔转轴和转角、不代表点乘，意思是把三维矢量 $\vec{\boldsymbol{r}}$ 按右手定则绕单位轴 $\vec{\boldsymbol{n}}$ 转过角度 $\theta$（右手大拇指指向 $\vec{\boldsymbol{n}}$，四指弯曲为正转角方向）。把项②左右两边同时写成 $U_i^\dagger = e^{+i\omega t S_z} = e^{-i(\omega t)(-S_z)}$ 与 $U_i = e^{-i\omega t S_z} = e^{+i(\omega t)(-S_z)}$，与公式左边两端一一比对，立刻读出 $\vec{\boldsymbol{n}} = (0, 0, -1)$ 且 $\theta = \omega t$。

      ```svg
