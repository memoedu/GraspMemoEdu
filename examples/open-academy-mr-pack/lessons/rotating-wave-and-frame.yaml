      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="476.71" y="155.33" fill="#737373">ωt+φ</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="497.62" y="100.52" fill="#3b82f6">逆时针 (+1 保留)</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="497.62" y="116.52" fill="#3b82f6">幅值 Ω</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="497.62" y="229.48" fill="#ef4444">顺时针 (-1 忽略①)</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="497.62" y="245.48" fill="#ef4444">幅值 Ω</text>
      </g>
