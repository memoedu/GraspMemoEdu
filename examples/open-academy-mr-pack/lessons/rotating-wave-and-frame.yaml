  - id: rwa-ladder-operators
    title: "用算符代数消去时间"
    tldr: |
      - 把横向自旋算符改写成专门负责升高和降低能级的两个升降算符。
      - 在相互作用图像下，上升算符乘出一个与驱动相位恰好相消的时间因子。
      - 这套纯代数推导不仅适用于高自旋，还能直接推广到光场玻色子系统。
    explain: |
      ### 为什么要学升降算符

      前面用三维旋转公式虽然直接，但日后遇到更复杂的驱动场或其他量子系统时，未必总好套用空间旋转。这里再学一种只靠算符代数就能消去时间的方法。

      我们利用 $S_x, S_y$ 定义一对**自旋升降算符**：上升算符 $S^+ = S_x + i S_y$ 和下降算符 $S^- = S_x - i S_y$，反解可得 $S_x = \frac{1}{2}(S^+ + S^-)$ 与 $S_y = \frac{1}{2}(-i S^+ + i S^-)$。因为 $S_x, S_y$ 都是厄米算符，即 $S_x^\dagger = S_x$、$S_y^\dagger = S_y$，所以对 $S^+$ 取厄米共轭恰好得到下降算符：$(S^+)^\dagger = S^-$。按自旋角动量算符的乘法规则，它们作用在 $|m_S = \pm 1/2\rangle$ 上时，上升算符把下态升到上态、下降算符把上态降到下态，越出边界则为零：
      $$
      \begin{aligned}
      S^+|m_S = -1/2\rangle &= |m_S = +1/2\rangle, & S^+|m_S = +1/2\rangle &= 0 \\
      S^-|m_S = +1/2\rangle &= |m_S = -1/2\rangle, & S^-|m_S = -1/2\rangle &= 0
      \end{aligned}
      $$

      ### 用算符共轭消去时间

      把 $S_x, S_y$ 代入项②，并用欧拉公式 $\cos\alpha \pm i\sin\alpha = e^{\pm i\alpha}$ 合并指数。利用共轭倒序法则 $(A B)^\dagger = B^\dagger A^\dagger$ 与数乘法则 $(c A)^\dagger = c^* A^\dagger$，可得 $(e^{-i(\omega t+\varphi)} U_i^\dagger S^+ U_i)^\dagger = e^{i(\omega t+\varphi)} U_i^\dagger S^- U_i$。于是括号里含 $S^-$ 的第二项恰好是第一项的厄米共轭，简记为 $h.c.$：
      $$
      \begin{aligned}
      \text{②} &= U_i^\dagger \left[\cos(\omega t + \varphi)S_x + \sin(\omega t + \varphi)S_y\right] U_i \\
               &= \frac{1}{2} U_i^\dagger \left[e^{-i(\omega t + \varphi)}S^+ + e^{i(\omega t + \varphi)}S^-\right] U_i \\
               &= \frac{1}{2}\left[e^{-i(\omega t + \varphi)} U_i^\dagger S^+ U_i + h.c.\right]
      \end{aligned}
      $$
      根据算符函数的通用作用规则：若某算符满足 $S_z|m_S\rangle = m_S|m_S\rangle$，则函数 $f(S_z)$ 作用在该本征态上只需把 $S_z$ 换成数值 $m_S$，即 $f(S_z)|m_S\rangle = f(m_S)|m_S\rangle$。由于 $S^+$ 把 $m_S$ 抬高 $+1$，这让我们得到恒等式 $U_i^\dagger S^+ U_i = e^{i\omega t} S^+$（下方例题给出逐态证明）。代回上式，指数中的 $-i\omega t$ 与 $+i\omega t$ 立刻相消：
      $$\text{②} = \frac{1}{2}\left(e^{-i\varphi} S^+ + e^{i\varphi} S^-\right) = \cos(\varphi)S_x + \sin(\varphi)S_y$$
      这与三维旋转公式所得完全一致。因为上述代数推导只用到 $S^+$ 将磁量子数抬高 $+1$ 这一性质，它对任意自旋量子数 $S > 1/2$ 的高自旋系统同样成立。此外，这一关系还能直接推广到谐振子或光场这类**玻色子**系统：那里粒子数态 $|n\rangle$ 满足 $a^\dagger a|n\rangle = n|n\rangle$，**产生算符** $a^\dagger$ 将 $|n\rangle$ 变为 $\sqrt{n+1}|n+1\rangle$，**湮灭算符** $a$ 将粒子数降一级。由于 $a^\dagger$ 每次把量子数 $n$ 抬高 $+1$，且数值标量 $e^{i\omega t}$ 可以越过算符交换顺序，同样有
      $$e^{i\omega t\, a^\dagger a} a^\dagger e^{-i\omega t\, a^\dagger a} = a^\dagger e^{i\omega t}.$$
    worked: |
      我们来逐步证明算符恒等式 $U_i^\dagger S^+ U_i = e^{i\omega t} S^+$，并代回 $\varphi = \pi/2$ 核对结果。因为任意自旋 $1/2$ 量子态都能写成两个本征基矢 $\{|m_S=+1/2\rangle, |m_S=-1/2\rangle\}$ 的线性叠加 $|\psi\rangle = c_+|m_S=+1/2\rangle + c_-|m_S=-1/2\rangle$，只要在两个本征基矢上分别验证等式两边相等，就由算符线性严格证明了算符恒等式对所有态都成立。

      1. **检验作用在下能级本征基矢 $|m_S = -1/2\rangle$ 上。** 由规则 $f(S_z)|m_S\rangle = f(m_S)|m_S\rangle$，右侧 $U_i = e^{-i\omega t S_z}$ 作用在 $|m_S=-1/2\rangle$ 上给出 $e^{+i\omega t/2}$；被 $S^+$ 升到上态 $|m_S=+1/2\rangle$ 后，左侧 $U_i^\dagger = e^{+i\omega t S_z}$ 再给出同号因子 $e^{+i\omega t/2}$，与右端 $e^{i\omega t}S^+|m_S=-1/2\rangle$ 完全相同：
         $$U_i^\dagger S^+ U_i |m_S = -1/2\rangle = e^{i\omega t/2} U_i^\dagger S^+ |m_S = -1/2\rangle = e^{i\omega t/2} U_i^\dagger |m_S = +1/2\rangle = e^{i\omega t} |m_S = +1/2\rangle.$$

      2. **检验另一本征基矢 $|m_S = +1/2\rangle$。** 因为 $U_i|m_S = +1/2\rangle = e^{-i\omega t/2}|m_S = +1/2\rangle$，且 $S^+|m_S = +1/2\rangle = 0$，所以左端结果为 $0$，与右端 $e^{i\omega t}S^+|m_S=+1/2\rangle = 0$ 一致，恒等式 $U_i^\dagger S^+ U_i = e^{i\omega t} S^+$ 证毕。

      3. **代回项②并核对具体参数。** 将 $\varphi = \pi/2$、$(\omega_0 - \omega)/(2\pi) = 10\text{ MHz}$、$\Omega/(2\pi) = 10\text{ MHz}$ 代入无时间依赖的项②：
         $$\text{②} = \frac{1}{2}\left(e^{-i\pi/2} S^+ + e^{i\pi/2} S^-\right) = \frac{1}{2}\left(-i S^+ + i S^-\right) = S_y.$$

      于是 $H_I/(2\pi) = 10\text{ MHz}\cdot S_z + 10\text{ MHz}\cdot S_y$，升降算符法与三维旋转公式法所得的常系数哈密顿量完全吻合。
