      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="267.47" y="82.12" font-weight="600">r⃗ = (cos(ωt+φ), sin(ωt+φ), 0)</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="354.54" y="174.27" fill="#3b82f6" font-weight="600">r⃗' = (cos φ, sin φ, 0)</text>
      <rect x="405" y="205" width="222" height="74" rx="6" fill="#ffffff" fill-opacity="0" stroke="#d4d4d4" stroke-width="1.2"/>
      <text x="417" y="227" fill="#171717" font-weight="600">变换 U_i = exp(-i ω t S_z)</text>
      <text x="417" y="248" fill="#737373">转轴 n⃗ = (0, 0, -1)，转角 θ = ωt</text>
      <text x="417" y="268" fill="#3b82f6">转动后与时间 t 无关</text>
      </g>
      </svg>
      ```

      绕 $(0, 0, -1)$ 转动 $\omega t$ 就是沿着橙色箭头顺时针转回 $\omega t$ 角度，黑色矢量 $\vec{\boldsymbol{r}}$ 回到只含初相位的蓝色固定矢量 $\vec{\boldsymbol{r}}' = (\cos\varphi, \sin\varphi, 0)$，从而把整个哈密顿量变成与时间无关的常系数形式：
      $$H_I = (\omega_0 - \omega)S_z + \Omega\left[\cos(\varphi)S_x + \sin(\varphi)S_y\right]$$

      在这个式子里，驱动初相位 $\varphi$ 决定了有效驱动轴在 $x\text{-}y$ 平面中的指向：例如 $\varphi = 0$ 时给出 $+\Omega S_x$，$\varphi = \pi/2$ 时给出 $+\Omega S_y$，$\varphi = \pi$ 时则给出 $-\Omega S_x$。
    worked: |
      我们来计算一套具体参数下的旋转坐标系有效哈密顿量 $H_I$。设电子自旋共振普通频率 $\omega_0/(2\pi) = 10\text{ GHz}$，交变驱动场频率 $\omega/(2\pi) = 9.99\text{ GHz}$，单分量驱动幅值 $\Omega/(2\pi) = 10\text{ MHz}$，初相位 $\varphi = \pi/2$。

      1. **求出静态项与求导修正合并后的 $S_z$ 系数。** 将 $\omega_0/(2\pi)$ 与 $\omega/(2\pi)$ 代入变换后的 $(\omega_0 - \omega)S_z$，算出 $S_z$ 项的频率系数：
         $$(\omega_0 - \omega)/(2\pi) = 10\text{ GHz} - 9.99\text{ GHz} = 10\text{ MHz}.$$

      2. **确定三维旋转公式参数并转回固定矢量。** 这里 $\vec{\boldsymbol{n}}=(0,0,-1)$、$\theta = \omega t$，把 $\vec{\boldsymbol{r}} = (\cos(\omega t + \pi/2), \sin(\omega t + \pi/2), 0)$ 顺时针转回 $\omega t$，得到 $\vec{\boldsymbol{r}}' = (0, 1, 0)$：
         $$\Omega\left[\cos(\pi/2)S_x + \sin(\pi/2)S_y\right] = \Omega S_y.$$

      3. **合成最终的不含时哈密顿量 $H_I$。** 将上述两项合并，并除以 $2\pi$ 以普通频率单位写出结果：
         $$H_I / (2\pi) = 10\text{ MHz}\cdot S_z + 10\text{ MHz}\cdot S_y.$$

      所有含 $\cos(\omega t)$ 和 $\sin(\omega t)$ 的振荡项都已彻底消去，原本含时的哈密顿量变成了一个常系数算符。
