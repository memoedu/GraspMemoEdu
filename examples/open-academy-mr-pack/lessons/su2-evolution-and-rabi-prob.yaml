      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" aria-label="拉比跃迁概率随无量纲时间 Omega t 除以 pi 变化的曲线图（对照 Gerry &amp; Knight 图 4.4）：蓝色实线为完全共振 delta 等于零，在 Omega t 等于 pi/2 时达到 P 等于 0.50，在 Omega t 等于 pi 时达到峰值 P 等于 1.00；橙色虚线 delta 等于 Omega 最大概率降至 0.50 且振荡周期缩短；红色点线 delta 等于 2 Omega 最大概率进一步压低至 0.20。">
