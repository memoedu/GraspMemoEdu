objective: |
  **Goal:** 能够把旋转系哈密顿量 $H_I$ 写成有效转轴的 $SU(2)$ 演化算符 $U_I$，分别用演化算符法与《量子光学》耦合概率幅微分方程法导出拉比跃迁概率和粒子数反转 $W(t)$，掌握共振 $\pi$ 与 $(\pi/2)$ 脉冲的布居效果，并推广至全量子 Jaynes–Cummings 模型的量子化拉比频率 $\Omega(n) = 2\lambda\sqrt{n+1}$。
recap:
  - concept: rotating-wave-and-frame
    text: "作旋波近似与相互作用图像变换 $U_i = e^{-i\\omega t S_z}$ 后，含时驱动消去时间，化简为常系数有效哈密顿量 $H_I = (\\omega_0 - \\omega)S_z + \\Omega[\\cos(\\varphi)S_x + \\sin(\\varphi)S_y]$。"
where_this_fits: |
  ### 从常系数哈密顿量到完整的跃迁概率曲线

  在上一课，我们已经通过旋波近似与旋转坐标系得到了不含时的有效哈密顿量 $H_I$。现在哈密顿量里再也没有随时间变化的函数了，接下来要回答的正是实验上最核心的问题：经过时间 $t$ 后，自旋或二能级原子有多大概率从下能级翻转到上能级？

  本课先按《磁共振基础》把 $H_I$ 写成三维有效磁场绕轴旋转的 $SU(2)$ 幺正算符，直接读出跃迁概率；同时对照《Introductory Quantum Optics》§4.4–§4.5 的二阶微分方程解法、粒子数反转 $W(t)$ 与全量子真空拉比振荡，从三条线索彻底打通拉比振荡。
knowledge_points:
  - id: su2-effective-field-and-unitary
    title: "构造有效转轴与 SU(2) 演化算符"
    tldr: |
      - 定义偏共振 $\delta = \omega_0 - \omega$ 与有效拉比频率 $\Omega_{\text{eff}} = \sqrt{\Omega^2 + \delta^2}$，把 $H_I$ 写成 $\Omega_{\text{eff}}\vec{\boldsymbol{n}}\cdot\vec{\boldsymbol{S}}$。
      - 有效转轴 $\vec{\boldsymbol{n}} = (\sin\theta'\cos\varphi,\; \sin\theta'\sin\varphi,\; \cos\theta')$ 在共振（$\delta=0$）时倒在赤道 $x\text{-}y$ 平面内。
      - 引入泡利矩阵矢量 $\vec{\boldsymbol{\sigma}} = 2\vec{\boldsymbol{S}}$ 与转角 $\theta = \Omega_{\text{eff}}t$，演化算符成为 $U_I = \cos(\theta/2)\mathbb{1} - i\sin(\theta/2)\vec{\boldsymbol{n}}\cdot\vec{\boldsymbol{\sigma}}$。
    explain: |
      ### 把失谐与驱动合成为单一有效场矢量

      为了让常系数哈密顿量 $H_I = (\omega_0 - \omega)S_z + \Omega[\cos(\varphi)S_x + \sin(\varphi)S_y]$ 的几何意义一目了然，我们引入两个核心频率参数：驱动频率偏离能隙的程度称为**偏共振（失谐）** $\delta = \omega_0 - \omega$（对应《量子光学》第 4 章记号 $\Delta$），以及横向驱动与纵向失谐的矢量模长，称为**有效拉比频率** $\Omega_{\text{eff}}$：
      $$\delta = \omega_0 - \omega,\qquad \Omega_{\text{eff}} = \sqrt{\Omega^2 + \delta^2}$$
      定义极角 $\theta'$ 满足 $\cos\theta' = \delta/\Omega_{\text{eff}}$、$\sin\theta' = \Omega/\Omega_{\text{eff}}$，于是单位有效转轴为 $\vec{\boldsymbol{n}} = (\sin\theta'\cos\varphi,\; \sin\theta'\sin\varphi,\; \cos\theta')$，整个有效哈密顿量缩并为标量与点乘的简洁形式：
      $$H_I = \Omega_{\text{eff}}\,\vec{\boldsymbol{n}}\cdot\vec{\boldsymbol{S}}$$

      ### 用泡利矩阵写出 $SU(2)$ 幺正演化算符

      由于 $H_I$ 与时间无关，在旋转坐标系里从 $0$ 演化到 $t$ 的算符直接是矩阵指数 $U_I = e^{-i H_I t} = e^{-i\Omega_{\text{eff}} t\,\vec{\boldsymbol{n}}\cdot\vec{\boldsymbol{S}}}$。引入**泡利矩阵矢量** $\vec{\boldsymbol{\sigma}} = (\sigma_x, \sigma_y, \sigma_z) = 2\vec{\boldsymbol{S}}$，并记总旋转角 $\theta = \Omega_{\text{eff}} t$，由于 $(\vec{\boldsymbol{n}}\cdot\vec{\boldsymbol{\sigma}})^2 = \mathbb{1}$，利用算符指数展开立即得到精确的 **$SU(2)$ 演化算符**：
      $$U_I = e^{-i\frac{\theta}{2}\vec{\boldsymbol{n}}\cdot\vec{\boldsymbol{\sigma}}} = \cos\left(\frac{\theta}{2}\right)\mathbb{1} - i\sin\left(\frac{\theta}{2}\right)\vec{\boldsymbol{n}}\cdot\vec{\boldsymbol{\sigma}}$$

