  - id: inversion-pulses-and-jc-quantized-rabi
    title: "分析粒子数反转、共振脉冲与量子化拉比振荡"
    tldr: |
      - 粒子数反转定义为 $W(t) = P_e(t) - P_g(t) = 2P(t) - 1$，共振（$\delta=0$）时从 $|1\rangle$ 出发有 $W(t) = -\cos(\Omega t)$。
      - 当 $\Omega t = \pi$ 称作 **$\pi$ 脉冲**（$P=1, W=+1$ 完全反转）；当 $\Omega t = \pi/2$ 称作 **$\pi/2$ 脉冲**（$P=0.5, W=0$ 等权叠加）。
      - 在全量子 Jaynes–Cummings 模型中，$n$ 光子数态给出量子化拉比频率 $\Omega(n) = 2\lambda\sqrt{n+1}$，即使真空 $n=0$ 仍发生**真空拉比振荡**。
    explain: |
      ### 粒子数反转 $W(t)$ 与共振 $\pi$ / $(\pi/2)$ 脉冲

      在实验与《量子光学》第 4.4 节（式 4.84–4.87）中，除了直接看上态布居 $P_e(t)$，还常使用上、下能级布居之差——**粒子数反转（atomic/population inversion）**：
      $$W(t) = P_e(t) - P_g(t) = 2P(t) - 1$$
      范围从 $-1$（全在下态 $|g\rangle\equiv|1\rangle$）到 $+1$（全在上态 $|e\rangle\equiv|0\rangle$）。当严格共振（$\delta = 0$，有效场落在赤道面）且初态处于下态 $|1\rangle$ 时，$P(t) = \sin^2(\Omega t/2)$，对应 $W(t) = -\cos(\Omega t)$。此时两个最关键的脉冲时长决定了基础量子操作：
      - **$\pi$ 脉冲**：控制时长 $t_\pi = \pi/\Omega$ 使转角 $\theta = \Omega t_\pi = \pi$，得 $P = 1$、$W = +1$，把态完整翻转到 $|0\rangle$（忽略整体相位）；
      - **$\pi/2$ 脉冲**：取半个时长 $t_{\pi/2} = \pi/(2\Omega)$ 使 $\theta = \pi/2$，得 $P = 0.5$、$W = 0$，从 $|1\rangle$ 出发制出等概率相干叠加态 $\frac{1}{\sqrt{2}}(|1\rangle - i e^{-i\varphi}|0\rangle)$（当选用相反电偶极/相位约定如 $\varphi=\pi$ 时对应《量子光学》记法中的等权叠加态 $\frac{1}{\sqrt{2}}(|g\rangle + i|e\rangle)$，具体单比特量子门参数化会在第 2 单元深入展开）。

      ### 推广至全量子 Jaynes–Cummings 模型的拉比振荡

      如果把经典驱动场换成单模量子谐振腔光场（初态有 $n$ 个光子，原子处于激发态 $|e\rangle|n\rangle$），在上一课推导的 JC 哈密顿量 $\hat{H}_{\text{JC}}/\hbar = \frac{1}{2}\omega_0\hat{\sigma}_3 + \omega a^\dagger a + \lambda(\hat{\sigma}_+ a + \hat{\sigma}_- a^\dagger)$ 中，激发数算符 $N_e = a^\dagger a + |e\rangle\langle e|$ 守恒，因此仅耦合 $|e\rangle|n\rangle$ 与 $|g\rangle|n+1\rangle$ 这两个态！对照旋转坐标系中共振驱动 $H_I|_{\delta=0,\varphi=0} = \Omega S_x = \frac{\Omega}{2}(S^+ + S^-)$ 的升降跃迁矩阵元恰好为 $\Omega/2$，而在 JC 模型里由 $a^\dagger|n\rangle = \sqrt{n+1}|n+1\rangle$ 得到的耦合非对角元恰好等于 $\lambda\sqrt{n+1}$（精准扮演半经典中 $\Omega/2$ 的角色）。由于此处初态取原子在上态 $|e\rangle|n\rangle$（上态布居 $P_e = 1 - P_{|e,n\rangle\to|g,n+1\rangle}$），反转度相对下态初态差一个负号，因此共振跃迁概率与**量子电动力学拉比频率** $\Omega(n)$ 为（式 4.114–4.116）：
      $$\Omega(n) = 2\lambda\sqrt{n+1},\qquad P_{|e,n\rangle \to |g,n+1\rangle}(t) = \sin^2\left(\lambda\sqrt{n+1}\,t\right),\qquad W(t) = \cos[\Omega(n)t]$$
      最惊人的推论在 $n = 0$：即便光腔里一颗光子也没有（零光子真空态 $|n=0\rangle$），只要 $\lambda \ne 0$，依然存在 $\Omega(0) = 2\lambda$ 的**真空拉比振荡**——原子可逆地放出并重新吸收同一颗光子，彻底超越半经典模型！
    worked: |
      对比两个直接对应的实验计算：半经典电子自旋驱动 $\Omega/(2\pi) = 10\text{ MHz}$（共振 $\delta = 0$），以及高 $Q$ 腔量子电动力学中的耦合参数 $\lambda/(2\pi) = 5\text{ MHz}$（光子数态分别取 $n = 0$ 与 $n = 8$）。

      1. **求半经典共振 $\pi$ 脉冲与 $\pi/2$ 脉冲时长。**
         $$t_\pi = \frac{\pi}{\Omega} = \frac{1}{2(\Omega/2\pi)} = \frac{1}{20\text{ MHz}} = 50\text{ ns},\qquad t_{\pi/2} = \frac{t_\pi}{2} = 25\text{ ns}.$$
         在 $t = 25\text{ ns}$ 时，$P = \sin^2(\pi/4) = 0.5$，反转度 $W = 2(0.5) - 1 = 0$；到 $t = 50\text{ ns}$ 时，$P = 1.0, W = +1.0$。

      2. **求全量子 JC 模型在真空（$n=0$）与 $n=8$ 光子时的拉比频率与完整振荡周期。** 由 $\Omega(n) = 2\lambda\sqrt{n+1}$：
         - 当 $n = 0$ 时，$\Omega(0)/(2\pi) = 2\times 5\sqrt{0+1} = 10\text{ MHz}$，完整真空拉比振荡周期 $T(0) = \frac{2\pi}{\Omega(0)} = 100\text{ ns}$；
         - 当 $n = 8$ 时，$\Omega(8)/(2\pi) = 2\times 5\sqrt{8+1} = 30\text{ MHz}$，振荡速度刚好是真空情况的 $3$ 倍，完整振荡周期 $T(8) = \frac{2\pi}{\Omega(8)} \approx 33.33\text{ ns}$（实现一次完全辐射翻转仅需半周期 $16.67\text{ ns}$）。
