      - lsb-frame-basics
      - lsb-frame-self-explain
      - lsb-bessel-chi-template
      - lsb-jacobi-spot-mistake
      - lsb-carrier-null-transfer

  - id: sideband-single-resonance-and-effective-hi
    title: "可分辨边带条件与单边带有效哈密顿量"
    tldr: |
      - 记边带失谐 $\Delta_n = \omega_0 - \omega + n\omega_z$；在可分辨条件 $|J_n(\chi)\Omega| \ll \omega_z$ 下至多一项共振。
      - 作二次变换 $U_2 = e^{+i\Delta_n t S_z}$ 得常系数 $H_{I,\text{eff}}^{(n)}$（并补齐教材式 (1.32) 漏掉的 $S_x$）。
      - 当 $\omega_z$ 过小使 $|J_n(\chi)\Omega| \ll \omega_z$ 失效时，多边带干涉须数值求解。
    explain: |
      ### 孤立单边带共振与二次旋转坐标系

      记第 $n$ 阶边带的频率失谐为 $\Delta_n = \omega_0 - \omega + n\omega_z$。因为相邻边带间隔为 $\omega_z$，只要满足**可分辨边带条件** $|J_m(\chi)\Omega| \ll \omega_z$（对所有主要阶次 $m$ 成立），且驱动频率 $\omega$ 接近某单一目标边带 $\omega_0 + n\omega_z$（即 $|\Delta_n| \lesssim |J_n(\chi)\Omega|$），则其余任何 $m \neq n$ 阶都满足 $|\Delta_m| = |\Delta_n + (m-n)\omega_z| \gtrsim \omega_z \gg |J_m(\chi)\Omega|$。这些非共振项高速振荡，在旋波近似下可平均忽略（高精度分析时仅贡献高阶小频移）。

      仅保留第 $n$ 阶近共振项（保留 $\frac{1}{2}$ 因子）：
      $$H_I^{(n)} \approx \frac{1}{2}J_n(\chi)\Omega\, e^{i(n\varphi_z - \varphi)} e^{i\Delta_n t} S^+ + \text{h.c.}$$
      为消去残留的时间因子 $e^{i\Delta_n t}$，施加以正号为特征的**二次相互作用图像变换** $U_2(t) = e^{+i\Delta_n t S_z}$。由于 $U_2$ 指数带正号，求导修正项 $-U_2^\dagger i\frac{\partial}{\partial t}U_2 = +\Delta_n S_z$ 为正，而 $U_2^\dagger S^+ U_2 = e^{-i\Delta_n t}S^+$ 恰好抵消 $e^{+i\Delta_n t}$。将 $\frac{1}{2}(e^{-i(\varphi-n\varphi_z)}S^+ + e^{i(\varphi-n\varphi_z)}S^-)$ 还原回 $S_x, S_y$，即得精确的常系数有效哈密顿量：
      $$H_{I,\text{eff}}^{(n)} = \Delta_n S_z + J_n(\chi)\Omega\big[\cos(\varphi - n\varphi_z)S_x + \sin(\varphi - n\varphi_z)S_y\big]$$
      **教材勘误提示：** 原讲义式 (1.32) 在 $\cos(\varphi - n\varphi_z)$ 后漏印了算符 $S_x$，必须补齐 $S_x$ 才是合法的横向自旋耦合项。

      ### 贝塞尔符号宇称与不可分辨边带区

      注意负阶贝塞尔函数满足宇称恒等式 $J_{-n}(\chi) = (-1)^n J_n(\chi)$。当 $n$ 为负奇数（如 $n=-1$）且 $0 < \chi < 3.83$ 时，$J_{-1}(\chi) < 0$，等效于将横平面驱动轴额外翻转 $\pi$（而有效横向耦合强度大小仍为 $|J_n(\chi)|\Omega$）。此外，相位组合 $\varphi - n\varphi_z$ 说明纵向调制初相位 $\varphi_z$ 会按阶数 $n$ 线性传入有效旋转轴方位角，从而可通过调控 $\varphi_z$ 实现边带门控相移。

      相反，若调制频率 $\omega_z$ 很低（例如同时叠加了低频射频场）导致 $|J_n(\chi)\Omega| \ll \omega_z$ 不再成立，相邻边带的失谐不再远大于耦合强度，多阶边带将同时发生激发并产生干涉拍频。此时单边带近似完全失效，不能再用上式解析求解，必须对完整的含时哈密顿量作数值演化计算。
    worked: |
      承接上例（$\omega_0/(2\pi) = 2000\text{ MHz}$、$\omega_z/(2\pi) = 50\text{ MHz}$、$\Omega_z/(2\pi) = \Omega/(2\pi) = 10\text{ MHz}$，故 $\chi = 0.2$），将横向驱动频率调至 $\omega/(2\pi) = 2052\text{ MHz}$，取初相位 $\varphi = \pi/3$、$\varphi_z = \pi/6$。

      1. **筛选近共振边带并计算失谐 $\Delta_n/(2\pi)$。** 代入 $\Delta_n = \omega_0 - \omega + n\omega_z$：
         $$\frac{\Delta_{+1}}{2\pi} = 2000 - 2052 + 50 = -2\text{ MHz}, \qquad \frac{\Delta_0}{2\pi} = -52\text{ MHz}, \qquad \frac{\Delta_{+2}}{2\pi} = +48\text{ MHz}.$$
         因 $|J_1(0.2)\Omega|/(2\pi) \approx 0.995\text{ MHz} \ll 50\text{ MHz}$，可孤立保留 $n = +1$ 阶边带。

      2. **作二次变换 $U_2 = e^{+i\Delta_{+1} t S_z}$ 并计算有效相位角。** 由 $\varphi - (+1)\varphi_z = \frac{\pi}{3} - \frac{\pi}{6} = \frac{\pi}{6}$，代入修正后的式 (1.32) 得：
         $$\frac{H_{I,\text{eff}}^{(+1)}}{2\pi} = (-2\text{ MHz})S_z + 0.995\text{ MHz}\left(\cos\frac{\pi}{6}\,S_x + \sin\frac{\pi}{6}\,S_y\right).$$

      3. **写出在 $\{|m_S=+1/2\rangle, |m_S=-1/2\rangle\}$ 基下的矩阵形式。** 利用 $S_z = \frac{1}{2}\text{diag}(1,-1)$ 与 $\cos\frac{\pi}{6}S_x + \sin\frac{\pi}{6}S_y = \frac{1}{2}\begin{pmatrix} 0 & e^{-i\pi/6} \\ e^{i\pi/6} & 0 \end{pmatrix}$：
         $$\frac{H_{I,\text{eff}}^{(+1)}}{2\pi} \approx \begin{pmatrix} -1 & 0.4975\,e^{-i\pi/6} \\ 0.4975\,e^{+i\pi/6} & +1 \end{pmatrix}\text{ MHz} \approx \begin{pmatrix} -1 & 0.4309 - 0.2488i \\ 0.4309 + 0.2488i & +1 \end{pmatrix}\text{ MHz}.$$

      可见整个含时边带问题被精确化为了一个失谐为 $-2\text{ MHz}$、有效耦合幅值为 $0.995\text{ MHz}$ 的静态二能级共振问题。
    problems:
      - lsb-eff-basics
      - lsb-eff-self-explain
      - lsb-detuning-template
      - lsb-eff-spot-mistake
      - lsb-unresolved-regime-transfer

  - id: sideband-subharmonic-and-mas-transfer
    title: "倾斜线圈倍频激发与 MAS 边带迁移"
    tldr: |
      - 倾斜单线圈同时产生 $\Omega$ 与同频 $\Omega_z$（$\omega_z = \omega$），得倍频共振 $\omega = \frac{1}{1-n}\omega_0$（$n \le 0$）。
      - 取 $n=-1$ 可用 $\omega_0/2$ 跨越功放带宽，小 $\chi$ 下有效耦合 $|J_{-1}(\chi)|\Omega \approx \frac{\Omega_z\Omega}{2\omega}$。
      - 魔角旋转（MAS）周期调制 $S_z$ 各向异性，产生 $\omega_0 + n\omega_r$ 旋转边带。
    explain: |
      ### 倾斜单线圈下的同源倍频激发条件

      当实验中只有一根微波线圈且故意倾斜安装（$\theta_B \neq 90^\circ$）时，同一个交变源会同时产生横向耦合 $\Omega \propto B_x$ 与纵向调制 $\Omega_z \propto B_z$，因而纵向频率严格锁定为驱动频率 $\omega_z = \omega$（且 $\varphi_z = \varphi$）。将 $\omega_z = \omega$ 代入第 $n$ 阶边带失谐公式，令 $\Delta_n = 0$ 即得**倍频（亚谐波）激发条件**：
      $$\Delta_n = \omega_0 - \omega + n\omega = \omega_0 + (n - 1)\omega = 0 \implies \omega = \frac{1}{1 - n}\omega_0 \quad (n = 0, -1, -2, \dots)$$
      这里只有 $n \le 0$ 才对应正频率 $\omega > 0$：$n = 0$ 为基频共振 $\omega_0$；$n = -1$ 对应 $\omega = \omega_0/2$（吸取一个横向光子和一个同频纵向能量量子，共以二倍频跨越能隙）；$n = -2$ 对应 $\omega = \omega_0/3$。实际应用中，当自旋能隙（例如 $\omega_0/(2\pi) = 10\text{ GHz}$）超出实验室微波功放的带宽上限时，只需倾斜线圈并改用 $5\text{ GHz}$ 微波源驱动 $n = -1$ 阶边带即可实现共振翻转，必要时微调静磁场 $B_0$ 以对准目标能隙。

      ```svg
