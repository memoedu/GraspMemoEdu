      可见，单频驱动被调制成以 $\omega_0$ 为中心、间距为 $\omega_z$ 的共振梳 $\omega_0 + n\omega_z$，各阶强度由第一类贝塞尔函数 $|J_n(\chi)|$ 调控；当 $\chi \approx 2.4048$ 到达 $J_0(\chi)$ 首个零点时，$n=0$ 载波被完全抑制，能量转入 $n=\pm 1, \pm 2$ 等边带。
    worked: |
      设自旋静态跃迁频率 $\omega_0/(2\pi) = 2000\text{ MHz}$，沿 $z$ 轴施加幅值 $\Omega_z/(2\pi) = 10\text{ MHz}$、调制频率 $\omega_z/(2\pi) = 50\text{ MHz}$（初相位 $\varphi_z = 0$）的纵向交流场，并配合横向驱动幅值 $\Omega/(2\pi) = 10\text{ MHz}$（$\varphi = 0$）。

      1. **计算纵向调制指数 $\chi$ 并写出含时变换 $U_i(t)$。** 由定义直接相除：
         $$\chi = \frac{\Omega_z}{\omega_z} = \frac{10\text{ MHz}}{50\text{ MHz}} = 0.2, \qquad U_i(t) = \exp\!\Big(-i\big[\omega_0 t + 0.2\sin(\omega_z t)\big]S_z\Big).$$

      2. **写出修正后的边带展开式并读出共振位置。** 保留 $S^+$ 前的 $\frac{1}{2}$ 因子并代入 $\varphi = \varphi_z = 0$ 与 $\chi = 0.2$：
         $$H_I = \frac{1}{2}\sum_{n=-\infty}^{\infty} J_n(0.2)\Omega\, e^{i(\omega_0 - \omega + n\omega_z)t} S^+ + \text{h.c.}$$
         由共振条件 $\omega_0 - \omega + n\omega_z = 0$ 得等间距边带频率 $\omega/(2\pi) = 2000 + 50n\text{ MHz}$：
         $$n=0: 2000\text{ MHz},\qquad n=\pm 1: 2050\text{ / }1950\text{ MHz},\qquad n=\pm 2: 2100\text{ / }1900\text{ MHz}.$$

      3. **计算前几阶边带的有效横向耦合幅度 $|J_n(0.2)|\Omega/(2\pi)$。** 利用 $J_0(0.2) \approx 0.9900$、$|J_{\pm 1}(0.2)| \approx 0.09950$、$|J_{\pm 2}(0.2)| \approx 0.004983$：
         $$|J_0(0.2)|\frac{\Omega}{2\pi} \approx 9.900\text{ MHz},\qquad |J_{\pm 1}(0.2)|\frac{\Omega}{2\pi} \approx 0.995\text{ MHz},\qquad |J_{\pm 2}(0.2)|\frac{\Omega}{2\pi} \approx 0.0498\text{ MHz}.$$

      各阶有效耦合均小于间距 $50\text{ MHz}$，各边带清晰分离。
