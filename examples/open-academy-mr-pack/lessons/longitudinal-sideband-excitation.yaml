      在小调制极限 $\chi = \Omega_z / \omega \ll 1$ 下，由贝塞尔积分定义展开 $\cos(\alpha - \chi\sin\alpha) = \cos\alpha\cos(\chi\sin\alpha) + \sin\alpha\sin(\chi\sin\alpha)$：前项关于 $\alpha = \pi/2$ 奇对称而在 $[0,\pi]$ 积分为零，小 $\chi$ 下 $\sin(\chi\sin\alpha) \approx \chi\sin\alpha$，故 $J_1(\chi) \approx \frac{1}{\pi}\int_0^\pi \chi\sin^2\alpha\,d\alpha = \frac{\chi}{2}$，再由宇称得 $J_{-1}(\chi) = -J_1(\chi) \approx -\frac{\chi}{2}$。因此二倍频有效耦合强度 $|J_{-1}(\chi)|\Omega \approx \frac{\chi}{2}\Omega = \frac{\Omega_z\Omega}{2\omega}$ 与单线圈驱动幅度成**平方**正比，适当提高驱动功率即可保持可用操控速率。

      ### 迁移至固体核磁魔角旋转（MAS）边带

      同一套贝塞尔相位调制机制也支配着固体核磁共振的**魔角旋转（MAS）**。固体核自旋的化学位移各向异性与偶极耦合会在 $S_z$ 上引入依赖晶粒取向的频移；将样品绕与静磁场成魔角 $\arccos(1/\sqrt{3}) \approx 54.74^\circ$ 的转轴以机械角频率 $\omega_r$ 高速旋转后，静态平均偏移抵消，残留各向异性耦合随转角以 $\omega_r$ 谐波周期调制。进入含时相互作用图像积分并作 Jacobi–Anger 展开，谱线便在中心峰 $\omega_0$（$n=0$）两侧裂分为间隔 $\omega_r$ 的**旋转边带**（$\omega_0 + n\omega_r$）；提高转速 $\omega_r$ 会压低等效调制指数 $\chi$，将边带强度聚回中心峰。
    worked: |
      某电子自旋处于静磁场中，静态跃迁频率为 $\omega_0/(2\pi) = 10\text{ GHz} = 10000\text{ MHz}$，而实验室功放仅能输出 $6\text{ GHz}$ 以下微波。现将单根线圈倾斜放置，在 $\omega/(2\pi) = 5\text{ GHz} = 5000\text{ MHz}$ 处同时产生 $\omega_z = \omega$ 的调制。

      1. **确定共振边带阶次 $n$。** 代入同源共振公式 $\omega = \frac{1}{1-n}\omega_0$：
         $$5\text{ GHz} = \frac{10\text{ GHz}}{1 - n} \implies 1 - n = 2 \implies n = -1.$$

      2. **强驱动情形（$\Omega/(2\pi) = \Omega_z/(2\pi) = 50\text{ MHz}$）下的有效耦合。** 计算调制指数 $\chi$ 与 $n=-1$ 阶贝塞尔幅值：
         $$\chi = \frac{\Omega_z}{\omega} = \frac{50\text{ MHz}}{5000\text{ MHz}} = 0.01, \qquad |J_{-1}(0.01)| = |-J_1(0.01)| \approx \frac{\chi}{2} = 0.005,$$
         $$|J_{-1}(\chi)|\frac{\Omega}{2\pi} \approx 0.005 \times 50\text{ MHz} = 0.25\text{ MHz} = 250\text{ kHz}.$$
         注意由于 $\chi \ll 1$，此值几乎精确等于二次标度估算 $\frac{\Omega_z\Omega}{2\omega} / (2\pi) = \frac{50^2}{2\times 5000}\text{ MHz} = 250\text{ kHz}$。

      3. **对照弱驱动情形（$\Omega/(2\pi) = \Omega_z/(2\pi) = 10\text{ MHz}$）。** 此时 $\chi = \frac{10}{5000} = 0.002$，$|J_{-1}(0.002)| \approx 0.001$，有效耦合降为：
         $$|J_{-1}(0.002)|\frac{\Omega}{2\pi} \approx 0.001 \times 10\text{ MHz} = 10\text{ kHz}.$$

      将驱动幅度提高 $5$ 倍，二倍频有效耦合提升了 $5^2 = 25$ 倍（从 $10\text{ kHz}$ 跃升至 $250\text{ kHz}$），足以支撑实验中的弱激发调控。
