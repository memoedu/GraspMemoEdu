<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="共振赤道面控制几何：脉冲相位 beta 选择旋转轴 n_beta 与 X/Y 系列门矩阵">
  <defs>
    <marker id="u2l1xy-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#737373"/>
    </marker>
    <marker id="u2l1xy-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="640" height="300" fill="#ffffff"/>
  <text x="20" y="24" font-size="14" font-weight="700" fill="#171717" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">共振赤道面脉冲门 (δ = 0, θ = Ωt)</text>
  <text x="20" y="42" font-size="11.5" fill="#737373" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">驱动相位 β 决定赤道旋转轴 n_β = (cos β, sin β, 0)，脉宽决定转角 θ</text>
  <circle cx="152" cy="170" r="82" fill="#ffffff" fill-opacity="0" stroke="#d4d4d4" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="52" y1="170" x2="254" y2="170" stroke="#737373" stroke-width="1.6" marker-end="url(#u2l1xy-axis)"/>
  <line x1="152" y1="268" x2="152" y2="68" stroke="#737373" stroke-width="1.6" marker-end="url(#u2l1xy-axis)"/>
  <text x="258" y="174" font-size="11.5" font-weight="700" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">x (β=0)</text>
  <text x="160" y="74" font-size="11.5" font-weight="700" fill="#3b82f6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">y (β=π/2)</text>
  <path d="M182.0 170.0 A30 30 0 0 0 175.64 151.53" fill="#ffffff" fill-opacity="0" stroke="#f59e0b" stroke-width="1.8"/>
  <line x1="152" y1="170" x2="216.62" y2="119.52" stroke="#f59e0b" stroke-width="2.8" marker-end="url(#u2l1xy-amber)"/>
  <text x="193.6" y="155.68" font-size="12" font-weight="700" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">β</text>
  <text x="227.65" y="110.9" font-size="12" font-weight="700" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">n_β</text>
  <circle cx="234.0" cy="170.0" r="4.5" fill="#10b981"/>
  <circle cx="152.0" cy="88.0" r="4.5" fill="#3b82f6"/>
  <circle cx="152" cy="170" r="3" fill="#171717"/>
  <text x="202.0" y="188.0" font-size="11" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">(π/2)_x, (π)_x</text>
  <text x="58.0" y="94.0" font-size="11" fill="#3b82f6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">(π/2)_y, (π)_y</text>
  <text x="152" y="286" text-anchor="middle" font-size="11" fill="#737373" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">(θ)_β = cos(θ/2)I − i sin(θ/2) n_β·σ</text>
  <rect x="322" y="54" width="298" height="68" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.6"/>
  <text x="334" y="73" font-size="12" font-weight="700" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">(π/2)_x   [β = 0, θ = π/2]</text>
  <text x="334" y="99" font-size="12" fill="#171717" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">1/√2</text>
  <path d="M 374 80 L 368 80 L 368 112 L 374 112" fill="#ffffff" fill-opacity="0" stroke="#171717" stroke-width="1.4"/>
  <path d="M 434 80 L 440 80 L 440 112 L 434 112" fill="#ffffff" fill-opacity="0" stroke="#171717" stroke-width="1.4"/>
  <text x="386" y="92" text-anchor="middle" font-size="11.5" fill="#171717" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">1</text>
  <text x="420" y="92" text-anchor="middle" font-size="11.5" fill="#171717" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">-i</text>
  <text x="386" y="108" text-anchor="middle" font-size="11.5" fill="#171717" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">-i</text>
  <text x="420" y="108" text-anchor="middle" font-size="11.5" fill="#171717" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">1</text>
  <text x="452" y="99" font-size="11" fill="#737373" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">→ 复相干等权叠加</text>
  <rect x="322" y="132" width="298" height="68" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.6"/>
  <text x="334" y="151" font-size="12" font-weight="700" fill="#3b82f6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">(π/2)_y   [β = π/2, θ = π/2]</text>
  <text x="334" y="177" font-size="12" fill="#171717" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">1/√2</text>
  <path d="M 374 158 L 368 158 L 368 190 L 374 190" fill="#ffffff" fill-opacity="0" stroke="#171717" stroke-width="1.4"/>
  <path d="M 434 158 L 440 158 L 440 190 L 434 190" fill="#ffffff" fill-opacity="0" stroke="#171717" stroke-width="1.4"/>
  <text x="386" y="170" text-anchor="middle" font-size="11.5" fill="#171717" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">1</text>
  <text x="420" y="170" text-anchor="middle" font-size="11.5" fill="#171717" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">-1</text>
  <text x="386" y="186" text-anchor="middle" font-size="11.5" fill="#171717" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">1</text>
  <text x="420" y="186" text-anchor="middle" font-size="11.5" fill="#171717" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">1</text>
  <text x="452" y="177" font-size="11" fill="#737373" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">→ 实系数等权叠加</text>
  <rect x="322" y="210" width="298" height="72" rx="8" fill="#ffffff" stroke="#ef4444" stroke-width="1.6"/>
  <text x="334" y="229" font-size="12" font-weight="700" fill="#ef4444" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">(π)_x = -i σ_x   [β = 0, θ = π]</text>
  <path d="M 352 237 L 346 237 L 346 271 L 352 271" fill="#ffffff" fill-opacity="0" stroke="#171717" stroke-width="1.4"/>
  <path d="M 412 237 L 418 237 L 418 271 L 412 271" fill="#ffffff" fill-opacity="0" stroke="#171717" stroke-width="1.4"/>
  <text x="364" y="250" text-anchor="middle" font-size="11.5" fill="#171717" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">0</text>
  <text x="398" y="250" text-anchor="middle" font-size="11.5" fill="#171717" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">-i</text>
  <text x="364" y="266" text-anchor="middle" font-size="11.5" fill="#171717" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">-i</text>
  <text x="398" y="266" text-anchor="middle" font-size="11.5" fill="#171717" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">0</text>
  <text x="430" y="251" font-size="11" fill="#171717" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">比特翻转 (|0⟩ ↔ -i|1⟩)</text>
  <text x="430" y="268" font-size="10.5" fill="#ef4444" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">勘误: 讲义 p.7 误印为 (π)_π</text>
</svg>
