<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" aria-label="左图为自旋二分之一的两能级示意图，下能级 m_S 等于负二分之一与上能级 m_S 等于正二分之一之间的能级差为 omega_0，向上跃迁角动量变化为 +1；右图为 x-y 平面驱动场分解图，沿 x 轴的线偏振驱动场拆成幅度均为 Omega 的逆时针蓝色分量（角动量 +1，保留）与顺时针红色分量①（角动量 -1，被旋波近似舍去）。">
<defs>
<marker id="rwa1-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3b82f6"/></marker>
<marker id="rwa1-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#ef4444"/></marker>
<marker id="rwa1-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#f59e0b"/></marker>
<marker id="rwa1-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#10b981"/></marker>
<marker id="rwa1-dark" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#171717"/></marker>
</defs>
<g font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#171717">
<line x1="278" y1="22" x2="278" y2="278" stroke="#d4d4d4" stroke-width="1"/>
<text x="145" y="28" text-anchor="middle" font-size="14" font-weight="600">静态能级 (H₀ = ω₀ S_z)</text>
<line x1="115" y1="78" x2="225" y2="78" stroke="#171717" stroke-width="2.5"/>
<line x1="115" y1="222" x2="225" y2="222" stroke="#171717" stroke-width="2.5"/>
<text x="106" y="83" text-anchor="end">|m_S = +1/2⟩</text>
<text x="106" y="227" text-anchor="end">|m_S = -1/2⟩</text>
<line x1="168" y1="216" x2="168" y2="85" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#rwa1-amber)"/>
<text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="176" y="143" fill="#f59e0b">Δm_S = +1</text>
<text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="176" y="162" fill="#f59e0b">能隙 ω₀</text>
<text x="455" y="28" text-anchor="middle" font-size="14" font-weight="600">x-y 平面圆偏振分解 (+z 朝外)</text>
<circle cx="425.0" cy="165.0" r="82.0" fill="#ffffff" fill-opacity="0" stroke="#d4d4d4" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="323.0" y1="165.0" x2="592.23" y2="165.0" stroke="#d4d4d4" stroke-width="1.5" marker-end="url(#rwa1-dark)"/>
<line x1="425.0" y1="271.0" x2="425.0" y2="55.0" stroke="#d4d4d4" stroke-width="1.5" marker-end="url(#rwa1-dark)"/>
<text x="598.23" y="169.0">x</text>
<text x="432.0" y="59.0">y</text>
<line x1="489.62" y1="114.52" x2="489.62" y2="215.48" stroke="#d4d4d4" stroke-width="1.2" stroke-dasharray="3 3"/>
<line x1="489.62" y1="114.52" x2="554.23" y2="165.0" stroke="#d4d4d4" stroke-width="1.2" stroke-dasharray="3 3"/>
<line x1="489.62" y1="215.48" x2="554.23" y2="165.0" stroke="#d4d4d4" stroke-width="1.2" stroke-dasharray="3 3"/>
<line x1="425.0" y1="165.0" x2="554.23" y2="165.0" stroke="#10b981" stroke-width="2.5" marker-end="url(#rwa1-green)"/>
<text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="550.23" y="185.0" text-anchor="middle" fill="#10b981">合矢量 2Ω cos(ωt+φ)</text>
<line x1="425.0" y1="165.0" x2="489.62" y2="114.52" stroke="#3b82f6" stroke-width="3" marker-end="url(#rwa1-blue)"/>
<line x1="425.0" y1="165.0" x2="489.62" y2="215.48" stroke="#ef4444" stroke-width="3" marker-end="url(#rwa1-red)"/>
<path d="M510.65 119.46 A97.0 97.0 0 0 0 454.97 72.75" fill="#ffffff" fill-opacity="0" stroke="#3b82f6" stroke-width="2" marker-end="url(#rwa1-blue)"/>
<path d="M510.65 210.54 A97.0 97.0 0 0 1 454.97 257.25" fill="#ffffff" fill-opacity="0" stroke="#ef4444" stroke-width="2" marker-end="url(#rwa1-red)"/>
<path d="M453.0 165.0 A28 28 0 0 0 447.06 147.76" fill="#ffffff" fill-opacity="0" stroke="#737373" stroke-width="1.5"/>
<text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="476.71" y="155.33" fill="#737373">ωt+φ</text>
<text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="497.62" y="100.52" fill="#3b82f6">逆时针 (+1 保留)</text>
<text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="497.62" y="116.52" fill="#3b82f6">幅值 Ω</text>
<text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="497.62" y="229.48" fill="#ef4444">顺时针 (-1 忽略①)</text>
<text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="497.62" y="245.48" fill="#ef4444">幅值 Ω</text>
</g>
</svg>
