<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" aria-label="x-y 平面内三维旋转公式示意图：实验室坐标系中随时间转到角度 omega t 加 phi 的黑色矢量 r，沿橙色箭头绕 z 轴负方向（即顺时针）转动角度 omega t 后，回到固定角度 phi 的蓝色矢量 r'，坐标为 (cos phi, sin phi, 0)，从而消除时间变量 t。">
<defs>
<marker id="rwa2-dark" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#171717"/></marker>
<marker id="rwa2-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3b82f6"/></marker>
<marker id="rwa2-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#f59e0b"/></marker>
</defs>
<g font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#171717">
<path d="M360.0 240.0 A165.0 165.0 0 0 0 200.76 75.1" fill="#ffffff" fill-opacity="0" stroke="#d4d4d4" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="170.0" y1="240.0" x2="408.0" y2="240.0" stroke="#d4d4d4" stroke-width="1.5" marker-end="url(#rwa2-dark)"/>
<line x1="195.0" y1="265.0" x2="195.0" y2="47.0" stroke="#d4d4d4" stroke-width="1.5" marker-end="url(#rwa2-dark)"/>
<text x="414.0" y="244.0">x</text>
<text x="203.0" y="51.0">y</text>
<text x="181.0" y="256.0" fill="#737373">O</text>
<path d="M247.0 240.0 A52 52 0 0 0 242.13 218.02" fill="#ffffff" fill-opacity="0" stroke="#10b981" stroke-width="2"/>
<text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="261.39" y="229.28" fill="#10b981">φ</text>
<path d="M238.76 136.9 A112 112 0 0 1 296.51 192.67" fill="#ffffff" fill-opacity="0" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#rwa2-amber)"/>
<text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="283.92" y="151.92" fill="#f59e0b">顺时针转 ωt</text>
<line x1="195.0" y1="240.0" x2="259.47" y2="88.12" stroke="#171717" stroke-width="3" marker-end="url(#rwa2-dark)"/>
<line x1="195.0" y1="240.0" x2="344.54" y2="170.27" stroke="#3b82f6" stroke-width="3" marker-end="url(#rwa2-blue)"/>
<text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="267.47" y="82.12" font-weight="600">r⃗ = (cos(ωt+φ), sin(ωt+φ), 0)</text>
<text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="354.54" y="174.27" fill="#3b82f6" font-weight="600">r⃗' = (cos φ, sin φ, 0)</text>
<rect x="405" y="205" width="222" height="74" rx="6" fill="#ffffff" fill-opacity="0" stroke="#d4d4d4" stroke-width="1.2"/>
<text x="417" y="227" fill="#171717" font-weight="600">变换 U_i = exp(-i ω t S_z)</text>
<text x="417" y="248" fill="#737373">转轴 n⃗ = (0, 0, -1)，转角 θ = ωt</text>
<text x="417" y="268" fill="#3b82f6">转动后与时间 t 无关</text>
</g>
</svg>
