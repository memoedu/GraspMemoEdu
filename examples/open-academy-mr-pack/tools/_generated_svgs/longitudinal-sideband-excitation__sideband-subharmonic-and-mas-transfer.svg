<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" aria-label="倾斜线圈几何与同源倍频激发阶梯图：左图展示单根倾斜驱动线圈的磁场 B_ac 与静磁场 z 轴成非 90 度夹角 theta_B，同时投影出沿 x 轴的横向驱动 Omega 与沿 z 轴的同频纵向调制 Omega_z（满足 omega_z 等于 omega）；右图对比基频 n 等于 0（10 GHz，超出 6 GHz 功放带宽）、二倍频 n 等于负 1（5 GHz）与三倍频 n 等于负 2（约 3.33 GHz）如何跨越 10 GHz 自旋能隙。">
<defs>
<marker id="l4s2-dark" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#171717"/></marker>
<marker id="l4s2-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3b82f6"/></marker>
<marker id="l4s2-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#ef4444"/></marker>
<marker id="l4s2-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#f59e0b"/></marker>
<marker id="l4s2-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#10b981"/></marker>
</defs>
<g font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#171717">
<text x="140" y="24" text-anchor="middle" font-size="13.5" font-weight="600">倾斜单线圈同时产生 Ω 与 Ω_z</text>
<line x1="84.0" y1="222.0" x2="84.0" y2="48" stroke="#171717" stroke-width="1.8" marker-end="url(#l4s2-dark)"/>
<line x1="64.0" y1="206.0" x2="250" y2="206.0" stroke="#d4d4d4" stroke-width="1.5" marker-end="url(#l4s2-dark)"/>
<text x="91.0" y="55" font-weight="600">z (B₀)</text>
<text x="255" y="210.0">x</text>
<line x1="185.07" y1="115.0" x2="185.07" y2="206.0" stroke="#d4d4d4" stroke-width="1.3" stroke-dasharray="3 3"/>
<line x1="185.07" y1="115.0" x2="84.0" y2="115.0" stroke="#d4d4d4" stroke-width="1.3" stroke-dasharray="3 3"/>
<line x1="84.0" y1="206.0" x2="185.07" y2="206.0" stroke="#3b82f6" stroke-width="3" marker-end="url(#l4s2-blue)"/>
<line x1="84.0" y1="206.0" x2="84.0" y2="115.0" stroke="#ef4444" stroke-width="3" marker-end="url(#l4s2-red)"/>
<line x1="84.0" y1="206.0" x2="185.07" y2="115.0" stroke="#f59e0b" stroke-width="3" marker-end="url(#l4s2-amber)"/>
<path d="M122.64 171.21 A52.0 52.0 0 0 0 84.0 154.0" fill="#ffffff" fill-opacity="0" stroke="#737373" stroke-width="1.5"/>
<text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="89.0" y="138" font-size="11.5" fill="#737373">θ_B ≠ 90°</text>
<text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="189.07" y="107.0" font-size="12" fill="#f59e0b" font-weight="600">B_ac(ω)</text>
<text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="134.53" y="224.0" text-anchor="middle" font-size="12" fill="#3b82f6" font-weight="600">横向 Ω (ω)</text>
<text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="76.0" y="152" text-anchor="end" font-size="12" fill="#ef4444" font-weight="600">纵向 Ω_z</text>
<text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="76.0" y="168" text-anchor="end" font-size="11.5" fill="#ef4444">(ω_z = ω)</text>
<rect x="16" y="242" width="246" height="44" rx="6" fill="#ffffff" fill-opacity="0" stroke="#d4d4d4" stroke-width="1.2"/>
<text x="139" y="260" text-anchor="middle" font-size="11.5" fill="#171717">单源倾斜: ω_z = ω，调制指数 χ = Ω_z / ω</text>
<text x="139" y="278" text-anchor="middle" font-size="11.5" fill="#737373">共振条件 ω = ω₀ / (1 - n) (n = 0, -1, -2...)</text>
<line x1="278" y1="18" x2="278" y2="286" stroke="#d4d4d4" stroke-width="1"/>
<text x="458" y="24" text-anchor="middle" font-size="13.5" font-weight="600">倍频激发阶梯：5 GHz 驱动 10 GHz 跃迁</text>
<line x1="298" y1="74.0" x2="554" y2="74.0" stroke="#171717" stroke-width="2.2"/>
<line x1="298" y1="202.0" x2="554" y2="202.0" stroke="#171717" stroke-width="2.2"/>
<text x="560" y="78.0" font-size="12" font-weight="600">|+1/2⟩</text>
<text x="560" y="206.0" font-size="12" font-weight="600">|-1/2⟩</text>
<line x1="604" y1="202.0" x2="604" y2="74.0" stroke="#737373" stroke-width="1.2" marker-end="url(#l4s2-dark)"/>
<text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="604" y="142" text-anchor="middle" font-size="11.5" fill="#737373">10 GHz</text>
<line x1="340" y1="199.0" x2="340" y2="79.0" stroke="#ef4444" stroke-width="2.2" stroke-dasharray="5 3" marker-end="url(#l4s2-red)"/>
<text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="340" y="55" text-anchor="middle" font-size="11.5" fill="#ef4444" font-weight="600">n=0: ω₀</text>
<text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="340" y="140" text-anchor="middle" font-size="11" fill="#ef4444">10 GHz 超带宽</text>
<line x1="408" y1="138.0" x2="452" y2="138.0" stroke="#d4d4d4" stroke-width="1.4" stroke-dasharray="3 3"/>
<line x1="430" y1="199.0" x2="430" y2="142.0" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#l4s2-blue)"/>
<line x1="430" y1="135.0" x2="430" y2="79.0" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#l4s2-blue)"/>
<text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="430" y="55" text-anchor="middle" font-size="11.5" fill="#3b82f6" font-weight="600">n=-1: ω₀/2</text>
<text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="456" y="110" font-size="11" fill="#3b82f6">5 GHz</text>
<text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="456" y="175" font-size="11" fill="#3b82f6">5 GHz</text>
<line x1="504" y1="159.33" x2="544" y2="159.33" stroke="#d4d4d4" stroke-width="1.4" stroke-dasharray="3 3"/>
<line x1="504" y1="116.67" x2="544" y2="116.67" stroke="#d4d4d4" stroke-width="1.4" stroke-dasharray="3 3"/>
<line x1="524" y1="199.0" x2="524" y2="163.33" stroke="#10b981" stroke-width="2.2" marker-end="url(#l4s2-green)"/>
<line x1="524" y1="156.33" x2="524" y2="120.67" stroke="#10b981" stroke-width="2.2" marker-end="url(#l4s2-green)"/>
<line x1="524" y1="113.67" x2="524" y2="79.0" stroke="#10b981" stroke-width="2.2" marker-end="url(#l4s2-green)"/>
<text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="524" y="55" text-anchor="middle" font-size="11.5" fill="#10b981" font-weight="600">n=-2: ω₀/3</text>
<rect x="308.0" y="236" width="162.0" height="24" rx="4" fill="#ffffff" fill-opacity="0" stroke="#10b981" stroke-width="1.5"/>
<text x="389.0" y="252" text-anchor="middle" font-size="11.5" fill="#10b981" font-weight="600">功放可用带宽 (0–6 GHz)</text>
<line x1="308.0" y1="264" x2="605.0" y2="264" stroke="#171717" stroke-width="1.4" marker-end="url(#l4s2-dark)"/>
<circle cx="398.0" cy="264" r="4" fill="#10b981"/>
<circle cx="443.0" cy="264" r="4.5" fill="#3b82f6"/>
<line x1="470.0" y1="258" x2="470.0" y2="270" stroke="#737373" stroke-width="1.4" stroke-dasharray="2 2"/>
<circle cx="578.0" cy="264" r="4" fill="#ef4444"/>
<text x="398.0" y="282" text-anchor="middle" font-size="11" fill="#10b981" font-weight="600">3.33</text>
<text x="443.0" y="282" text-anchor="middle" font-size="11" fill="#3b82f6" font-weight="600">5 GHz</text>
<text x="470.0" y="282" text-anchor="middle" font-size="10.5" fill="#737373">6</text>
<text x="578.0" y="282" text-anchor="middle" font-size="11" fill="#ef4444" font-weight="600">10 GHz (超限)</text>
</g>
</svg>
